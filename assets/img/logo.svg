<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prismFill" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0fb5a8"/>
      <stop offset="1" stop-color="#0a6b66"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.25" stop-color="#ffb84d"/>
      <stop offset="0.5" stop-color="#ffe14d"/>
      <stop offset="0.7" stop-color="#4dff9e"/>
      <stop offset="0.85" stop-color="#4dd2ff"/>
      <stop offset="1" stop-color="#9b6dff"/>
    </linearGradient>
  </defs>
  <!-- incoming white beam -->
  <line x1="2" y1="34" x2="44" y2="50" stroke="#eafffb" stroke-width="3" stroke-linecap="round"/>
  <!-- prism triangle -->
  <path d="M48 26 L96 92 L24 92 Z" fill="url(#prismFill)" stroke="#7ff5e6" stroke-width="2.5" stroke-linejoin="round" opacity="0.92"/>
  <!-- dispersed rainbow beam -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="62" y1="62" x2="118" y2="40" stroke="#ff4d6d"/>
    <line x1="62" y1="62" x2="118" y2="52" stroke="#ffb84d"/>
    <line x1="62" y1="62" x2="118" y2="62" stroke="#ffe14d"/>
    <line x1="62" y1="62" x2="118" y2="72" stroke="#4dff9e"/>
    <line x1="62" y1="62" x2="118" y2="82" stroke="#4dd2ff"/>
    <line x1="62" y1="62" x2="118" y2="92" stroke="#9b6dff"/>
  </g>
</svg>
