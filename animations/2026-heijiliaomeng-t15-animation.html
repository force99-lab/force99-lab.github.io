<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026黑吉辽蒙T15 · 时间分辨-能量分析仪</title>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--ink:#1a1a2e;--muted:#555;
  --accent:#e94560;--accent2:#0f3460;--line:#e6ebf0;
}
*{box-sizing:border-box;margin:0;padding:0}
@counter-style circled{system:fixed;symbols:①②③④⑤⑥⑦⑧⑨;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7}
html{scroll-behavior:smooth}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#0f3460,#1a1a2e);padding:12px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.nav a{background:rgba(255,255,255,.12);color:#fff;text-decoration:none;
  display:inline-block;padding:9px 26px;border-radius:20px;cursor:pointer;font-size:15px;font-weight:600;transition:.25s}
.nav a:hover{background:var(--accent)}
.page{max-width:1100px;margin:0 auto;padding:22px 16px;scroll-margin-top:70px}
.sec-title{color:var(--accent2);font-size:20px;margin:6px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--accent);text-align:center}

/* 页面① 试题 */
.p1-card{max-width:900px;margin:0 auto;background:var(--card);border-radius:16px;
  box-shadow:0 4px 30px rgba(0,0,0,.08);padding:30px 40px;overflow:hidden}
.p1-header{text-align:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--accent)}
.p1-header h1{font-size:21px}
.p1-header .tag{display:inline-block;background:linear-gradient(135deg,#e94560,#ff6b6b);
  color:#fff;padding:4px 16px;border-radius:12px;font-size:13px;margin-top:7px;font-weight:600}
.p1-article{font-size:15.5px;line-height:1.95;color:#333}
.p1-article p{margin-bottom:12px;text-indent:2em}
.p1-figure{float:right;width:310px;margin:4px 0 12px 22px;shape-outside:inset(0 0 0 0 round 12px);text-align:center}
.p1-figure img{max-width:100%;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.p1-figure figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.hl{color:var(--accent);font-weight:700}
.questions{list-style:none;margin:0;padding-top:6px;border-top:1px solid var(--line);clear:both;counter-reset:q}
.questions li{margin:4px 0;line-height:1.8;font-size:15px;font-weight:700;padding-left:1.8em;text-indent:-1.8em}
.questions li::before{counter-increment:q;content:counter(q,circled);color:var(--accent);font-weight:700;margin-right:6px}
.param-box{clear:both;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;
  padding:14px 18px;background:#f8f9ff;border-radius:10px;border-left:4px solid var(--accent2)}
.param-item{background:#fff;padding:5px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--accent2);box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* 页面② 动画 */
.anim-card{background:var(--card);border-radius:16px;box-shadow:0 4px 30px rgba(0,0,0,.08);padding:18px;margin-bottom:20px}
.anim-card svg{width:100%;height:auto;display:block;border-radius:12px}
.legend{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* 页面③ 解题 */
.solve-grid{display:grid;grid-template-columns:230px 1fr 320px;gap:20px}
.solve-left img{max-width:100%;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.solve-left .param-table{margin-top:10px;font-size:13px;line-height:1.8}
.solve-left .param-table b{color:var(--accent2)}
.solve-mid h3{color:var(--accent2);font-size:16px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
details.step{margin-bottom:14px;padding:12px 16px;background:#f8f9fc;border-radius:10px;border-left:3px solid var(--accent)}
details.step>summary{font-weight:700;color:var(--ink);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary::before{content:'\25B6';font-size:11px;color:var(--accent)}
details.step[open]>summary::before{content:'\25BC'}
.step-a{margin-top:8px;padding:8px 12px;background:#fff;border-radius:8px;font-size:14px;line-height:1.85;color:#333}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.92em}
.frac .num{border-bottom:1px solid #333;padding:0 3px}
.frac .den{padding:0 3px}
.coll{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.coll>summary{padding:10px 14px;background:#f8f9fc;cursor:pointer;font-weight:700;font-size:14px;
  color:var(--accent2);list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.coll>summary::-webkit-details-marker{display:none}
.coll>summary::before{content:'\25B6';font-size:11px}
.coll[open]>summary::before{content:'\25BC'}
.coll-body{padding:12px 14px;font-size:13.5px;line-height:1.8;color:#444}
@media(max-width:900px){.solve-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <a href="#page0">① 试题</a>
  <a href="#page1">② 动画演示</a>
  <a href="#page2">③ 解题过程</a>
</div>

<!-- ==================== 页面① 试题 ==================== -->



<!-- ==================== 页面② 动画（三幅独立 SVG 面板） ==================== -->
<section class="page" id="page1">
<h2 class="sec-title">② 物理过程动画（自动循环 · 零 JS）</h2>

<!-- ===== 面板 A：全装置电子路径 ===== -->
<div class="anim-card">
<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 渐变 -->
  <radialGradient id="eglow_p1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#0088aa" stop-opacity=".6"/>
  </radialGradient>
  <linearGradient id="fieldBg_p1" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#e8f4fc" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#cde4f5" stop-opacity=".3"/>
  </linearGradient>
  <marker id="arrowR_p1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#e94560"/>
  </marker>
  <marker id="arrowB_p1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0f3460"/>
  </marker>
</defs>

<!-- 背景 -->
<rect width="920" height="560" fill="#f5f8fc" rx="12"/>

<!-- 标题 -->
<text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f3460">
  面板 A：电子全路径（加速→样品→磁场筛选→偏转→荧光屏）
</text>

<!-- === 1. 加速电场区域（竖直，电子向上加速） === -->
<rect x="72" y="430" width="36" height="60" fill="none" stroke="#0f3460" stroke-width="2" stroke-dasharray="5,3" rx="3"/>
<text x="90" y="502" text-anchor="middle" font-size="12" fill="#0f3460" font-weight="bold">加速电场</text>
<text x="90" y="516" text-anchor="middle" font-size="11" fill="#e94560" font-weight="bold">U₁</text>
<!-- 电场方向箭头（向上） -->
<line x1="82" y1="475" x2="82" y2="438" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR_p1)"/>

<!-- === 2. 样品（水平横线，电子竖直穿过） === -->
<line x1="55" y1="370" x2="125" y2="370" stroke="#e94560" stroke-width="3" stroke-linecap="round"/>
<text x="90" y="362" text-anchor="middle" font-size="12" fill="#e94560" font-weight="bold">样品</text>

<!-- === 3. 匀强磁场（半环形：外半环 R_OUT 与内半环 R_IN 围成） === -->
<path d="M 60 270
         A 180 180 0 0 1 420 270
         L 360 270
         A 120 120 0 0 0 120 270
         Z"
      fill="url(#fieldBg_p1)" stroke="#0f3460" stroke-width="2.5"/>
<!-- 外半环虚线标注 -->
<path d="M 60 270 A 180 180 0 0 1 420 270"
      fill="none" stroke="#0f3460" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
<!-- 内半环虚线标注 -->
<path d="M 120 270 A 120 120 0 0 1 360 270"
      fill="none" stroke="#0f3460" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
<!-- B⊗ 标记阵列（磁场垂直纸面向里） -->
<g font-size="13" fill="#0f3460" font-weight="bold" opacity=".65">
  <text x="170" y="230">⊗</text>
  <text x="240" y="210">⊗</text>
  <text x="310" y="230">⊗</text>
  <text x="190" y="290">⊗</text>
  <text x="290" y="290">⊗</text>
</g>
<text x="240" y="76" text-anchor="middle" font-size="12" fill="#0f3460" font-weight="bold">匀强磁场 B₀</text>
<!-- 半径标注（沿中心线指向半圆顶点，R 为粒子轨迹半径） -->
<line x1="240" y1="270" x2="240" y2="120"
      stroke="#555" stroke-width="1.2" marker-end="url(#arrowB_p1)"/>
<text x="246" y="134" font-size="12" fill="#555" font-weight="bold">R</text>

<!-- === 4. 偏转电场极板 M/N（竖直放置） === -->
<rect x="340" y="310" width="100" height="120"
      fill="none" stroke="#0f3460" stroke-width="2" rx="2"/>
<text x="390" y="304" text-anchor="middle" font-size="12" fill="#0f3460" font-weight="bold">M</text>
<text x="390" y="446" text-anchor="middle" font-size="12" fill="#0f3460" font-weight="bold">N</text>
<text x="390" y="374" text-anchor="middle"
      font-size="11" fill="#e94560" font-weight="bold">U₂</text>
<!-- 极板尺寸标注 -->
<text x="390" y="460" text-anchor="middle" font-size="10" fill="#888">L</text>
<text x="448" y="370" font-size="10" fill="#888">d</text>

<!-- === 5. 荧光屏（水平放置在 MN 正下方） === -->
<line x1="300" y1="500" x2="480" y2="500" stroke="#0f3460" stroke-width="4" stroke-linecap="round"/>
<text x="488" y="504" font-size="12" fill="#0f3460" font-weight="bold">荧光屏</text>
<!-- 中心轴向下延长线（参考线：电子无偏转落点） -->
<line x1="390" y1="430" x2="390" y2="500" stroke="#888" stroke-width="1" stroke-dasharray="4,3" opacity=".6"/>
<text x="386" y="516" text-anchor="end" font-size="10" fill="#888">中心轴</text>
<!-- 偏移 x₀ 标注 -->
<line x1="390" y1="488" x2="470" y2="488" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR_p1)"/>
<text x="408" y="484" text-anchor="middle" font-size="11" fill="#e94560" font-weight="bold">x₀</text>

<!-- === 6. 电子源 === -->
<circle cx="90" cy="530" r="8" fill="#e94560"/>
<text x="90" y="552" text-anchor="middle" font-size="11" fill="#e94560" font-weight="bold">电子源</text>

<!-- === 7. 电子轨迹（虚线路径预览 + 运动电子） === -->
<!-- 轨迹虚线：电子源→竖直加速→样品→磁场入口→凸向上半圆(180°)→出口→竖直落入荧光屏 -->
<path d="M 90 530
         L 90 430
         L 90 390
         L 90 270
         A 150 150 0 0 1 390 270
         L 390 500"
      fill="none" stroke="#00bcd4" stroke-width="1.5" stroke-dasharray="6,4" opacity=".5"/>

<!-- 运动电子（SMIL animateMotion 沿真实轨迹：竖直加速→凸向上半圆弧(180°)→竖直落屏） -->
<g>
  <animateMotion dur="6s" repeatCount="indefinite" rotate="0"
    path="M 90 530
         L 90 270
         A 150 150 0 0 1 390 270
         L 390 500"/>
  <circle cx="0" cy="0" r="6" fill="url(#eglow_p1)">
    <animate attributeName="r" values="4;7;5;6;7;6;5;4;4" keyTimes="0;0.06;0.10;0.14;0.32;0.50;0.72;0.88;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- 速度箭头（仅竖直加速段显示，磁场段隐藏以免方向误导） -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.10;0.24;0.28;1" dur="6s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#e94560" stroke-width="2" marker-end="url(#arrowR_p1)"/>
    <text x="8" y="-18" font-size="10" fill="#e94560" font-weight="bold">v</text>
  </g>
</g>

<!-- 出口标记（右侧缺口出射，电子向下） -->
<circle cx="390" cy="270" r="3" fill="#e94560" opacity=".6"/>
<text x="398" y="284" font-size="10" fill="#e94560">出口狭缝</text>

</svg>
<div class="legend">
  <span><i style="background:#00e5ff"></i>电子</span>
  <span><i style="background:#0f3460"></i>磁场/极板</span>
  <span><i style="background:#e94560"></i>电场/样品</span>
  <span><i style="border:2px dashed #00bcd4"></i>电子轨迹</span>
</div>
</div>

<!-- ===== 面板 B：磁场能量筛选原理 ===== -->
<div class="anim-card">
<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="eglow_pb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0088aa" stop-opacity=".5"/>
  </radialGradient>
</defs>
<rect width="900" height="400" fill="#f5f8fc" rx="12"/>
<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f3460">
  面板 B：磁场筛选——粒子竖直进入，仅半径R的电子沿半环内半圆(180°)从右缺口出射
</text>

<!-- 磁场区域（半环形：外半环 R=150 与内半环 R=130 围成，中心线 R=140） -->
<!-- 直径从(130,280)到(430,280)，圆心(280,280)，外弧顶(280,130)，内弧顶(280,150) -->
<path d="M 130 280 A 150 150 0 0 1 430 280 L 410 280 A 130 130 0 0 0 150 280 Z"
      fill="#e8f0fe" stroke="#0f3460" stroke-width="2" opacity=".4"/>
<!-- 外/内半环虚线标注 -->
<path d="M 130 280 A 150 150 0 0 1 430 280" fill="none" stroke="#0f3460" stroke-width="1" stroke-dasharray="3,2" opacity=".4"/>
<path d="M 150 280 A 130 130 0 0 1 410 280" fill="none" stroke="#0f3460" stroke-width="1" stroke-dasharray="3,2" opacity=".4"/>
<!-- B⊗ 标记（磁场垂直纸面向里，置于半环之间的中心线附近） -->
<g font-size="15" fill="#0f3460" font-weight="bold" opacity=".55">
  <text x="281" y="143">⊗</text>
  <text x="186" y="188">⊗</text>
  <text x="376" y="188">⊗</text>
</g>
<text x="280" y="112" text-anchor="middle" font-size="13" fill="#0f3460" font-weight="bold">B₀ ⊗ 向里</text>

<!-- 竖直入射路径（虚线，沿y方向） -->
<line x1="140" y1="370" x2="140" y2="280" stroke="#00bcd4" stroke-width="1.5" stroke-dasharray="4,3" opacity=".5"/>
<text x="130" y="330" font-size="10" fill="#00bcd4" text-anchor="end">v ↑ (竖直入射)</text>

<!-- 正确路径（半径 R=140，半圆180°：左缺口→弧顶→右缺口，始终在半环内） -->
<path d="M 140 280 A 140 140 0 0 1 420 280"
      fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-dasharray="none"/>
<circle cx="140" cy="280" r="4" fill="#00e5ff"/>
<circle cx="280" cy="140" r="4" fill="#00e5ff"/>
<circle cx="420" cy="280" r="4" fill="#00e5ff"/>
<text x="115" y="285" font-size="11" fill="#00bcd4" font-weight="bold" text-anchor="end">入射(竖直)</text>
<text x="432" y="285" font-size="11" fill="#00bcd4" font-weight="bold">出射(R)</text>
<!-- 半径标注（中心线 R） -->
<line x1="280" y1="280" x2="280" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrowB_p1)"/>
<text x="286" y="215" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">R</text>

<!-- 错误路径1：能量过高 → 半径过大(R=200)→ 穿出外半环 -->
<path d="M 140 280 A 200 200 0 0 1 540 280"
      fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
<text x="430" y="92" font-size="10" fill="#e94560">ΔEk 过大(穿出外半环)</text>

<!-- 错误路径2：能量过低 → 半径过小(R=90)→ 落入内半环之内 -->
<path d="M 140 280 A 90 90 0 0 1 320 280"
      fill="none" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
<text x="222" y="205" font-size="10" fill="#ff9800">ΔEk 过小(落入内半环)</text>

<!-- 入口狭缝（左缺口中点 x=140） -->
<line x1="140" y1="272" x2="140" y2="288" stroke="#333" stroke-width="3"/>
<text x="128" y="305" font-size="10" fill="#333" text-anchor="end">入口狭缝</text>

<!-- 出口狭缝（右缺口中点 x=420） -->
<line x1="420" y1="272" x2="420" y2="288" stroke="#333" stroke-width="3"/>
<text x="432" y="305" font-size="10" fill="#333">出口狭缝</text>

<!-- 正确电子沿 R 路径运动（竖直进入→凸向上圆弧→水平出射） -->
<g>
  <!-- 用 animateMotion 沿凸向上圆弧运动 -->
  <circle cx="0" cy="0" r="5" fill="url(#eglow_pb)" opacity="0">
    <animateMotion path="M 140 280 A 140 140 0 0 1 420 280"
                    dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.85;0.95;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- 公式说明框 -->
<rect x="580" y="70" width="300" height="150" rx="10" fill="#fff" stroke="#0f3460" stroke-width="1.5" opacity=".92"/>
<text x="730" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3460">筛选条件</text>
<text x="595" y="120" font-size="12" fill="#333">粒子竖直(y方向)进入磁场：</text>
<text x="595" y="142" font-size="12" fill="#333">洛伦兹力提供向心力：</text>
<text x="595" y="165" font-size="12" fill="#333">evB₀ = mv²/R　⇒　v = eB₀R/m</text>
<text x="595" y="190" font-size="12" fill="#333">⇒ Eₖ = e²B₀²R²/(2m)</text>
<text x="595" y="212" font-size="11" fill="#e94560">(仅此动能的电子能通过出口狭缝)</text>

</svg>
<div class="legend">
  <span><i style="background:#00e5ff"></i>正确路径(半径R, 半环内180°)</span>
  <span><i style="background:#e94560"></i>ΔEk 过大(穿出外半环)</span>
  <span><i style="background:#ff9800"></i>ΔEk 过小(落入内半环)</span>
</div>
</div>

<!-- ===== 面板 C：荧光屏脉冲序列与强度衰减 ===== -->
<div class="anim-card">
<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="screenGrad_pc" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#0a0a15"/>
  </linearGradient>
  <radialGradient id="dotGlow_pc" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="40%" stop-color="#00e5ff" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#0088aa" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="900" height="420" fill="#f5f8fc" rx="12"/>
<text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f3460">
  面板 C：荧光屏脉冲光斑序列（等间距 Δx · 强度指数衰减）
</text>
