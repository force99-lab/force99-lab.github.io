<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电场线动画 · 点电荷/同种/异种/平行板（2D·3D）</title>
<style>
  :root{
    --bg:#0a1216; --teal:#19c3b1; --teal2:#0e8d83; --red:#ff6e6e; --blue:#6ea0ff;
    --txt:#e8f2f0; --muted:#8aa39e; --panel:#0f1c23; --line:rgba(120,160,155,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;background:linear-gradient(180deg,#0e1a20,#0a1216);border-bottom:1px solid var(--line);}
  header h1{font-size:16px;margin:0;font-weight:700;color:var(--teal);white-space:nowrap;}
  header h1 small{color:var(--muted);font-weight:400;font-size:11px;margin-left:8px;}
  .ctrl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
  .ctrl input[type=range]{width:96px;accent-color:var(--teal);}
  .ctrl select{background:var(--panel);color:var(--txt);border:1px solid var(--teal2);border-radius:6px;padding:4px 6px;font-size:12px;}
  .ctrl b{color:var(--txt);font-family:Consolas,monospace;min-width:42px;text-align:right;}
  .btn{background:transparent;border:1px solid var(--teal2);color:var(--teal);
    padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12px;}
  .btn:hover{background:rgba(25,195,177,.12);}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .chk input{accent-color:var(--teal);}
  #main{flex:1;display:flex;min-height:0;}
  #stage{position:relative;flex:1;min-width:0;min-height:0;}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;}
  #stage canvas:active{cursor:grabbing;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>电场线三维动画 <small id="sub">等量异种电荷（正负点电荷）· 场线从正电荷动态生成至负电荷</small></h1>
    <label class="ctrl">电场类型
      <select id="ctype">
        <option value="pos">单个正点电荷 (+)</option>
        <option value="neg">单个负点电荷 (−)</option>
        <option value="same">等量同种电荷 (++)</option>
        <option value="dipole" selected>等量异种电荷 (正负点电荷)</option>
        <option value="cap">平行板电容器</option>
      </select>
    </label>
    <label class="ctrl">场线密度
      <select id="density">
        <option value="0">疏</option>
        <option value="1" selected>中</option>
        <option value="2">密</option>
      </select>
    </label>
    <label class="ctrl">视图
      <select id="view">
        <option value="3d" selected>三维立体</option>
        <option value="2d">二维平面</option>
      </select>
    </label>
    <label class="ctrl">生长速度 <input type="range" id="gen" min="0.2" max="3" step="0.1" value="1"><b id="genv">1.0×</b></label>
    <label class="ctrl">旋转速度 <input type="range" id="rot" min="0" max="2" step="0.1" value="0.6"><b id="rotv">0.6</b></label>
    <label class="chk"><input type="checkbox" id="auto" checked> 自动旋转</label>
    <label class="chk"><input type="checkbox" id="flow" checked> 显示流向</label>
    <button class="btn" id="regen">↺ 重新生成</button>
  </header>
  <div id="main">
    <div id="stage"><canvas id="mc"></canvas></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('mc'), ctx = cv.getContext('2d');

/* ============ 物理参数 ============ */
const S = 1.2;                       // 点电荷到原点距离（半间距）
const chargeA = [-S, 0, 0];          // 电荷 A（默认为正）
const chargeB = [ S, 0, 0];          // 电荷 B
const single  = [ 0, 0, 0];          // 单个点电荷位置（原点）
const r0 = 0.16;                     // 起始种子球半径
const ds = 0.03;                     // 追踪步长
const stopMinus = 0.13;              // 异种：到达负电荷判定

/* 平行板电容器参数（板在 x-z 平面，沿 y 分离）*/
const Lx = 1.2, Lz = 1.2;            // 板半宽
const gy = 0.8;                      // 板到中面半距（板位于 y=±gy 的内表面）
const dTop = 0.06, dBot = 0.06;      // 种子离上板、终止离下板的偏移
const capM = 9;                      // 板电荷网格密度（建模用）
const capGrid = {0:5, 1:7, 2:9};     // 场线种子网格密度（疏/中/密）

let chargesArr = [];                 // 当前类型的电荷集合 [{p,q}]
function buildCapCharges(){
  chargesArr = [];
  for(let i=0;i<capM;i++) for(let j=0;j<capM;j++){
    const x=-Lx + (i+0.5)/capM*(2*Lx);
    const z=-Lz + (j+0.5)/capM*(2*Lz);
    chargesArr.push({p:[x, gy, z], q:+1});   // 上板内表面 +
    chargesArr.push({p:[x,-gy, z], q:-1});   // 下板内表面 −
  }
}

/* 电场：E = Σ q·(p−c)/|p−c|³ */
function fieldAt(p){
  let Ex=0,Ey=0,Ez=0;
  for(const c of chargesArr){
    const dx=p[0]-c.p[0], dy=p[1]-c.p[1], dz=p[2]-c.p[2];
    let r2=dx*dx+dy*dy+dz*dz; let r=Math.sqrt(r2);
    if(r<1e-4){ r=1e-4; r2=r*r; }
    const k=c.q/(r2*r);
    Ex+=k*dx; Ey+=k*dy; Ez+=k*dz;
  }
  return [Ex,Ey,Ez];
}
function dist3(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]); }

/* 沿电场方向追踪场线（终止条件随类型变化）*/
function traceLine(seed, dir){
  if(dir===undefined) dir=1;
  const tp=$('ctype').value;
  const Rmax = (tp==='cap') ? 6.0 : 5.0;
  const maxSteps = (tp==='cap') ? 800 : 6000;
  const pts=[ seed.slice() ];
  let p=seed.slice();
  for(let i=0;i<maxSteps;i++){
    const E=fieldAt(p);
    const m=Math.hypot(E[0],E[1],E[2]);
    if(m<1e-9) break;
    p=[ p[0]+dir*E[0]/m*ds, p[1]+dir*E[1]/m*ds, p[2]+dir*E[2]/m*ds ];
    pts.push(p.slice());
    if(tp==='dipole'){ if(dist3(p,chargeB)<stopMinus) break; }
    else if(tp==='cap'){ if(p[1] <= -gy+dBot) break; }
    if(Math.hypot(p[0],p[1],p[2])>Rmax) break;
  }
  return pts;
}

/* ============ 场线生成（按类型 + 密度）============ */
const polarLists = { 0:[0,26,50,74], 1:[0,20,38,56,74], 2:[0,16,32,48,64,80] };
const azimuthCounts = {0:8, 1:12, 2:16};
const N2d = {0:12, 1:20, 2:28};      // 二维径向场线数量（单个电荷用）

let lines = [];
function buildLines(){
  lines = [];
  const tp=$('ctype').value;
  const d = parseInt($('density').value,10);

  /* —— 二维平面（x-y 截面，z=0，正交投影） —— */
  if(state.dim==='2d'){
    if(tp==='pos'){
      chargesArr=[{p:single,q:1}];
      const N=N2d[d];
      for(let k=0;k<N;k++){ const a=2*Math.PI*k/N, dir=[Math.cos(a),Math.sin(a),0];
        const seed=[single[0]+r0*dir[0], r0*dir[1], 0];
        const pts=traceLine(seed,1); if(pts.length>3) lines.push({pts,off:Math.random(),avgDepth:0}); }
    } else if(tp==='neg'){
      chargesArr=[{p:single,q:-1}];
      const N=N2d[d];
      for(let k=0;k<N;k++){ const a=2*Math.PI*k/N, dir=[Math.cos(a),Math.sin(a),0];
        const seed=[single[0]+r0*dir[0], r0*dir[1], 0];
        let pts=traceLine(seed,-1); pts.reverse();   // 反向追踪后翻转：pts[0]=无穷 → pts[末]=电荷
        if(pts.length>3) lines.push({pts,off:Math.random(),avgDepth:0}); }
    } else if(tp==='same'){
      chargesArr=[{p:chargeA,q:1},{p:chargeB,q:1}];
      for(const c of [chargeA,chargeB]){ const sign=c[0]<0?-1:1;
        for(const ad of polarLists[d]){ const a=ad*Math.PI/180;
          const dirs=(ad===0)?[[sign*Math.cos(a),0,0]]
                          :[[sign*Math.cos(a),Math.sin(a),0],[sign*Math.cos(a),-Math.sin(a),0]];
          for(const dir of dirs){ const seed=[c[0]+r0*dir[0], r0*dir[1], 0];
            const pts=traceLine(seed,1); if(pts.length>3) lines.push({pts,off:Math.random(),avgDepth:0}); } } }
    } else if(tp==='dipole'){
      chargesArr=[{p:chargeA,q:1},{p:chargeB,q:-1}];
      for(const ad of polarLists[d]){ const a=ad*Math.PI/180;
        const dirs=(ad===0)?[[Math.cos(a),0,0]]:[[Math.cos(a),Math.sin(a),0],[Math.cos(a),-Math.sin(a),0]];
        for(const dir of dirs){ const seed=[chargeA[0]+r0*dir[0], r0*dir[1], 0];
          const pts=traceLine(seed,1); if(pts.length>3) lines.push({pts,off:Math.random(),avgDepth:0}); } }
    } else { // 平行板电容器（x-y 切面：上板 + 线、下板 − 线，竖直场线）
      buildCapCharges();
      const N=capGrid[d];
      for(let i=0;i<N;i++){ const x=-Lx+(i+0.5)/N*(2*Lx);
        const seed=[ x, gy-dTop, 0 ];
        const pts=traceLine(seed,1); if(pts.length>3) lines.push({pts,off:Math.random(),avgDepth:0}); }
    }
    return;
  }

  /* —— 三维（原有球面种子） —— */
  if(tp==='same'){
    chargesArr=[{p:chargeA,q:1},{p:chargeB,q:1}];
    const polar=polarLists[d], naz=azimuthCounts[d];
    for(const c of [chargeA,chargeB]){
      const sign=c[0]<0?-1:1;          // 远离另一电荷的轴向
      for(const ad of polar){
        const a=ad*Math.PI/180;
        const azSet=(ad===0)?[0]:Array.from({length:naz},(_,k)=>2*Math.PI*k/naz);
        for(const bd of azSet){
          const dir=[ sign*Math.cos(a), Math.sin(a)*Math.cos(bd), Math.sin(a)*Math.sin(bd) ];
          const seed=[ c[0]+r0*dir[0], c[1]+r0*dir[1], c[2]+r0*dir[2] ];
          const pts=traceLine(seed,1);
          if(pts.length>3) lines.push({pts, off:Math.random(), avgDepth:0});
        }
      }
    }
  } else if(tp==='dipole'){
    chargesArr=[{p:chargeA,q:1},{p:chargeB,q:-1}];
    const polar=polarLists[d], naz=azimuthCounts[d];
    for(const ad of polar){
      const a=ad*Math.PI/180;
      const azSet=(ad===0)?[0]:Array.from({length:naz},(_,k)=>2*Math.PI*k/naz);
      for(const bd of azSet){
        const dir=[ Math.cos(a), Math.sin(a)*Math.cos(bd), Math.sin(a)*Math.sin(bd) ];
        const seed=[ chargeA[0]+r0*dir[0], r0*dir[1], r0*dir[2] ];
        const pts=traceLine(seed,1);
        if(pts.length>3) lines.push({pts, off:Math.random(), avgDepth:0});
      }
    }
  } else if(tp==='pos' || tp==='neg'){ // 单个点电荷（球面种子 → 三维呈球笼状）
    chargesArr=[{p:single, q:(tp==='neg'?-1:1)}];
    const polar=polarLists[d], naz=azimuthCounts[d];
    for(const ad of polar){ const a=ad*Math.PI/180;
      const azSet=(ad===0)?[0]:Array.from({length:naz},(_,k)=>2*Math.PI*k/naz);
      for(const bd of azSet){ const dir=[Math.cos(a),Math.sin(a)*Math.cos(bd),Math.sin(a)*Math.sin(bd)];
        const seed=[ single[0]+r0*dir[0], r0*dir[1], r0*dir[2] ];
        let pts=traceLine(seed, (tp==='neg')?-1:1);
        if(tp==='neg') pts.reverse();
        if(pts.length>3) lines.push({pts, off:Math.random(), avgDepth:0}); } }
  } else { // 平行板电容器
    buildCapCharges();
    const N=capGrid[d];
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      const x=-Lx+(i+0.5)/N*(2*Lx);
      const z=-Lz+(j+0.5)/N*(2*Lz);
      const seed=[ x, gy-dTop, z ];
      const pts=traceLine(seed,1);
      if(pts.length>3) lines.push({pts, off:Math.random(), avgDepth:0});
    }
  }
}

/* ============ 三维投影（偏航 + 俯仰，正交）============ */
let W=0,H=0,DPR=1, yaw=0.6, pitch=-0.35;
const view={cx:0,cy:0,scale:1};
function resize(){
  const r=cv.getBoundingClientRect();
  W=r.width; H=r.height; DPR=window.devicePixelRatio||1;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const tp=$('ctype').value;
  view.cx=W/2; view.cy=H/2;
  view.scale = (state.dim==='2d')
    ? (Math.min(W,H)*0.92)/2 / ((tp==='cap')?1.5:5.0)
    : Math.min(W,H)/(2*3.5);
  draw(performance.now());
}
const _ro=new ResizeObserver(()=>resize());
_ro.observe(cv);

function project(p){
  const x=p[0], y=p[1], z=p[2];
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1=x*cy+z*sy, y1=y, z1=-x*sy+z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const y2=y1*cp - z1*sp, z2=y1*sp + z1*cp, x2=x1;
  return { x: view.cx + x2*view.scale, y: view.cy - y2*view.scale, depth: z2 };
}

/* ============ 状态 ============ */
const state = { gen:0, genSpeed:1, rotSpeed:0.6, autoRot:true, showFlow:true, dim:'3d' };

/* ============ 绘制场线 ============ */
function drawLine(line, lp, now){
  const tp=$('ctype').value;
  const pts=line.pts; const n=pts.length;
  const count=Math.max(2, Math.floor(lp*n));
  const proj=pts.slice(0,count).map(project);
  if(proj.length<2) return;
  const a=proj[0], b=proj[proj.length-1];
  const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  if(tp==='same'||tp==='pos'){ g.addColorStop(0,'#ff6e6e'); g.addColorStop(1,'rgba(255,150,150,0.30)'); }
  else if(tp==='neg'){ g.addColorStop(0,'#6ea0ff'); g.addColorStop(1,'rgba(150,180,255,0.30)'); }
  else { g.addColorStop(0,'#ff6e6e'); g.addColorStop(1,'#6ea0ff'); }   // 异种 / 平行板：正红→负蓝
  ctx.strokeStyle=g; ctx.lineWidth=1.7; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a.x,a.y);
  for(let i=1;i<proj.length;i++) ctx.lineTo(proj[i].x,proj[i].y);
  ctx.stroke();
  line.avgDepth=(a.depth+b.depth)/2;
  // 生长中的亮头（位于延伸的最前端）
  if(lp<1 && lp>0){
    ctx.save();
    ctx.shadowColor='#fff'; ctx.shadowBlur=10;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(b.x,b.y,3.4,0,7); ctx.fill();
    ctx.restore();
  }
  // 流向粒子（沿整条线由“+”向“−”（或向外）流动）
  if(state.showFlow && lp>=1){
    const f=((now*0.00016) + line.off) % 1;
    const idx=f*(n-1); const i0=Math.floor(idx); const t=idx-i0;
    const p0=pts[i0], p1=pts[Math.min(i0+1,n-1)];
    const pp=project([ p0[0]+(p1[0]-p0[0])*t, p0[1]+(p1[1]-p0[1])*t, p0[2]+(p1[2]-p0[2])*t ]);
    ctx.fillStyle='rgba(255,238,170,.95)';
    ctx.beginPath(); ctx.arc(pp.x,pp.y,2.6,0,7); ctx.fill();
  }
}

/* ============ 绘制点电荷小球 ============ */
function drawCharge(pos, label){
  const s=project(pos);
  const col='#ff6e6e';
  const R=14;
  ctx.save();
  const grd=ctx.createRadialGradient(s.x,s.y,2,s.x,s.y,R*2.2);
  grd.addColorStop(0,col); grd.addColorStop(0.5,col+'aa'); grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(s.x,s.y,R*2.2,0,7); ctx.fill();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(s.x,s.y,R,0,7); ctx.fill();
  ctx.fillStyle='#04121a'; ctx.font='bold 18px Consolas,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, s.x, s.y+1);
  ctx.restore();
}

/* ============ 平行板绘制 ============ */
function drawQuad(corners, fill, stroke){
  const p=corners.map(project);
  ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<p.length;i++) ctx.lineTo(p[i].x,p[i].y);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=stroke; ctx.lineWidth=1.2; ctx.stroke();
}
function drawPlates(){
  const top=[[-Lx,gy,-Lz],[Lx,gy,-Lz],[Lx,gy,Lz],[-Lx,gy,Lz]];
  const bot=[[-Lx,-gy,-Lz],[Lx,-gy,-Lz],[Lx,-gy,Lz],[-Lx,-gy,Lz]];
  drawQuad(top,'rgba(255,110,110,.16)','rgba(255,110,110,.55)');
  drawQuad(bot,'rgba(110,160,255,.16)','rgba(110,160,255,.55)');
}
function drawCapLabels(){
  const t=project([0,gy,0]), b=project([0,-gy,0]);
  ctx.save();
  ctx.fillStyle='#ff9a9a'; ctx.font='bold 20px Consolas,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+', t.x, t.y);
  ctx.fillStyle='#9ab8ff'; ctx.fillText('−', b.x, b.y);
  ctx.restore();
}

/* ============ 中性点标记（同种电荷）============ */
function drawNullPoint(){
  const s=project([0,0,0]);
  ctx.save();
  ctx.strokeStyle='rgba(159,184,179,.7)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.arc(s.x,s.y,5,0,7); ctx.stroke();
  ctx.fillStyle='rgba(159,184,179,.85)'; ctx.font='11px sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('中性点 E=0', s.x+9, s.y);
  ctx.restore();
}

/* ============ 水印 ============ */
function drawWatermark(){
  ctx.save();
  ctx.fillStyle='rgba(159,184,179,.32)';
  ctx.font='600 14px Consolas,monospace';
  ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillText('force99', W-16, H-14);
  ctx.restore();
}

/* ============ 主绘制 ============ */
function draw(now){
  if(W===0) return;
  ctx.clearRect(0,0,W,H);
  const tp=$('ctype').value;
  if(tp==='cap') drawPlates();
  const order=lines.map((l,i)=>i);
  order.sort((i,j)=>lines[i].avgDepth - lines[j].avgDepth);
  const N=lines.length;
  for(const i of order){
    const lp=Math.max(0, Math.min(1, state.gen*(N+2) - i));
    drawLine(lines[i], lp, now);
  }
  if(tp==='same'){ drawCharge(chargeA,'+'); drawCharge(chargeB,'+'); drawNullPoint(); }
  else if(tp==='dipole'){ drawCharge(chargeA,'+'); drawCharge(chargeB,'−'); }
  else if(tp==='pos'){ drawCharge(single,'+'); }
  else if(tp==='neg'){ drawCharge(single,'−'); }
  else { drawCapLabels(); }

  ctx.save();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='12px sans-serif';
  if(tp==='same'){
    ctx.fillStyle='#ff6e6e'; ctx.fillText('● 正电荷', 18, H-46);
    ctx.fillStyle='rgba(159,184,179,.85)';
    ctx.fillText('电场线：从每个正电荷出发 → 延伸至无穷远（同种电荷不相接）', 18, H-28);
  } else if(tp==='dipole'){
    ctx.fillStyle='#ff6e6e'; ctx.fillText('● 正电荷', 18, H-46);
    ctx.fillStyle='#6ea0ff'; ctx.fillText('● 负电荷', 92, H-46);
    ctx.fillStyle='rgba(159,184,179,.85)';
    ctx.fillText('电场线：从正电荷出发 → 终止于负电荷', 18, H-28);
  } else if(tp==='pos'){
    ctx.fillStyle='#ff6e6e'; ctx.fillText('● 正点电荷', 18, H-46);
    ctx.fillStyle='rgba(159,184,179,.85)';
    ctx.fillText('电场线：从正电荷出发 → 向四周辐射延伸至无穷远', 18, H-28);
  } else if(tp==='neg'){
    ctx.fillStyle='#6ea0ff'; ctx.fillText('● 负点电荷', 18, H-46);
    ctx.fillStyle='rgba(159,184,179,.85)';
    ctx.fillText('电场线：从四周汇聚 → 终止于负电荷（箭头指向电荷）', 18, H-28);
  } else {
    ctx.fillStyle='#ff6e6e'; ctx.fillText('■ 正极板', 18, H-46);
    ctx.fillStyle='#6ea0ff'; ctx.fillText('■ 负极板', 96, H-46);
    ctx.fillStyle='rgba(159,184,179,.85)';
    ctx.fillText('板间为匀强电场（平行等距）· 边缘有边缘效应（外扩）', 18, H-28);
  }
  ctx.fillStyle = state.gen>=1 ? '#19c3b1' : '#ffd56b';
  ctx.font='bold 13px sans-serif';
  ctx.fillText(state.gen>=1 ? '✓ 场线生成完成' : '生成中… '+Math.round(state.gen*100)+'%', 18, 24);
  drawWatermark();
  ctx.restore();
}

/* ============ 循环 ============ */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  if(state.autoRot && state.dim==='3d') yaw += dt*0.4*state.rotSpeed;
  if(state.gen<1){ state.gen += dt*state.genSpeed*(1/5); if(state.gen>1) state.gen=1; }
  draw(now);
  requestAnimationFrame(loop);
}

/* ============ 文案 ============ */
function updateSub(){
  const tp=$('ctype').value;
  const name = tp==='pos' ? '单个正点电荷 (+)'
    : tp==='neg' ? '单个负点电荷 (−)'
    : tp==='same' ? '等量同种电荷 (++)'
    : tp==='dipole' ? '等量异种电荷（正负点电荷）'
    : '平行板电容器';
  const desc = tp==='pos' ? '电场线从正电荷向四周辐射延伸至无穷远'
    : tp==='neg' ? '电场线从四周汇聚终止于负电荷'
    : tp==='same' ? '场线从每个正电荷向外延伸，中点为中性点'
    : tp==='dipole' ? '场线从正电荷动态生成、终止于负电荷'
    : '板间匀强电场，边缘外扩';
  $('sub').textContent = name + ' · ' + desc;
}

/* ============ 交互 ============ */
$('ctype').addEventListener('change',()=>{ updateSub(); buildLines(); state.gen=0; });
$('density').addEventListener('change',()=>{ buildLines(); state.gen=0; });
$('view').addEventListener('change',()=>{ state.dim=$('view').value; if(state.dim==='2d'){ yaw=0; pitch=0; } buildLines(); state.gen=0; });
$('gen').addEventListener('input',e=>{ state.genSpeed=parseFloat(e.target.value); $('genv').textContent=state.genSpeed.toFixed(1)+'×'; });
$('rot').addEventListener('input',e=>{ state.rotSpeed=parseFloat(e.target.value); $('rotv').textContent=state.rotSpeed.toFixed(1); });
$('auto').addEventListener('change',e=> state.autoRot=e.target.checked);
$('flow').addEventListener('change',e=> state.showFlow=e.target.checked);
$('regen').addEventListener('click',()=>{ state.gen=0; });

// 鼠标拖拽旋转
let dragging=false, lx=0, ly=0;
cv.addEventListener('mousedown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
window.addEventListener('mouseup',()=> dragging=false);
window.addEventListener('mousemove',e=>{
  if(!dragging||state.dim!=='3d') return;
  yaw += (e.clientX-lx)*0.008;
  pitch += (e.clientY-ly)*0.008;
  pitch=Math.max(-1.45, Math.min(1.45, pitch));
  lx=e.clientX; ly=e.clientY;
});

/* ============ 启动 ============ */
updateSub();
buildLines();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
