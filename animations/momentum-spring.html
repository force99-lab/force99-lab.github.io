<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑块弹簧 · 动量模型</title>
<style>
  :root{
    --bg:#070b16; --bg2:#0d1426; --line:#1c2c4a; --grid:#13203a;
    --txt:#e8f0ff; --sub:#8fa6c8; --dim:#5b7099;
    --blue:#4ea3ff; --red:#ff5d6c; --yellow:#ffd24d; --green:#39d98a;
    --cyan:#36e0e0; --violet:#9d7bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 72% -10%,#16243f 0%,var(--bg) 60%);
    color:var(--txt);font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    overflow:hidden;display:flex;flex-direction:column;user-select:none}
  button{font-family:inherit;cursor:pointer;color:var(--txt)}
  /* header */
  .hd{flex:0 0 58px;display:flex;align-items:center;gap:16px;padding:0 22px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,32,58,.92),rgba(10,16,30,.6))}
  .hd h1{font-size:20px;font-weight:800;letter-spacing:1px}
  .hd .src{font-size:12px;color:var(--dim)}
  .hd .sp{flex:1}
  .tabs{display:flex;gap:8px}
  .fsbtn{border:1px solid var(--line); background:rgba(78,163,255,.08); border-radius:9px;
    padding:7px 13px; font-size:13px; margin-right:10px; color:var(--txt)}
  .fsbtn:hover{background:rgba(78,163,255,.2)}
  .tab{border:1px solid var(--line);background:rgba(28,44,74,.4);border-radius:10px;
    padding:8px 16px;font-size:14px;color:var(--sub);transition:.12s}
  .tab.on{background:linear-gradient(180deg,rgba(54,224,224,.22),rgba(54,224,224,.06));
    border-color:rgba(54,224,224,.55);color:var(--cyan);font-weight:700}
  /* part1 */
  #p1{flex:1;display:flex;flex-direction:column;min-height:0}
  #p2{flex:1;overflow:auto;padding:20px 24px 40px;display:none}
  #p2.on{display:block}
  .stage{flex:1;display:flex;min-height:0}
  .cvwrap{flex:1;position:relative;min-width:0}
  .cvbtns{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px}
  .cvbtn{border:1px solid var(--line);
    background:rgba(16,26,46,.82);border-radius:9px;padding:6px 12px;font-size:13px;
    color:var(--txt);backdrop-filter:blur(3px)}
  .cvbtn:hover{background:rgba(54,224,224,.16);border-color:rgba(54,224,224,.5)}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none}
  .side{flex:0 0 430px;border-left:1px solid #E2D8C4;background:#FBF7ED;
    overflow:auto;padding:12px 14px 14px;
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif}
  .khd{font-size:15.5px;font-weight:800;color:#050363;letter-spacing:1.5px;
    display:flex;align-items:center;gap:8px;margin:2px 0 10px}
  .khd::before{content:"";width:4px;height:16px;border-radius:2px;background:#e90c64}
  .side details{border:1px solid #E7DECC;border-radius:11px;margin:9px 0;background:#fff;
    box-shadow:0 1px 3px rgba(90,70,40,.07);overflow:hidden}
  .side details>summary{cursor:pointer;padding:10px 13px;font-size:16px;font-weight:800;
    color:#050363;list-style:none;background:#FCFAF4}
  .side details>summary::-webkit-details-marker{display:none}
  .side details>summary::before{content:"▸";color:#a70616;margin-right:8px;font-weight:700}
  .side details[open]>summary::before{content:"▾"}
  .side details .body{padding:5px 14px 13px;font-size:15.5px;line-height:1.85;color:#2b2b2b}
  .side .body p{margin:4px 0}
  .side .body b{color:#e90c64}
  .side .eq{font-family:"Microsoft YaHei","微软雅黑",sans-serif;color:#a70616;font-size:17px}
  /* 核心公式卡：整块高亮 */
  .side details.kcore{border:1px solid #F0C8D6;box-shadow:0 3px 12px rgba(233,12,100,.12)}
  .side details.kcore>summary{background:linear-gradient(180deg,#FDF1F5,#FFF);color:#e90c64}
  .side details.kcore>summary::before{color:#e90c64}
  .side .fx{display:flex;flex-direction:column;gap:2px;padding:8px 11px;margin:8px 0;
    border-radius:9px;background:#FDF9F0;border-left:3px solid #a70616}
  .side .fxlab{font-size:13.5px;color:#8A8074;font-weight:700;letter-spacing:.4px}
  .side .fx .eq{font-size:18.5px;font-weight:700;line-height:1.62}
  .side .fx.hot{border-left-color:#e90c64;background:#FDF3F6}
  .side .fx.hot .eq{color:#e90c64}
  .side .warn2{color:#8A2530;background:#FDF6F8;border-left:3px solid #e90c64;
    padding:9px 12px;border-radius:7px;margin:8px 0 2px;font-size:15px;line-height:1.8}
  /* 实时读数：固定面板最下方 */
  .rocard{margin:16px 0 4px;border:1px solid #E3D8C3;border-radius:11px;
    background:#F5EFE2;padding:11px 13px 12px;box-shadow:0 1px 3px rgba(90,70,40,.07)}
  .rohd{font-size:14.5px;font-weight:800;color:#050363;letter-spacing:1.5px;margin-bottom:9px;
    display:flex;align-items:center;gap:7px}
  .rohd::before{content:"";width:4px;height:14px;border-radius:2px;background:#050363}
  .rogrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
  .mrow{display:flex;flex-direction:column;gap:1px;padding:5px 10px;border-radius:8px;
    background:#fff;border:1px solid #E7DECC}
  .mrow span{font-size:13px;color:#7A7264;line-height:1.28}
  .mrow b{font-variant-numeric:tabular-nums;font-size:17px;color:#050363;line-height:1.3}
  .mrow.hot{background:#FDF3F6;border-color:#F0C8D6}
  .rogrid .mrow:last-child:nth-child(odd){grid-column:1 / -1;flex-direction:row;
    align-items:baseline;justify-content:space-between}
  .mrow.hot b{color:#e90c64}
  .ctrl{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(8,12,24,.92);
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px}
  .grp{display:flex;align-items:center;gap:8px;background:rgba(28,44,74,.4);
    border:1px solid var(--line);border-radius:10px;padding:5px 10px}
  .grp label{font-size:13px;color:var(--sub);white-space:nowrap}
  .grp input[type=range]{width:104px;accent-color:var(--cyan)}
  .val{font-size:13px;color:var(--cyan);min-width:50px;text-align:right;font-variant-numeric:tabular-nums}
  .btn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(78,163,255,.18),rgba(78,163,255,.06));
    border-radius:9px;padding:8px 16px;font-size:14px;font-weight:600}
  .btn:hover{filter:brightness(1.25)}
  /* part2 */
  .p2head{font-size:15px;color:var(--sub);margin-bottom:14px;line-height:1.7}
  .p2head b{color:var(--cyan)}
  .qcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;
    background:linear-gradient(160deg,rgba(30,46,78,.42),rgba(11,17,32,.7))}
  .qtag{font-size:12px;color:var(--cyan);border:1px solid var(--line);border-radius:9px;
    padding:2px 9px;display:inline-block;margin-bottom:8px}
  .qtext{font-size:15px;line-height:1.92}
  .qfig{margin:10px 0;text-align:center}
  .qfig img{max-height:230px;max-width:60%;object-fit:contain;border-radius:8px;
    background:#fff;padding:6px}
  .opts{margin:8px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;font-size:14.5px}
  .opts div{padding:3px 0}
  .ansline{margin-top:8px;font-size:14px;color:var(--green);font-weight:700}
  .qcard details{background:rgba(10,17,32,.5)}
  .qcard .body{font-size:14px;line-height:1.95;color:var(--txt)}
  .qcard .body .step{margin:6px 0}
  .meth{border:1px solid rgba(54,224,224,.35);background:rgba(54,224,224,.06);
    border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.85;color:var(--sub)}
  .meth b{color:var(--cyan)}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:8px}

  /* ===== 第二部分：奶白主题（微软雅黑 · 投影大字号 · 三色体系） ===== */
  #p2{background:#FBF7ED; color:#1b1b1b;
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif}
  #p2 .meth{background:#fff; border:1px solid #E6DDCB; color:#050363;
    box-shadow:0 1px 3px rgba(90,70,40,.06); font-size:21px; line-height:1.85}
  #p2 .meth b{color:#e90c64}
  #p2 .qcard{background:#fff; border:1px solid #E7DECC; box-shadow:0 2px 6px rgba(90,70,40,.07);
    color:#1b1b1b; padding:18px 22px}
  #p2 .qtag{color:#050363; border-color:#DCD2BE; background:#F5EFE2; font-size:16px}
  /* 左文右图：紧贴、无空隙 */
  #p2 .qmain{display:flex; gap:14px; align-items:flex-start; margin-top:8px}
  #p2 .qcol{flex:1; min-width:0}
  #p2 .qtext{color:#1b1b1b; font-size:24px; line-height:1.85}
  #p2 .opts{color:#1b1b1b; font-size:24px; line-height:1.68; margin:8px 0 2px;
    display:grid; grid-template-columns:1fr 1fr; gap:4px 26px}
  #p2 .opts b{color:#e90c64}
  #p2 .qfig{flex:0 0 26%; max-width:300px; margin:0}
  #p2 .qfig img{width:100%; max-width:100%; max-height:212px; object-fit:contain; background:#fff;
    border:1px solid #E7DECC; padding:4px; border-radius:6px}
  /* 思路 / 解答 / 答案：全部默认隐藏 */
  #p2 details{background:#FCFAF4; border-color:#E7DECC; margin:9px 0}
  #p2 details>summary{color:#050363; font-size:22px; padding:10px 14px}
  #p2 details>summary::before{color:#a70616}
  #p2 .qcard .body{color:#050363; font-size:24px; line-height:1.88}
  #p2 .qcard .body b{color:#e90c64}
  #p2 .qcard .body .step{color:#050363; margin:7px 0}
  #p2 .eq{font-family:"Microsoft YaHei","微软雅黑",sans-serif; color:#a70616; font-size:24px}
  #p2 .ansd{background:#FDF6F8; border-color:#F0C8D6}
  #p2 .ansd>summary{color:#e90c64}
  #p2 .ansd .body{color:#050363; font-size:22px}
  #p2 .ansd .body b{color:#e90c64}
  #p2 .foot{color:#7a6f5c; font-size:14px}

  /* ===== 上下式分式 & 根号 ===== */
  .frac{display:inline-flex; flex-direction:column; align-items:center;
    vertical-align:middle; margin:0 .16em; line-height:1.04; font-size:.82em;
    position:relative; top:-.04em; text-align:center}
  .frac .num{border-bottom:1.4px solid currentColor; padding:0 .26em .05em; white-space:nowrap}
  .frac .den{padding:.05em .26em 0; white-space:nowrap}
  .sqrt{display:inline-flex; align-items:flex-start}
  .sqrt .rad{border-top:1.4px solid currentColor; padding:.10em .22em 0; margin-left:.02em}

  /* 宽题图：压轴题等横向大图 */
  #p2 .qcard.wide .qfig{flex:0 0 44%; max-width:580px}
  /* 大图版式：横向宽图（多图合并、带坐标图的题） */
  #p2 .qcard.big .qfig{flex:0 0 50%; max-width:660px}
  #p2 .qcard.big .qfig img{max-height:400px}
  #p2 .qcard.wide .qfig img{max-height:330px}

  /* 解答内插图（如原题 v-t 图） */
  #p2 .qfigsolve{margin:12px 0 6px;text-align:center}
  #p2 .qfigsolve img{max-height:320px;max-width:100%;object-fit:contain;background:#fff;
    border:1px solid #E7DECC;padding:6px;border-radius:6px}
  #p2 .qfigsolve .cap{font-size:16px;color:#7a6f5c;margin-top:6px}
</style>
</head>
<body>
<div class="hd">
  <h1 id="mTitle">—</h1>
  <span class="src" id="mSub"></span>
  <span class="sp"></span>
  <button class="fsbtn" id="fsBtn">⛶ 全屏</button>
  <div class="tabs">
    <button class="tab on" data-tab="p1">① 动画仿真 + 知识归纳</button>
    <button class="tab" data-tab="p2">② 典型例题 + 解答</button>
  </div>
</div>
<div id="p1">
  <div class="stage">
    <div class="cvwrap">
      <canvas id="cv"></canvas>
    </div>
    <div class="side" id="side"></div>
  </div>
  <div class="ctrl" id="ctrl"></div>
</div>
<div id="p2"></div>
<script>
"use strict";
/* ================= 7 个动量模型 ================= */
const fr = (n,d)=> '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
const MODELS = {};

/* ---------- 2 碰撞模型 ---------- */
MODELS.m2 = {
  id:"m2", name:"碰撞模型", sub:"弹性 / 非弹性 / 完全非弹性 · 动量守恒",
  cam:{yaw:0.55,pitch:0.26}, scale:0.80,
  graphT:3,
  hist:[],
  traces:[{name:"v₁",color:"#4ea3ff",idx:0},{name:"v₂",color:"#ff5d6c",idx:1}],
  params:[
    {key:"ratio",label:"质量比 m₂:m₁",min:0.2,max:5,step:0.1,value:2,dec:1},
    {key:"v1",label:"m₁ 碰前速度 v₁",min:0,max:8,step:0.5,value:6,dec:1,unit:" m/s"},
    {key:"v2",label:"m₂ 碰前速度 v₂",min:-6,max:6,step:0.5,value:0,dec:1,unit:" m/s"},
    {key:"e",label:"恢复系数 e",min:0,max:1,step:0.05,value:1,dec:2}
  ],
  legend:[["#4ea3ff","蓝球 m₁（入射）"],["#ff5d6c","红球 m₂（被碰）"],["#ffd24d","速度矢量"],["#36e0e0","光滑水平面 / 刻度"]],
  knowledge:`
    <details open class="kcore"><summary>一、核心公式</summary><div class="body">
      <div class="fx"><span class="fxlab">① 动量守恒（一切碰撞都成立）</span><span class="eq">m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′</span></div>
      <div class="fx"><span class="fxlab">② 弹性碰撞 · 动能守恒</span><span class="eq">½m₁v₁² + ½m₂v₂² = ½m₁v₁′² + ½m₂v₂′²</span></div>
      <div class="fx"><span class="fxlab">③ 一动碰一静（v₂ = 0，弹性）</span><span class="eq">v₁′ = ${fr("m₁−m₂","m₁+m₂")}v₁</span><span class="eq">v₂′ = ${fr("2m₁","m₁+m₂")}v₁</span></div>
      <div class="fx hot"><span class="fxlab">④ 完全非弹性 · 碰后共速（损失最大）</span><span class="eq">v = ${fr("m₁v₁ + m₂v₂","m₁+m₂")}</span><span class="eq">ΔEₖ = ${fr("m₁m₂(v₁−v₂)²","2(m₁+m₂)")}</span></div>
    </div></details>
    <details><summary>二、三类碰撞对比</summary><div class="body">
      <p>动量<b>都守恒</b>；机械能：弹性守恒、非弹性有损失、完全非弹性损失最大。</p>
      <p>恢复系数：<span class="eq">e=1</span> 弹性，<span class="eq">0&lt;e&lt;1</span> 非弹性，<span class="eq">e=0</span> 完全非弹性（碰后共速）。</p>
      <p>恢复系数定义（<b>v₂ ≠ 0 时也用这个</b>）：<span class="eq">v₂′ − v₁′ = e(v₁ − v₂)</span></p>
      <p>碰后速度通式（v₂ ≠ 0 时同样适用）：</p>
      <p><span class="eq">v₁′ = ${fr("(m₁−em₂)v₁ + (1+e)m₂v₂","m₁+m₂")}</span></p>
      <p><span class="eq">v₂′ = ${fr("(m₂−em₁)v₂ + (1+e)m₁v₁","m₁+m₂")}</span></p>
    </div></details>
    <details><summary>三、碰撞三原则</summary><div class="body">
      <p>① 动量守恒；② 碰后总动能不增加（<span class="eq">Eₖ′ ≤ Eₖ</span>）；③ 速度合理：同向时后球速度不大于前球（<span class="eq">v₁′ ≤ v₂′</span>）。</p>
      <p>三条同时满足才可能是真实碰撞；解题常先用①②排除选项。</p>
    </div></details>
    <details><summary>四、易错</summary><div class="body">
      <div class="warn2">
        ① <span class="eq">m₁=m₂</span> 弹性碰后<b>交换速度</b>（不是都停下）；<br>
        ② <span class="eq">m₁&lt;m₂</span> 碰后反弹，速度取负号；<br>
        ③ 完全非弹性<b>不是</b>「动能守恒」，是动能损失最大；<br>
        ④ 有初速 v₂ 时，公式③不能直接用，须用①②联立或用⑤；<br>
        ⑤ 碰后 <span class="eq">v₂′ − v₁′ = e(v₁ − v₂)</span> 中速度都要带符号。
      </div>
    </div></details>`,
  examples:`
    <div class="qcard"><span class="qtag">基础 · 变式1-1 · 2026·贵州·高考真题</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图，完全相同的均质小球 A、B 被不可伸长的细线悬挂，静止在同一竖直平面内，相互接触无挤压，悬挂点到球心的距离分别为 L 和 ${fr("4","5")}L，A 被拉至与竖直方向成 60° 的位置并由静止释放，随后与 B 发生弹性正碰。忽略空气阻力，B 的球心上升的最大高度为（　　）</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">A 下摆：机械能守恒求碰前速度；两球等质量弹性正碰 ⇒ 交换速度；B 上摆：机械能守恒求高度。两步能量 + 一个结论，属基础题。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A 下摆：<span class="eq">mgL(1−cos60°) = ½mv_A² ⇒ v_A = √(gL)</span></div>
        <div class="step">等质量弹性正碰：<span class="eq">v_B′ = v_A = √(gL)</span></div>
        <div class="step">B 上摆：<span class="eq">mgh = ½mv_B′² ⇒ h = ${fr("gL","2g")} = ${fr("1","2")}L</span>，故选 A。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>A（½L）</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 弹性碰撞 ⇒ 用「一动碰一静」的 v₂′ 公式，把 m₂ 作为未知量。</div>
        <div class="step">② 乙恰好到 D ⇒ D 点速度为 0，由机械能守恒把 v₂′ 与 R 挂钩。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">弹性碰撞：<span class="eq">v₂′ = ${fr("2m₁","m₁+m₂")}v₀ = ${fr("6","3+m₂")}×5</span></div>
        <div class="step">恰好到 D（比 C 高 R）：<span class="eq">½m₂v₂′² = m₂gR ⇒ v₂′ = √(2gR) = 4 m/s</span></div>
        <div class="step"><span class="eq">${fr("30","3+m₂")} = 4 ⇒ m₂ = 4.5 kg</span>，故选 C。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>C（4.5 kg）</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">失重 ⇒ 碰后匀速，位移比 = 速率比；用动量守恒 + 动能守恒求质量比。</div>
        <div class="step">相同速率相向碰：注意速度方向，列矢量式再解。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">设大球质量 M，每格 x，时间 t。取小球的初速方向为正：<br>
          <span class="eq">mv₀ = −m·${fr("2x","t")} + M·${fr("x","t")}</span>，<span class="eq">½mv₀² = ½m(${fr("2x","t")})² + ½M(${fr("x","t")})²</span></div>
        <div class="step">联立得 <span class="eq">M = 5m = 500 g</span>，A 错、B 对。</div>
        <div class="step">相同速率 v 相向碰（取小球方向为正）：<span class="eq">mv − Mv = mv₁ + Mv₂</span>，<span class="eq">½mv² + ½Mv² = ½mv₁² + ½Mv₂²</span>；代入 M=5m 得 <span class="eq">v₂ = −${fr("1","3")}v</span>，C 错、D 对。</div>
      </div></details>

    <div class="qcard wide"><span class="qtag">压轴 · 变式1-3 · 2026·湖北·高考真题</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">在如图所示的竖直平面内，固定在水平地面上的光滑轨道由两倾角均为 30° 的足够长轨道与一水平轨道平滑连接而成，连接点分别为 A、B。质量为 m 的小物块甲放置在左侧倾斜轨道上高 h 处、质量为 km 的小物块乙静止在水平轨道上，乙到 A、B 两点的距离均为 h。现静止释放甲，所有碰撞均为弹性正碰，重力加速度大小为 g，不计空气阻力。<br>
          (1) 求甲第一次到达 A 点时的速度大小。<br>
          (2) 求两物块第一次碰撞过程中，乙所受合外力的冲量大小。<br>
          (3) 若两物块在水平轨道上发生第二次碰撞，且第二次碰撞前只有一个物块滑上倾斜轨道，求 k 满足的关系式。</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">(1) 下滑机械能守恒。<br>(2) 弹性正碰求乙的速度，再用动量定理求冲量。<br>(3) 碰后按 k 分段：0&lt;k≤1、1&lt;k&lt;3、k&gt;3，分别判断谁先滑上斜面、往返后谁追谁，用「相遇时间 &lt; 对方到达端点时间」列不等式。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) <span class="eq">mgh = ½mv₀² ⇒ v₀ = √(2gh)</span></div>
        <div class="step">(2) 弹性正碰：<span class="eq">mv₀ = mv₁ + kmv₂</span>，<span class="eq">½mv₀² = ½mv₁² + ½kmv₂²</span> ⇒ <span class="eq">v₂ = ${fr("2v₀","1+k")}</span>；<br>
          对乙：<span class="eq">I = kmv₂ = ${fr("2km√(2gh)","1+k")}</span></div>
        <div class="step">(3) 碰后 <span class="eq">v₁ = ${fr("1−k","1+k")}v₀</span>，<span class="eq">v₂ = ${fr("2","1+k")}v₀</span>。分三段讨论：</div>
        <div class="step">① <span class="eq">0&lt;k≤1</span>：乙先上右斜面往返后与甲相遇，须在甲到 B 前相遇，化简得 <span class="eq">k³+3k²+35k−31&gt;0</span></div>
        <div class="step">② <span class="eq">1&lt;k&lt;3</span>：乙先上右斜面返回向左追甲，须在甲到 A 前追及，化简得 <span class="eq">3k³+k²+25k−37&lt;0</span></div>
        <div class="step">③ <span class="eq">k&gt;3</span>：甲先上左斜面返回向右追乙，须在乙到 B 前追及，化简得 <span class="eq">k³−21k²+19k−23&gt;0</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) v₀=√(2gh)　(2) I=${fr("2km√(2gh)","1+k")}<br>
        (3) 0&lt;k≤1：k³+3k²+35k−31&gt;0；1&lt;k&lt;3：3k³+k²+25k−37&lt;0；k&gt;3：k³−21k²+19k−23&gt;0</b></div></details>
    </div>`,
  P:null, S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(function(p){ this.P[p.key]=p.value; }, this); }
    const m1=2, m2=m1*this.P.ratio, r=0.26;
    this.S={ m1, m2, r, x1:-2.6, x2:0.2, v1:this.P.v1, v2:this.P.v2,
             e:this.P.e, hit:false, hitT:-1, t:0, done:false,
             ek0:0.5*m1*this.P.v1*this.P.v1 + 0.5*m2*this.P.v2*this.P.v2,
             p0:m1*this.P.v1 + m2*this.P.v2 };
    this.hist.length = 0;
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  phase(){
    const S=this.S;
    if(!S.hit && S.v2 >= S.v1-1e-9) return "v₂ ≥ v₁：两球间距不断增大，不会相碰（请调小 v₂）";
    if(!S.hit) return "① 接近：匀速直线运动，系统动量守恒";
    if(S.t - S.hitT < 0.06) return "② 碰撞：Δt→0，内力远大于外力，动量守恒";
    if(Math.abs(S.v1-S.v2) < 0.05) return "③ 碰后共速：完全非弹性，动能损失最大";
    return "③ 碰后分离：各自匀速，动量守恒、动能按 e 调整";
  },
  bars(){
    const S=this.S, px=S.m1*S.v1+S.m2*S.v2, ek=0.5*S.m1*S.v1*S.v1+0.5*S.m2*S.v2*S.v2;
    return [
      {label:"系统动量 Pₓ", value:Math.abs(px), max:Math.max(Math.abs(S.p0),1), color:"#36e0e0", text:fmt(px)+" kg·m/s"},
      {label:"系统动能 Eₖ", value:ek, max:Math.max(S.ek0,1), color:"#ffd24d", text:fmt(ek)+" J"}
    ];
  },
  readout(){
    const S=this.S, px=S.m1*S.v1+S.m2*S.v2, ek=0.5*S.m1*S.v1*S.v1+0.5*S.m2*S.v2*S.v2;
    const dE=S.hit?Math.max(0,S.ek0-ek):0;
    return [["m₁ 速度",fmt(S.v1)+" m/s"],["m₂ 速度",fmt(S.v2)+" m/s"],
            ["水平动量 Pₓ",fmt(px)+" kg·m/s"],["总动能 Eₖ",fmt(ek)+" J"],["动能损失",fmt(dE)+" J"]];
  },
  step(dt){
    const S=this.S; if(S.done) return;
    const n=6, h=dt*0.35/n;
    for(let i=0;i<n;i++){
      S.t += h;
      S.x1 += S.v1*h; S.x2 += S.v2*h;
      if(!S.hit && (S.x2-S.x1) <= 2*S.r && (S.v1-S.v2)>0){
        const m1=S.m1, m2=S.m2, e=S.e, u1=S.v1, u2=S.v2, M=m1+m2;
        S.v1 = ((m1-e*m2)*u1 + (1+e)*m2*u2)/M;
        S.v2 = ((m2-e*m1)*u2 + (1+e)*m1*u1)/M;
        const mid=(S.x1+S.x2)/2;
        S.x1 = mid-S.r; S.x2 = mid+S.r;
        S.hit=true; S.hitT=S.t;
      }
      if(Math.abs(S.x1)>3.3 || Math.abs(S.x2)>3.3) S.done=true;
    }
    const lastP=this.hist[this.hist.length-1];
    if(!lastP || S.t-lastP.t>0.015){
      this.hist.push({t:S.t, v:[S.v1,S.v2]});
      if(this.hist.length>600) this.hist.shift();
    }
  },
  draw(ctx){
    const S=this.S, sc=viewScale(), RAIL=0.10;
    // 实验台投影
    const sx=0.10, sz=0.12;
    const q1=proj(-3.45+sx,0.002,0.34+sz), q2=proj(3.45+sx,0.002,0.34+sz),
          q3=proj(3.45+sx,0.002,-0.34+sz), q4=proj(-3.45+sx,0.002,-0.34+sz);
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.lineTo(q3.x,q3.y); ctx.lineTo(q4.x,q4.y); ctx.closePath(); ctx.fill();
    // 金属实验台
    box3D(0, RAIL/2, 0, 6.7, RAIL, 0.66, "#24456e");
    line3D([-3.35,RAIL+0.002,0.31],[3.35,RAIL+0.002,0.31],"rgba(150,210,255,.55)",1.4);
    line3D([-3.35,RAIL+0.002,-0.31],[3.35,RAIL+0.002,-0.31],"rgba(90,150,220,.28)",1.2);
    // 前立面刻度
    for(let x=-3; x<=3.001; x+=0.5){
      const big=Math.abs(x-Math.round(x))<1e-6;
      line3D([x,RAIL,0.331],[x,RAIL-(big?0.075:0.04),0.331], big?"rgba(150,210,255,.75)":"rgba(120,170,230,.38)", big?1.6:1);
      if(big && Math.abs(x)>1e-6){
        const p=proj(x,0,0.64);
        if(p.x>52 && p.x<W-52){          // 贴边的刻度不标数字，避免被裁
          ctx.fillStyle="#6f86a8"; ctx.font="11px sans-serif"; ctx.textAlign="center";
          ctx.fillText((x<0?"−":"")+Math.abs(x)+"m", p.x, p.y+14);
        }
      }
    }
    // 接触阴影
    contactShadow(S.x1,RAIL+0.002,0,S.r);
    contactShadow(S.x2,RAIL+0.002,0,S.r);
    // 球体
    sphere(S.x1,S.r+RAIL,0,S.r,"#4ea3ff");
    sphere(S.x2,S.r+RAIL,0,S.r,"#ff5d6c");
    // 速度矢量 + 数值
    function vec(x,v,col){
      if(Math.abs(v)<0.02) return;
      const y=S.r+RAIL;
      arrow3D([x,y,0],[x+v*0.22,y,0],col,3,"");
      const q=proj(x+v*0.22,y,0);
      ctx.fillStyle=col; ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
      ctx.fillText(fmt(v)+" m/s", q.x, q.y-9);
    }
    vec(S.x1,S.v1,"#ffd24d");
    vec(S.x2,S.v2,"#ffd24d");
    // 质量标注
    const p1=proj(S.x1,S.r*2.6+RAIL,0), p2=proj(S.x2,S.r*2.6+RAIL,0);
    ctx.fillStyle="#8fa6c8"; ctx.font="13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("m₁="+fmt(S.m1,1)+" kg", p1.x, p1.y);
    ctx.fillText("m₂="+fmt(S.m2,1)+" kg", p2.x, p2.y);
    // 碰撞闪光
    if(S.hit && S.t-S.hitT<0.16){
      const k=(S.t-S.hitT)/0.16, mid=(S.x1+S.x2)/2, p=proj(mid,S.r+RAIL,0);
      ctx.strokeStyle="rgba(255,210,77,"+(1-k)+")"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,(0.3+k*0.9)*sc,0,TAU); ctx.stroke();
    }
    // 提示
    ctx.fillStyle="#5b7099"; ctx.font="12px sans-serif"; ctx.textAlign="center";
    ctx.fillText("e="+fmt(S.e,2)+"　"+(S.e===1?"弹性碰撞":(S.e===0?"完全非弹性":"非弹性碰撞")), W/2, H-18);
  }
};

/* ---------- 3 子弹打木块 ---------- */
/* 半透明长方体（用于让子弹在木块内可见） */
function boxA(cx,cy,cz,w,h,d,fill,edge){
  const x0=cx-w/2, x1=cx+w/2, y0=cy-h/2, y1=cy+h/2, z0=cz-d/2, z1=cz+d/2;
  const V=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
           [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]].map(v=>proj(v[0],v[1],v[2]));
  const faces=[{i:[0,1,2,3],a:0.55},{i:[4,5,6,7],a:0.75},{i:[0,1,5,4],a:0.35},
               {i:[3,2,6,7],a:0.6},{i:[0,3,7,4],a:0.45},{i:[1,2,6,5],a:0.4}]
    .map(f=>({...f, d:(V[f.i[0]].d+V[f.i[1]].d+V[f.i[2]].d+V[f.i[3]].d)/4}))
    .sort((a,b)=>a.d-b.d);
  for(const f of faces){
    ctx.globalAlpha=f.a*0.9; ctx.fillStyle=fill;
    ctx.beginPath();
    f.i.forEach((idx,j)=> j?ctx.lineTo(V[idx].x,V[idx].y):ctx.moveTo(V[idx].x,V[idx].y));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle=edge; ctx.lineWidth=1.2; ctx.stroke();
  }
}

MODELS.m3 = {

  knowledge:`
    <details open class="kcore"><summary>一、核心公式</summary><div class="body">
      <div class="fx"><span class="fxlab">① 动量守恒（水平方向无外力）</span><span class="eq">m v₀ = m v₁ + M v₂</span></div>
      <div class="fx hot"><span class="fxlab">② 摩擦生热：d 是相对位移（钻入深度）</span><span class="eq">Q = f·d</span></div>
      <div class="fx"><span class="fxlab">③ 能量守恒</span><span class="eq">½mv₀² = ½mv₁² + ½Mv₂² + Q</span></div>
      <div class="fx"><span class="fxlab">④ 嵌入判据（最大钻深）</span><span class="eq">d_max = ${fr("M v₀²","2f(M+m)")}</span></div>
    </div></details>
    <details open><summary>二、两种情景</summary><div class="body">
      <p><b>嵌入</b>（d_max &lt; L）：两者共速 <span class="eq">v = ${fr("m v₀","m+M")}</span>，动能损失<b>最大</b>，等价完全非弹性碰撞。</p>
      <p><b>穿透</b>（d_max ≥ L）：子弹从右侧穿出，之后<b>各自匀速</b>，v₁ &gt; v₂，动能损失 = f·L。</p>
      <p>题中「恰好穿过」＝ d_max = L，用它列临界方程。</p>
    </div></details>
    <details><summary>三、v–t 图像看什么</summary><div class="body">
      <p>两条都是<b>直线</b>：子弹减速、木块加速，斜率之比 <span class="eq">a弹 : a块 = M : m</span>。</p>
      <p><b>两线相交 = 共速 = 刚好嵌入</b>；若子弹线穿过 L 对应的时刻就离开，则<b>不相交</b>（穿透）。</p>
      <p>曲线与 t 轴围的面积差 = 相对位移 = 钻入深度 d。</p>
    </div></details>
    <details><summary>四、易错</summary><div class="body">

    </div></details>`,

      <details><summary>思路</summary><div class="body">
        <div class="step">① 先由「匀速」求地面对木板的摩擦因数 μ：恒力与地面摩擦平衡。</div>
        <div class="step">② 机器人被提起后，木板只受 F 与地面摩擦 ⟹ 匀加速，用运动学求 2 s 内位移与末速。</div>
        <div class="step">③ 放回后「机器人 + 木板」合外力为零 ⟹ 动量守恒求共同速度；再对机器人单独用动能定理求摩擦做功。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">（1）匀速时：<span class="eq">F = μ(m木 + m机)g</span> ⟹ 5 = μ×5×10 ⟹ <b>μ = 0.1</b></div>
        <div class="step">提起后对木板：<span class="eq">F − μm木g = m木a₁</span> ⟹ 5 − 4 = 4a₁ ⟹ <b>a₁ = 0.25 m/s²</b></div>
        <div class="step"><span class="eq">x = v₀t + ½a₁t² = 1×2 + ½×0.25×4 = 2.5 m</span></div>
        <div class="step">（2）放回瞬间木板速度 <span class="eq">v₂ = v₀ + a₁t = 1 + 0.5 = 1.5 m/s</span>，机器人水平速度仍为 1 m/s。</div>
        <div class="step">此后系统合外力为零（F 与地面摩擦平衡），动量守恒：</div>
        <div class="step"><span class="eq">m机v₀ + m木v₂ = (m机 + m木)v</span> ⟹ 1×1 + 4×1.5 = 5v ⟹ <b>v = 1.4 m/s</b></div>
        <div class="step">对机器人用动能定理：<span class="eq">W = ½m机v² − ½m机v₀² = ½×1×(1.96 − 1) = 0.48 J</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>（1）2.5 m　　（2）0.48 J</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 冲量用<b>动量定理</b>：I = |Δp|，分别算锁定与解锁时子弹的动量变化。</div>
        <div class="step">② 做功用<b>动能定理</b>：W = ΔEₖ，比较两种情况下子弹的末动能。</div>
        <div class="step">③ 解锁后系统动量守恒 ⟹ 末速 v = mv₀/(m+M) &lt; v₀（不是零）。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">AB．锁定时子弹末速为 0：<span class="eq">I₁ = |0 − mv₀| = mv₀</span>，由牛顿第三定律，子弹对钢板的冲量也是 mv₀。</div>
        <div class="step">解锁后动量守恒：<span class="eq">mv₀ = (m+M)v</span> ⟹ <span class="eq">v = ${fr("m","m+M")}v₀</span></div>
        <div class="step"><span class="eq">I₂ = |mv − mv₀| = ${fr("M","m+M")}mv₀ &lt; mv₀</span>，故 A 对、B 错。</div>
        <div class="step">CD．锁定时：<span class="eq">W锁 = 0 − ½mv₀²</span>；解锁后：<span class="eq">W解 = ½mv² − ½mv₀²</span></div>
        <div class="step">因 v &gt; 0 ⟹ <span class="eq">W锁 &lt; W解</span>（负得更多），即钢板对子弹做的功锁定时更多，C、D 错。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>A</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 子弹打入小车：极短时间 ⟹ 动量守恒（物块尚未参与）。</div>
        <div class="step">② 物块上滑到最高点：三者水平<b>共速</b>，动量守恒 + 机械能守恒（BC 段摩擦要算进去）。</div>
        <div class="step">③ 回到 B：水平动量守恒 + 能量守恒（圆弧段无摩擦）。</div>
        <div class="step">④ 压缩弹簧到最短：三者再次共速，能量守恒并计入 BC 段摩擦生热。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">（1）子弹打入：<span class="eq">m₀v₀ = (m₀+M)v₁</span> ⟹ 12 = 2v₁ ⟹ v₁ = 6 m/s</div>
        <div class="step">物块到最高点三者共速：<span class="eq">(m₀+M)v₁ = (m₀+M+m)v₂</span> ⟹ 12 = 3.02v₂ ⟹ v₂ ≈ 3.97 m/s</div>
        <div class="step">能量：<span class="eq">½(m₀+M)v₁² = ½(m₀+M+m)v₂² + mgh</span> ⟹ <b>h ≈ 1.2 m</b></div>
        <div class="step">（2）回到 B 点，设车（含弹）速度 v₃、物块速度 v：</div>
        <div class="step"><span class="eq">(m₀+M)v₁ = (m₀+M)v₃ + mv</span>，<span class="eq">½(m₀+M)v₁² = ½(m₀+M)v₃² + ½mv²</span></div>
        <div class="step">解得 v₃ = 2 m/s，<b>v = 8 m/s</b>（弹性碰撞式解）</div>
        <div class="step">（3）弹簧最短时三者共速：<span class="eq">(m₀+M)v₁ = (m₀+M+m)v₄</span> ⟹ v₄ ≈ 3.97 m/s</div>
        <div class="step">能量：<span class="eq">½(m₀+M)v₁² = ½(m₀+M+m)v₄² + μmgL + Eₚm</span></div>
        <div class="step"><span class="eq">36 − 23.8 − 3.5 = 8.5 J</span> ⟹ <b>Eₚm = 8.5 J</b></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>（1）h ≈ 1.2 m　　（2）v = 8 m/s　　（3）Eₚm = 8.5 J</b></div></details>
    </div>
    <div class="foot">例题与配图均取自《第08讲 动量守恒定律模型（模型和方法）（解析版）》§模型三 · 模型特训，原图保留、未改绘。</div>`,
  P:null, S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(function(p){ this.P[p.key]=p.value; }, this); }
    const m1=0.2, M=m1*this.P.ratio, f=this.P.f, v0=this.P.v0, L=this.P.L;
    const a1=f/m1, a2=f/M, arel=a1+a2;
    const tApp=0.55/v0;                     // 子弹飞行接近段
    const tc=v0/arel, dsC=0.5*v0*tc;
    const punched = dsC >= L;
    let ts=tc;
    if(punched){
      const disc=v0*v0-2*arel*L;
      ts=(v0-Math.sqrt(Math.max(0,disc)))/arel;
    }
    this.S={ m1, M, f, v0, L, a1, a2, arel, ts, TC:tc, punched, dsC, TS:0.30, tApp,
             t:0, x0:-L/2-0.15-0.55, blk0:0, s1:0, s2:0, d0:0.55,
             v1:v0, v2:0, hist:[] };
    this.vtSpan=Math.max(0.9, 2.2*(tApp+ts));
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  hist(){ return this.S.hist; },
  state(t){
    const S=this.S, ts=S.ts;
    let s1,s2,v1,v2;
    if(t < S.tApp){                       // 飞行段：无阻力，匀速接近
      return {s1:S.v0*t, s2:0, v1:S.v0, v2:0};
    }
    t = t - S.tApp;                       // 换成"接触后"的时间
    if(t<=ts){
      v1=S.v0-S.a1*t; v2=S.a2*t;
      s1=S.v0*t-0.5*S.a1*t*t; s2=0.5*S.a2*t*t;
    }else{
      if(S.punched){
        v1=S.v0-S.a1*ts; v2=S.a2*ts;
      }else{
        v1=v2=S.v0*S.m1/(S.m1+S.M);
      }
      const s1s=S.v0*ts-0.5*S.a1*ts*ts, s2s=0.5*S.a2*ts*ts;
      s1=s1s+v1*(t-ts); s2=s2s+v2*(t-ts);
    }
    return {s1:s1+S.d0, s2:s2, v1:v1, v2:v2};   // 接上飞行段已经走过的 d0
  },
  phase(){
    const S=this.S;
    if(S.t < S.tApp) return "① 子弹飞行：以 v₀ 匀速接近木块（尚未接触）";
    if(S.t - S.tApp < S.ts) return "② 相对运动：子弹受阻力减速，木块受反作用加速（阻力恒定 ⟹ v–t 为直线）";
    if(S.punched) return "③ 穿透：子弹已穿出木块，之后各自匀速；Q = f·L";
    return "③ 嵌入：两者共速，一起匀速；动能损失最大（等价完全非弹性碰撞）";
  },
  bars(){
    const S=this.S;
    const E0=0.5*S.m1*S.v0*S.v0;
    const Ek=0.5*S.m1*S.v1*S.v1+0.5*S.M*S.v2*S.v2;
    const Q=Math.max(0,E0-Ek);
    const px=S.m1*S.v1+S.M*S.v2;
    return [
      {label:"系统动量 Pₓ", value:Math.abs(px), max:Math.max(S.m1*S.v0,0.1), color:"#36e0e0", text:fmt(px,2)+" kg·m/s"},
      {label:"摩擦生热 Q", value:Q, max:Math.max(E0,0.1), color:"#ff9a5b", text:fmt(Q,3)+" J"},
      {label:"系统动能 Eₖ", value:Ek, max:Math.max(E0,0.1), color:"#9d7bff", text:fmt(Ek,3)+" J"}
    ];
  },
  readout(){
    const S=this.S;
    const E0=0.5*S.m1*S.v0*S.v0;
    const Ek=0.5*S.m1*S.v1*S.v1+0.5*S.M*S.v2*S.v2;
    const d=Math.min(Math.max(0,S.s1-S.s2-S.d0), S.punched?S.L:9);
    return [["v弹（子弹）", fmt(S.v1,2)+" m/s"],
            ["v块（木块）", fmt(S.v2,2)+" m/s"],
            ["钻入深度 d", fmt(d,2)+" m"],
            ["摩擦生热 Q", fmt(Math.max(0,E0-Ek),3)+" J"],
            ["系统动量 Pₓ", fmt(S.m1*S.v1+S.M*S.v2,3)+" kg·m/s"],
            ["总动能 Eₖ", fmt(Ek,3)+" J"],
            ["木块厚度 L", fmt(S.L,2)+" m"]];
  },
  step(dt){
    const S=this.S;
    S.t += dt*S.TS;
    const st=this.state(S.t);
    S.v1=st.v1; S.v2=st.v2; S.s1=st.s1; S.s2=st.s2;
    const last=S.hist[S.hist.length-1];
    if(!last || S.t-last.t > 0.004){
      S.hist.push({t:S.t, v:[S.v1,S.v2]});
      while(S.hist.length>2 && S.t-S.hist[0].t > this.vtSpan*1.3) S.hist.shift();
    }
    if(S.t > S.tApp + S.ts + 1.2 || Math.abs(S.s2) > 5.0) this.reset();
  },
  draw(ctx){
    const S=this.S, RAIL=0.10, L=S.L, bw=0.55, bh=0.6;
    const RW=6.4;
    const q1=proj(-RW,0.002,0.36), q2=proj(RW,0.002,0.36),
          q3=proj(RW,0.002,-0.36), q4=proj(-RW,0.002,-0.36);
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y);
    ctx.lineTo(q3.x,q3.y); ctx.lineTo(q4.x,q4.y); ctx.closePath(); ctx.fill();
    box3D(0, RAIL/2, 0, RW*2, RAIL, 0.66, "#24456e");
    line3D([-RW+0.05,RAIL+0.002,0.33],[RW-0.05,RAIL+0.002,0.33],"rgba(150,210,255,.55)",1.4);
    for(let x=-6; x<=6.001; x+=0.5){
      const big=Math.abs(x-Math.round(x))<1e-6;
      line3D([x,RAIL,0.331],[x,RAIL-(big?0.075:0.04),0.331], big?"rgba(150,210,255,.75)":"rgba(120,170,230,.38)", big?1.6:1);
      if(big && Math.abs(x)>1e-6){
        const p=proj(x,0,0.64);
        if(p.x>52 && p.x<W-52){
          ctx.fillStyle="#6f86a8"; ctx.font="11px sans-serif"; ctx.textAlign="center";
          ctx.fillText((x<0?"−":"")+Math.abs(x)+"m", p.x, p.y+14);
        }
      }
    }
    const xb=S.blk0+S.s2;                 // 木块中心
    const xBl=S.x0+S.s1;                  // 子弹中心
    // 木块投影
    const t1=proj(xb-L/2,0.002,0.42), t2=proj(xb+L/2,0.002,0.42);
    const t3=proj(xb+L/2,0.002,-0.42), t4=proj(xb-L/2,0.002,-0.42);
    ctx.fillStyle="rgba(0,0,0,.34)";
    ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.lineTo(t3.x,t3.y); ctx.lineTo(t4.x,t4.y); ctx.closePath(); ctx.fill();
    // 木块（半透明，能看到钻入的子弹）
    boxA(xb, RAIL+bh/2, 0, L, bh, 0.72, "rgba(176,121,63,.55)", "rgba(226,178,120,.85)");
    // 子弹（圆柱弹体 + 圆锥弹头，金属质感）
    const by=RAIL+bh*0.52;
    bullet3D(xBl, by, 0, 0.075, 0.30, 0.18, "#c9d4e6");
    // 阻力：子弹受的力画在子弹尾部，木块受的力画在木块左表面
    if(S.t > S.tApp && S.t - S.tApp < S.ts){
      const yF=by+0.20;
      arrow3D([xBl-0.05,yF,0],[xBl-0.05-0.34,yF,0],"#ff9a5b",3.2,"");
      arrow3D([xb-L/2+0.02,by+0.20,0],[xb-L/2+0.02+0.34,by+0.20,0],"#4fd39a",3.2,"");
    }
    // 速度箭头（长度封顶，避免高初速时箭头过长）
    function vec(x,y,v,col){
      if(Math.abs(v)<0.03) return;
      const vl=Math.sign(v)*Math.min(Math.abs(v),6)*0.22;
      arrow3D([x,y,0],[x+vl,y,0],col,3.2,"");
    }
    vec(xBl, by+0.42, S.v1, "#ffd24d");
    vec(xb, RAIL+bh+0.20, S.v2, "#ffd24d");
    ctx.fillStyle="#5b7099"; ctx.font="11.5px sans-serif"; ctx.textAlign="center";
    ctx.fillText("橙＝子弹所受阻力（向后）　绿＝木块所受反作用（向前）　黄＝速度方向", W/2, H-16);
  }
};

MODELS.m4 = {
  id:"m4", name:"滑块木板模型", sub:"动量守恒 + 摩擦生热 · 共速时相对位移最大",
  cam:{yaw:0.55,pitch:0.26}, scale:0.74, cx:0.50, cy:0.43, vt:true,

  params:[

    {key:"L",label:"木板长度 L",min:1,max:3.5,step:0.1,value:2,dec:1,unit:" m"}
  ],
  legend:[["#3f7ad0","滑块 m（蓝）"],["#b0793f","木板 M（木色）"],["#ffd24d","速度 / 摩擦力方向"],["#36e0e0","光滑水平面"]],
  knowledge:`
    <details open class="kcore"><summary>一、核心公式</summary><div class="body">
      <div class="fx"><span class="fxlab">① 动量守恒（水平面光滑，摩擦是内力）</span><span class="eq">m v₀ = (m + M)v共</span></div>
      <div class="fx hot"><span class="fxlab">② 摩擦生热：只与相对位移有关</span><span class="eq">Q = f·Δs相对 = μmg·Δs</span></div>
      <div class="fx"><span class="fxlab">③ 能量守恒</span><span class="eq">½mv₀² = ½(m+M)v共² + Q</span></div>
      <div class="fx"><span class="fxlab">④ 共速时间（用动量定理）</span><span class="eq">t = ${fr("v₀","μg(1 + m/M)")}</span></div>
    </div></details>
    <details open><summary>二、两个判据：滑出 / 不滑出</summary><div class="body">
      <p>先算「不滑出时的相对位移」：<span class="eq">Δs₀ = ${fr("M v₀²","2μg(m+M)")}</span></p>
      <p><b>Δs₀ &lt; L</b>（板够长）：滑块停在板上，之后与板<b>一起匀速</b>，摩擦力消失。</p>
      <p><b>Δs₀ ≥ L</b>（板不够长）：滑块从右端滑出，之后各自匀速，<b>不再共速</b>。</p>
      <p>题中「恰好不滑出」＝ 相对位移刚好等于板长 ⟹ 用它列能量方程求临界速度。</p>
    </div></details>
    <details><summary>三、三问三法（对照题目用）</summary><div class="body">
      <p><b>求速度</b>：动量守恒，研究对象是「系统」。</p>
      <p><b>求时间</b>：动量定理，研究对象是「单个物体」（−μmg·t = mv − mv₀）。</p>
      <p><b>求热量/相对位移</b>：能量守恒 Q = f·Δs 或 Q = Eₖ初 − Eₖ末，对象是「系统」。</p>
    </div></details>
    <details><summary>四、易错</summary><div class="body">
      <div class="warn2">
        ① Δs 是<b>相对位移</b>（滑块相对板走过的距离），不是滑块的位移，也不是板长；<br>
        ② 摩擦力对滑块做<b>负功</b>、对木板做<b>正功</b>，两者代数和 = −Q；<br>
        ③ Q = f·Δs 与参考系无关，用动能变化算 Q 时必须用<b>同一参考系</b>；<br>
        ④ 共速时木板速度<b>最大</b>、相对位移<b>最大</b>，不是动量最大；<br>
        ⑤ 滑块滑出后两者不再共速，别再套 v共 公式。
      </div>
    </div></details>`,

      <details><summary>思路</summary><div class="body">
        <div class="step">① 求时间：先由动量守恒求共速，再对<b>物块</b>用动量定理（单个物体才用得上时间）。</div>
        <div class="step">② 求临界速度：「恰好不滑出」⟹ 相对位移 = 车长 L ⟹ 动量守恒 + 能量守恒联立。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">（1）系统动量守恒：<span class="eq">m₂v₀ = (m₂ + m₁)v</span> ⟹ v = ${fr("0.2×2","0.5")} = 0.8 m/s</div>
        <div class="step">对物块用动量定理：<span class="eq">−μm₂gt = m₂v − m₂v₀</span></div>
        <div class="step"><span class="eq">t = ${fr("v₀ − v","μg")} = ${fr("1.2","5")} = 0.24 s</span></div>
        <div class="step">（2）恰好不滑出时 <span class="eq">Δs = L = 1.5 m</span></div>
        <div class="step">动量守恒：<span class="eq">m₂v₀′ = (m₂ + m₁)v₁′</span>；能量守恒：</div>
        <div class="step"><span class="eq">μm₂gL = ½m₂v₀′² − ½(m₂ + m₁)v₁′²</span></div>
        <div class="step">代入 m₁=0.3、m₂=0.2、L=1.5 解得 <span class="eq">v₀′ = 5 m/s</span>，即不超过 5 m/s。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>（1）t = 0.24 s　　（2）v₀′ ≤ 5 m/s</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 由 v–t 图读三个数：v₀=4 m/s、2 s 后 v<sub>块</sub>=2 m/s、v<sub>车</sub>=1 m/s；</div>
        <div class="step">② 动量守恒求木块质量；<b>v–t 图面积 = 位移</b>，两面积之差 = 相对位移，若两车 2 s 后速度不同 ⟹ 木块已滑出，板长 = Δx；</div>
        <div class="step">③ 加速度由斜率读出 ⟹ 求 μ；热量用动能损失；冲量用动量定理（单个物体）。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．动量守恒 <span class="eq">mv₀ = mv<sub>木</sub> + Mv<sub>车</sub></span>，代入 4、2、1、6 kg 得 <b>m = 3 kg</b>。</div>
        <div class="step">v–t 面积：0～2 s 内 x<sub>木</sub> = 6 m，x<sub>车</sub> = 1 m；2 s 后两者速度不同 ⟹ 已滑出，<span class="eq">L = x<sub>木</sub> − x<sub>车</sub> = 5 m</span>，A 对。</div>
        <div class="step">B．木块斜率 <span class="eq">a = 1 m/s²</span>，由 <span class="eq">μmg = ma</span> 得 <span class="eq">μ = ${fr("a","g")} = 0.1 ≠ 0.5</span>，B 错。</div>
        <div class="step">C．<span class="eq">Q = ½mv₀² − (½mv<sub>木</sub>² + ½Mv<sub>车</sub>²) = 24 − (6 + 3) = 15 J</span>，C 对。</div>
        <div class="step">D．对小车用动量定理：<span class="eq">I = Δp = Mv<sub>车</sub> − 0 = 6 N·s</span>，D 对。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>ACD</b></div></details>
    </div>

    <div class="qcard big"><span class="qtag">较难 · 变式1-1 · 2026·吉林松原·模拟预测</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图甲所示，光滑的水平地面上静置一长木板，木板的左端有一个可视为质点的滑块。现给滑块一水平向右的初速度 v₀，此后滑块和木板的动能随各自位移变化的图像如图乙所示，最终滑块恰停在木板的右端。求：<br>
          （1）滑块与木板的质量之比；<br>
          （2）滑块与木板间的滑动摩擦力大小；<br>
          （3）木板的长度。</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 系统动量守恒 + 末动能 ⟹ 用 <span class="eq">Eₖ₀/Eₖ = (m+M)/m</span> 求质量比。</div>
        <div class="step">② 末动能按质量分配（共速后 Eₖ ∝ m）⟹ 各自末动能；再对<b>单个物体</b>用动能定理求 f。</div>
        <div class="step">③ 板长 = 两者位移之差（滑块恰停在右端）。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">（1）设滑块 m、木板 M：<span class="eq">mv₀ = (m+M)v</span>；由图像 Eₖ₀=50 J、Eₖ=20 J，</div>
        <div class="step"><span class="eq">${fr("Eₖ₀","Eₖ")} = ${fr("m+M","m")} = 2.5</span> ⟹ <b>m : M = 2 : 3</b></div>
        <div class="step">（2）共速后 Eₖ ∝ 质量 ⟹ 滑块末动能 8 J、木板末动能 12 J；滑块位移 x₂=14 m，</div>
        <div class="step">对滑块用动能定理：<span class="eq">−f·x₂ = 8 − 50</span> ⟹ <b>f = 3 N</b></div>
        <div class="step">（3）对木板：<span class="eq">f·x₁ = 12</span> ⟹ x₁ = 4 m；</div>
        <div class="step">滑块恰停在右端，板长等于相对位移：<span class="eq">L = x₂ − x₁ = 14 − 4 = 10 m</span></div>
      </div></details>

        <div class="qcol">
          <div class="qtext">如图，质量为 2 kg 的小球 A（视为质点）在细绳 O′P 和 OP 作用下处于平衡状态，O′P=OP=1.6 m，与竖直方向的夹角均为 60°。质量为 6 kg 的木板 B 静止在光滑水平面上，质量为 2 kg 的物块 C 静止在 B 的左端。剪断细绳 O′P，小球 A 开始运动。（g 取 10 m/s²）<br>
          （1）求 A 运动到最低点时细绳 OP 所受的拉力。<br>
          （2）A 在最低点时细绳 OP 断裂。A 飞出后恰好与 C 左侧碰撞（时间极短）、碰后 A 竖直下落，C 水平向右运动。求碰后 C 的速度大小。<br>
          （3）A、C 碰后，C 相对 B 滑行 4 m 后与 B 共速。求 C 和 B 之间的动摩擦因数。</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">（1）下摆机械能守恒求速度，最低点用牛顿第二定律求拉力（圆周运动）。</div>
        <div class="step">（2）碰后 A 竖直下落 ⟹ 碰后 A 水平速度为零 ⟹ 水平动量全给 C。</div>
        <div class="step">（3）C 在 B 上滑 4 m 共速：动量守恒求共速，能量守恒求 μ（Q = μmg·4）。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">（1）<span class="eq">mgl(1 − cos60°) = ½mv₀²</span> ⟹ v₀ = 4 m/s；</div>
        <div class="step">最低点：<span class="eq">F − mg = ${fr("mv₀²","l")}</span> ⟹ F = 20 + 20 = <b>40 N</b></div>
        <div class="step">（2）碰后 A 竖直下落，水平分速度为零：<span class="eq">mv₀ = 0 + mv<sub>C</sub></span> ⟹ <b>v<sub>C</sub> = 4 m/s</b></div>
        <div class="step">（3）C、B 系统动量守恒：<span class="eq">mv₀ = (M + m)v</span> ⟹ v = 1 m/s</div>
        <div class="step">能量守恒：<span class="eq">μmg·s相对 = ½mv₀² − ½(M + m)v²</span></div>
        <div class="step"><span class="eq">μ×2×10×4 = 16 − 4 = 12</span> ⟹ <b>μ = 0.15</b></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>（1）40 N　　（2）4 m/s　　（3）μ = 0.15</b></div></details>
    </div>
    <div class="foot">例题与配图均取自《第08讲 动量守恒定律模型（模型和方法）（解析版）》§模型四 · 模型特训，原图保留、未改绘。</div>`,
  P:null, S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(function(p){ this.P[p.key]=p.value; }, this); }
    const m1=1.0, M=m1*this.P.ratio, g=10;
    const bw=0.44, bh=0.22, TS=0.27;
    const v0=this.P.v0, mu=this.P.mu, L=this.P.L;
    const a1=mu*g, a2=mu*m1*g/M;
    const tc=v0/(a1+a2);
    const dsHalf=0.5*v0*tc;                       // 共速时的相对位移
    const slid=dsHalf>=L;
    let ts=tc;
    if(slid){                                     // 滑出：解相对位移 = L
      const disc=v0*v0-2*(a1+a2)*L;
      ts=(v0-Math.sqrt(Math.max(0,disc)))/(a1+a2);
    }
    const v1s=Math.max(0,v0-a1*ts), v2s=a2*ts;
    this.S={ m1, M, g, bw, bh, mu, L, v0, a1, a2, ts, TC:tc, slid, TS,
             t:0, xb0:-1.0, blk0:-1.0-L/2+bw/2, v1:v0, v2:0, s1:0, s2:0,
             Q:0, hist:[] };
    this.vtSpan=Math.max(1.4, 2.6*ts);
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  hist(){ return this.S.hist; },
  state(t){
    const S=this.S, ts=S.ts;
    let s1,s2,v1,v2;
    if(t<=ts){
      v1=Math.max(0,S.v0-S.a1*t); v2=S.a2*t;
      s1=S.v0*t-0.5*S.a1*t*t; s2=0.5*S.a2*t*t;
    }else{
      const v1s=Math.max(0,S.v0-S.a1*ts), v2s=S.a2*ts;
      if(S.slid){ v1=v1s; v2=v2s; }
      else { v1=v2=(S.v0*S.m1/(S.m1+S.M)); }
      const s1s=S.v0*ts-0.5*S.a1*ts*ts, s2s=0.5*S.a2*ts*ts;
      s1=s1s+v1*(t-ts); s2=s2s+v2*(t-ts);
    }
    return {s1:s1+S.d0, s2:s2, v1:v1, v2:v2};   // 接上飞行段已经走过的 d0
  },
  phase(){
    const S=this.S;
    if(S.t < S.ts) return "① 相对滑动：滑块受向后摩擦而减速，木板受向前摩擦而加速";
    if(S.slid) return "② 滑块已滑出木板：各自匀速，相对位移 = 板长 L";
    return "② 共速：摩擦力消失，两者一起匀速（木板速度最大、相对位移最大）";
  },
  bars(){
    const S=this.S, m1=S.m1, M=S.M;
    const px=m1*S.v1+M*S.v2;
    const Ek=0.5*m1*S.v1*S.v1+0.5*M*S.v2*S.v2;
    const E0=0.5*m1*S.v0*S.v0;
    return [
      {label:"系统动量 Pₓ", value:Math.abs(px), max:Math.max(m1*S.v0,0.1), color:"#36e0e0", text:fmt(px)+" kg·m/s"},
      {label:"摩擦生热 Q", value:Q0(S), max:Math.max(E0,0.1), color:"#ff9a5b", text:fmt(Q0(S))+" J"},
      {label:"系统动能 Eₖ", value:Ek, max:Math.max(E0,0.1), color:"#9d7bff", text:fmt(Ek)+" J"}
    ];
    function Q0(s){ return Math.max(0, E0-0.5*s.m1*s.v1*s.v1-0.5*s.M*s.v2*s.v2); }
  },
  readout(){
    const S=this.S;
    const Ek=0.5*S.m1*S.v1*S.v1+0.5*S.M*S.v2*S.v2;
    const E0=0.5*S.m1*S.v0*S.v0;
    const Q=Math.max(0,E0-Ek);
    const dsRaw=Math.max(0,S.s1-S.s2);
    const ds=S.slid?Math.min(dsRaw,S.L):dsRaw;
    return [["v块（滑块）", fmt(S.v1)+" m/s"],
            ["v板（木板）", fmt(S.v2)+" m/s"],
            ["相对位移 Δs", fmt(ds,2)+" m"],
            ["摩擦生热 Q", fmt(Q)+" J"],
            ["系统动量 Pₓ", fmt(S.m1*S.v1+S.M*S.v2)+" kg·m/s"],
            ["总动能 Eₖ", fmt(Ek)+" J"],
            ["木板长度 L", fmt(S.L,1)+" m"]];
  },
  step(dt){
    const S=this.S;
    S.t += dt*S.TS;
    const st=this.state(S.t);
    S.v1=st.v1; S.v2=st.v2; S.s1=st.s1; S.s2=st.s2;
    const last=S.hist[S.hist.length-1];
    if(!last || S.t-last.t > 0.006){
      S.hist.push({t:S.t, v:[S.v1,S.v2]});
      while(S.hist.length>2 && S.t-S.hist[0].t > this.vtSpan*1.25) S.hist.shift();
    }
    if(S.t > S.ts + 1.6 || Math.abs(S.s2) > 5.0) this.reset();   // 关键段播完自动重播
  },
  draw(ctx){
    const S=this.S, RAIL=0.10, bw=S.bw, bh=S.bh, L=S.L, sc=viewScale();
    // 台面
    const RW=6.4;
    const q1=proj(-RW,0.002,0.36), q2=proj(RW,0.002,0.36),
          q3=proj(RW,0.002,-0.36), q4=proj(-RW,0.002,-0.36);
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y);
    ctx.lineTo(q3.x,q3.y); ctx.lineTo(q4.x,q4.y); ctx.closePath(); ctx.fill();
    box3D(0, RAIL/2, 0, RW*2, RAIL, 0.66, "#24456e");
    line3D([-RW+0.05,RAIL+0.002,0.33],[RW-0.05,RAIL+0.002,0.33],"rgba(150,210,255,.55)",1.4);
    for(let x=-6; x<=6.001; x+=0.5){
      const big=Math.abs(x-Math.round(x))<1e-6;
      line3D([x,RAIL,0.331],[x,RAIL-(big?0.075:0.04),0.331], big?"rgba(150,210,255,.75)":"rgba(120,170,230,.38)", big?1.6:1);
      if(big && Math.abs(x)>1e-6){
        const p=proj(x,0,0.64);
        if(p.x>52 && p.x<W-52){
          ctx.fillStyle="#6f86a8"; ctx.font="11px sans-serif"; ctx.textAlign="center";
          ctx.fillText((x<0?"−":"")+Math.abs(x)+"m", p.x, p.y+14);
        }
      }
    }
    // 木板与滑块位置
    const xb=S.xb0+S.s2;                 // 板中心
    const xbl=S.blk0+S.s1;               // 块中心（blk0 为相对世界初位）
    // 板下投影
    const t1=proj(xb-L/2,0.002,0.5), t2=proj(xb+L/2,0.002,0.5);
    const t3=proj(xb+L/2,0.002,-0.5), t4=proj(xb-L/2,0.002,-0.5);
    ctx.fillStyle="rgba(0,0,0,.34)";
    ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.lineTo(t3.x,t3.y); ctx.lineTo(t4.x,t4.y); ctx.closePath(); ctx.fill();
    // 木板
    box3D(xb, RAIL+bh/2, 0, L, bh, 0.92, "#b0793f");
    // 滑块接触阴影
    contactShadow(xbl, RAIL+bh+0.004, 0, bw*0.62);
    // 滑块
    box3D(xbl, RAIL+bh+bw/2, 0, bw, bw, bw*0.86, "#3f7ad0");
    // 摩擦力：滑块受的力画在滑块身上，木板受的力画在板顶面，避免混在一起
    if(S.t < S.ts){
      const yBlk=RAIL+bh+bw*0.52, zBlk=bw*0.43+0.02;
      arrow3D([xbl-bw*0.10,yBlk,zBlk],[xbl-bw*0.10-0.40,yBlk,zBlk],"#ff9a5b",3.4,"");
      const yBd=RAIL+bh+0.012, zBd=0.30;
      arrow3D([xb+L*0.10,yBd,zBd],[xb+L*0.10+0.46,yBd,zBd],"#4fd39a",3.4,"");
    }
    // 速度箭头
    function vec(x,y,v,col){
      if(Math.abs(v)<0.05) return;
      arrow3D([x,y,0],[x+v*0.18,y,0],col,3.2,"");
    }
    vec(xbl, RAIL+bh+bw+0.22, S.v1, "#ffd24d");
    vec(xb+L*0.28, RAIL+bh+0.10, S.v2, "#ffd24d");
    ctx.fillStyle="#5b7099"; ctx.font="11.5px sans-serif"; ctx.textAlign="center";
    ctx.fillText("橙＝滑块所受摩擦力（向后）　绿＝木板所受摩擦力（向前）　黄＝速度方向", W/2, H-16);
  }
};

MODELS.m5 = {
  id:"m5", name:"滑块曲面（1/4圆弧）模型", sub:"水平动量守恒 + 机械能守恒 · 曲面轨道",
  cam:{yaw:0.40,pitch:0.20}, scale:0.92, cx:0.34, cy:0.62, vt:true, vtSpan:4,
  vtCrossLabel:"● 最高点（水平共速）",
  traces:[{name:"小球水平 v₁",color:"#4ea3ff",idx:0},{name:"斜面体 v₂",color:"#ff5d6c",idx:1}],
  params:[
    {key:"ratio",label:"质量比 m:M",min:0.2,max:2,step:0.1,value:0.3,dec:1},
    {key:"v0",label:"小球初速度 v₀",min:2,max:12,step:0.5,value:7,dec:1,unit:" m/s"},
    {key:"R",label:"圆弧半径 R",min:0.6,max:1.4,step:0.1,value:1.2,dec:1,unit:" m"}
  ],
  legend:[["#4ea3ff","小球 m"],["#9d7bff","斜面体 M"],["#ffd24d","速度矢量"],["#e90c64","上升高度 h"],["#5fd0ff","小球轨迹"]],
  knowledge:`
    <details open class="kcore"><summary>一、核心公式</summary><div class="body">
      <div class="fx"><span class="fxlab">① 最高点：水平共速，v<sub>y</sub> = 0</span><span class="eq">mv₀ = (M+m)v共</span></div>
      <div class="fx"><span class="fxlab">② 机械能守恒求最大高度</span><span class="eq">½mv₀² = ½(M+m)v共² + mgh</span></div>
      <div class="fx hot"><span class="fxlab">③ 返回最低点分离 = 弹性碰撞</span><span class="eq">v₁ = ${fr("m−M","m+M")}v₀　v₂ = ${fr("2m","m+M")}v₀</span></div>
    </div></details>
    <details open><summary>二、守恒判断</summary><div class="body">
      <p><b>水平方向</b>系统不受外力 ⟹ 动量守恒；<b>竖直方向</b>受重力、地面支持力冲量 ⟹ 不守恒；接触面光滑 ⟹ 机械能守恒。</p>
      <p>上升到最高点相当于一次<b>完全非弹性碰撞</b>：系统损失的动能全部转化为滑块的重力势能 mgh。</p>
    </div></details>
    <details open><summary>三、位移 — 时间关系（积分形式）</summary><div class="body">
      <p>对 <span class="eq">mv₁ + Mv₂ = mv₀</span> 沿过程积分：</p>
      <p><span class="eq">m·Δx₁ + M·Δx₂ = mv₀·t</span></p>
      <p>配合几何关系（滑块沿面的相对水平位移）即可求<b>运动时间</b>与<b>斜面体位移</b> —— 典型应用：已知斜面体前行 0.25R 反推上升时间（见典例1）。</p>
    </div></details>
    <details><summary>四、易错</summary><div class="body">
      <div class="warn2">
        ① <b>h 是竖直高度</b>（圆弧面即弧顶高），不一定等于轨道高度；<br>
        ② 斜面体被<b>固定</b>时，地面有冲量，系统动量<b>不守恒</b>（只能用机械能守恒）；<br>
        ③ 最高点是<b>水平方向</b>共速，不是滑块速度为零；<br>
        ④ 直斜面与四分之一圆弧结论完全相同 —— 只取决于「光滑 + 斜面体可动」，与形状无关。
      </div>
    </div></details>`,
  examples:`
    <div class="qcard wide"><span class="qtag">基础 · 变式1-2 · 2026·山西太原·一模</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图甲所示，曲面为四分之一圆弧、质量为 4 kg 的滑块静止在光滑水平地面上，一光滑小球以某一速度水平冲上滑块的圆弧面，且没有从滑块上端冲出。若测得在水平方向上小球与滑块的速度大小分别为 v₁、v₂，作出 v₂–v₁ 图像如图乙所示。取重力加速度大小 g=10 m/s²，不考虑任何阻力，求：<br>
          (1) 小球的初速度大小及质量 m；<br>
          (2) 小球运动到最高点时的速度大小；<br>
          (3) 小球能够上升的最大高度 h。</div>
        </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 地面光滑 ⟹ 全程水平动量守恒：mv₁ + Mv₂ = mv₀，整理成 v₂ 关于 v₁ 的一次函数；</div>
        <div class="step">② 与图乙直线对照：横截距给 v₀，纵截距给 m/M；</div>
        <div class="step">③ 最高点：小球与滑块<b>水平共速</b>（竖直分速度为零）；</div>
        <div class="step">④ 全程机械能守恒 ⟹ 动能损失 = 重力势能增量 mgh。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">① 水平方向动量守恒：<span class="eq">mv₁ + Mv₂ = mv₀</span> ⟹ <span class="eq">v₂ = −${fr("m","M")}v₁ + ${fr("m","M")}v₀</span></div>
        <div class="step">② 由图乙：横截距（v₂=0）⟹ v₀ = 4 m/s；纵截距（v₁=0）⟹ ${fr("m","M")}v₀ = 5 ⟹ ${fr("m","M")} = ${fr("5","4")}</div>
        <div class="step">故 m = ${fr("5","4")}×4 kg = <b>5 kg</b></div>
        <div class="step">③ 最高点二者共速：<span class="eq">v共 = ${fr("mv₀","m+M")} = ${fr("5×4","5+4")} = ${fr("20","9")} ≈ 2.2 m/s</span></div>
        <div class="step">④ 机械能守恒：<span class="eq">½mv₀² = ½(m+M)v共² + mgh</span> ⟹ <span class="eq">40 = ${fr("200","9")} + 50h</span></div>
        <div class="step"><span class="eq">h = ${fr("160","450")} = ${fr("16","45")} ≈ 0.36 m</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) v₀=4 m/s，m=5 kg　　(2) ${fr("20","9")} ≈ 2.2 m/s　　(3) ${fr("16","45")} ≈ 0.36 m</b></div></details>
    </div>

    <div class="qcard"><span class="qtag">进阶 · 典例1 · 2025·湖北黄冈·模拟预测（多选）</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图所示，质量为 M 的带有四分之一光滑圆弧轨道的小车静止置于光滑水平面上，圆弧的半径为 R（未知），一质量为 m 的小球以速度 v₀ 水平冲上小车，恰好达到圆弧的顶端，此时 M 向前走了 0.25R，接着小球又返回小车的左端。若 M=4m，重力加速度为 g，则（　　）</div>
          <div class="opts">
            <div>A．整个过程小车和小球组成系统动量和机械能都守恒</div>
            <div>B．圆弧的半径为 R = ${fr("2v₀²","5g")}</div>
            <div>C．小球在弧形槽上上升到最大高度所用的时间为 ${fr("9v₀","10g")}</div>
            <div>D．整个过程小球对小车做的功为 ${fr("8mv₀²","25")}</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① A：小球沿圆弧上升时竖直方向有加速度 ⟹ 总动量不守恒（仅水平分量守恒）；光滑 ⟹ 机械能守恒；</div>
        <div class="step">② B：「恰好到顶端」⟹ 最高点共速，动量守恒 + 机械能守恒解 R；</div>
        <div class="step">③ C：对动量守恒<b>沿时间积分</b>得位移关系，代入 x<sub>M</sub> = 0.25R 解 t；</div>
        <div class="step">④ D：返回分离 = 弹性碰撞求小车末速，再用动能定理求 W。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A. 系统竖直方向合外力不为零，总动量不守恒（只有水平分量守恒）；各接触面光滑，机械能守恒。A 错误。</div>
        <div class="step">B. 最高点共速：<span class="eq">mv₀ = (M+m)v共 = 5m·v共 ⟹ v共 = ${fr("v₀","5")}</span></div>
        <div class="step"><span class="eq">½mv₀² = ½·5m·v共² + mgR ⟹ mgR = ½mv₀²(1 − ${fr("1","5")}) = ${fr("2","5")}mv₀²</span></div>
        <div class="step">⟹ <span class="eq">R = ${fr("2v₀²","5g")}</span>，B 正确。</div>
        <div class="step">C. 对 mv₁ + Mv₂ = mv₀ 积分，设小球、小车对地位移为 x₁、x₂：</div>
        <div class="step"><span class="eq">m·x₁ + M·x₂ = mv₀t</span>，几何关系 x₁ = x₂ + R（小球相对小车水平走过 R）</div>
        <div class="step"><span class="eq">m(x₂+R) + 4m·x₂ = mv₀t ⟹ x₂ = ${fr("v₀t − R","5")}</span></div>
        <div class="step">代入 x₂ = 0.25R：<span class="eq">v₀t = 2.25R ⟹ t = ${fr("9R","4v₀")} = ${fr("9v₀","10g")}</span>，C 正确。</div>
        <div class="step">D. 返回最低点分离相当于弹性碰撞（M=4m）：<span class="eq">v₂ = ${fr("2m","m+M")}v₀ = ${fr("2","5")}v₀</span></div>
        <div class="step">对小车用动能定理：<span class="eq">W = ½Mv₂² = ½·4m·(${fr("2v₀","5")})² = ${fr("8mv₀²","25")}</span>，D 正确。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>BCD</b></div></details>
    </div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① (1) 摩擦力 f = μmg 互为作用力与反作用力，分别对物块、木板用牛顿第二定律；</div>
        <div class="step">② 「刚好滑到 C」⟹ C 处二者共速；「最后在 A 相对静止」⟹ 末态也共速 —— 由动量守恒，两个共速速度相同；</div>
        <div class="step">③ 全程能量守恒：摩擦生热 Q = μmg·2L（往返相对路程 2L）；上升段 A→C 再单列一次；</div>
        <div class="step">④ 两式相减消去 v₀ 与 v共 ⟹ L；回代求 v₀。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) 物块：<span class="eq">μmg = ma₁ ⟹ a₁ = μg = ${fr("g","2")}</span>（减速）</div>
        <div class="step">木板：<span class="eq">μmg = Ma₂ ⟹ a₂ = ${fr("μmg","M")} = ${fr("mg","2M")}</span>（加速）</div>
        <div class="step">(2) 系统水平动量守恒；物块在 C 点与返回 A 时均与木板共速，两共速速度相同：<span class="eq">v共 = ${fr("mv₀","M+m")}</span></div>
        <div class="step">A→C 过程能量守恒：<span class="eq">½mv₀² = ½(M+m)v共² + μmgL + mgR</span> ……①</div>
        <div class="step">全过程（C 经 B 返回 A）：<span class="eq">½mv₀² = ½(M+m)v共² + μmg·2L</span> ……②</div>
        <div class="step">②−①：<span class="eq">μmgL = mgR ⟹ L = ${fr("R","μ")} = 2R</span></div>
        <div class="step">代回①：<span class="eq">½mv₀²·${fr("M","M+m")} = μmg·2R + mgR = 2mgR</span></div>
        <div class="step">⟹ <span class="eq">v₀² = ${fr("4gR(M+m)","M")}</span>，即 <span class="eq">v₀ = 2√(${fr("gR(M+m)","M")})</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) a<sub>物</sub> = g/2，a<sub>板</sub> = mg/(2M)　　(2) L = 2R，v₀ = 2√(gR(M+m)/M)</b></div></details>
    </div>`,
  P:null,S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(p=>this.P[p.key]=p.value); }
    const m=1, M=m/this.P.ratio, R=this.P.R, v0=this.P.v0;
    const rb=0.14, wt=0.42;                 // 小球半径、顶面平台/右墙厚度
    const X0=-(R+wt)/2;                     // 使实体在画面居中
    this.S = { m,M,R,v0,rb,wt,
      psi:0, phid:v0/R, dir:1,              // 沿弧角 ψ、角速度、方向(1上/−1下)
      X:X0, V:0,                            // 实体参考点(弧底) 与速度
      phase:'approach',                     // approach 地面接近 | arc 弧上 | slide 滑离
      bx:X0-1.0, by:rb, bvx:v0, bvy:0,      // 小球状态
      trail:[], vh:[], t:0, done:false, doneAt:0, slideT:0, _vx:v0, _vy:0 };
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  hist(){ return this.S ? this.S.vh : null; },
  step(dt){
    const S=this.S, m=S.m, M=S.M, R=S.R, g=9.8;
    if(S.done){ S.t+=dt; if(S.t - S.doneAt > 0.9) this.reset(); return; }
    S.t += dt;
    const n=10, h=dt/n, A=m+M;
    for(let i=0;i<n;i++){
      if(S.phase==='approach'){                 // 沿光滑地面滑向弧底
        S.bx += S.bvx*h;
        if(S.bx >= S.X){ S.bx=S.X; S.phase='arc'; S.psi=0; S.phid=S.v0/S.R; }
      } else if(S.phase==='arc'){
        const psi=S.psi, c=Math.cos(psi), s=Math.sin(psi);
        // 拉格朗日方程推出的小球沿可动 1/4 圆弧的角加速度（顶端自动折返，无停滞）
        const K = M*c*c/A + s*s;
        const wdot = (-g*s - (m*R/A)*s*c*S.phid*S.phid) / (R*K);
        S.phid += wdot*h;
        let npsi = psi + S.phid*h;
        if(npsi >= Math.PI/2){                  // 到达圆弧顶端
          npsi = Math.PI/2;
          if(S.phid > 0.04){                    // 速度够大：冲出顶端 → 脱轨腾空
            S.psi = Math.PI/2;
            const V = m*S.v0/(m+M);             // 顶端水平共速（cos(π/2)=0）
            S.V = V; S.phase='air';
            S.bx = S.X + (R-S.rb); S.by = R;    // 顶端球心
            S.bvx = V; S.bvy = R*S.phid;        // 与实体水平共速 + 竖直上抛
            break;
          } else { S.phid = 0; }                // 恰好到顶：折返下滑
        }
        if(npsi <= 0){                          // 回到弧底 → 脱离曲面，沿地面滑离
          npsi = 0;
          const V = (m*S.v0 - m*R*S.phid)/(m+M);
          const vx = V + R*S.phid;
          S.V = V; S.phid = 0;
          S.phase='slide';
          S.bx = S.X; S.by = S.rb; S.bvx = vx; S.bvy = 0; S.slideT = 0;
          break;
        }
        S.psi = npsi;
        S.dir = S.phid>=0 ? 1 : -1;
        S.V = (m*S.v0 - m*R*c*S.phid)/(m+M);                   // 由水平动量守恒反推实体速度
        S.X += S.V*h;
      } else if(S.phase==='air'){               // 脱轨腾空：相对实体竖直上抛（地面系为抛物线）
        S.bvy -= g*h;
        S.bx += S.bvx*h;
        S.by += S.bvy*h;
        S.X  += S.V*h;
        if(S.bvy < 0 && S.by <= R){             // 落回弧顶 → 重新回到轨道
          S.by = R; S.phase = 'arc'; S.dir = -1;
          S.psi = Math.PI/2; S.phid = S.bvy/R;  // 切向速度（向下），继续沿弧下滑
          break;
        }
      } else {                                  // 滑离：小球沿地面匀速，实体匀速远离
        S.bx += S.bvx*h; S.by = S.rb;
        S.X  += S.V*h;
        S.slideT += h;
        if(S.slideT > 0.45){ S.done=true; S.doneAt=S.t; break; }
      }
    }
    // 当前小球速度（实验室系）与球心位置
    let vx,vy,bx,by;
    if(S.phase==='approach'){ vx=S.bvx; vy=0; bx=S.bx; by=S.by; }
    else if(S.phase==='arc'){
      const c=Math.cos(S.psi), s=Math.sin(S.psi);
      const V=(m*S.v0 - m*R*c*S.phid)/(m+M); S.V=V;
      vx = V + R*c*S.phid; vy = R*s*S.phid;
      bx = S.X + (R-S.rb)*s;                                 // 球心（凹面在其左侧/上侧）
      by = R*(1-c) + S.rb*c;
    } else { vx=S.bvx; vy=S.bvy; bx=S.bx; by=S.by; }
    S._vx=vx; S._vy=vy;
    // 动态轨迹（球心）
    S.trail.push({x:bx,y:by,z:0});
    if(S.trail.length>800) S.trail.shift();
    // v–t 记录：小球水平速度 / 实体速度（最高点处两线相交 = 水平共速）
    const last=S.vh[S.vh.length-1];
    if(!last || S.t-last.t > 1/60){
      S.vh.push({t:S.t, v:[vx, S.V]});
      while(S.vh.length>2 && S.t-S.vh[0].t > this.vtSpan*1.3) S.vh.shift();
    }
  },
  readout(){
    const S=this.S;
    const hNow = S.phase==='arc' ? S.R*(1-Math.cos(S.psi)) : (S.phase==='air' ? S.by : 0);
    const vx=S._vx||0, vy=S._vy||0;
    const Ek=0.5*S.m*(vx*vx+vy*vy) + 0.5*S.M*(S.V*S.V);
    const Ep=S.m*9.8*hNow;
    const phTxt = S.phase==='approach' ? "地面滑入" : (S.phase==='arc' ? (S.dir>0 ? "沿弧上滑" : "沿弧下滑") : (S.phase==='air' ? "脱轨腾空" : "滑离曲面"));
    return [["小球速度",fmt(Math.hypot(vx,vy))+" m/s"],["斜面体速度",fmt(S.V)+" m/s"],
            ["上升高度 h",fmt(hNow)+" m"],["机械能 E",fmt(Ek+Ep)+" J"],["阶段",phTxt]];
  },
  draw(ctx){
    const S=this.S, R=S.R, rb=S.rb, wt=S.wt, X=S.X;
    const d=0.50, zf=d/2, zb=-d/2, N=28;
    // 实体轮廓（xy）：左面 1/4 圆弧（切线由水平到竖直）→ 平顶 → 右直墙 → 地面
    const out=[];
    for(let i=0;i<=N;i++){ const ps=(i/N)*Math.PI/2; out.push([X+R*Math.sin(ps), R*(1-Math.cos(ps))]); }
    out.push([X+R+wt, R]);      // 顶面右端
    out.push([X+R+wt, 0]);      // 右墙落到地面
    // 地面阴影
    contactShadow(X+(R+wt)/2, 0, 0, (R+wt)*0.60);
    // 拉伸实体：侧面（圆弧侧为渐变曲面）+ 前后大面，按深度排序绘制
    const faces=[], L=out.length;
    for(let i=0;i<L;i++){
      const a=out[i], b=out[(i+1)%L];
      const k = (i<N) ? (-0.22 + 0.34*(i/N)) : 0.02;
      faces.push({pts:[[a[0],a[1],zf],[b[0],b[1],zf],[b[0],b[1],zb],[a[0],a[1],zb]], color:shade("#9d7bff",k)});
    }
    faces.push({pts:out.map(p=>[p[0],p[1],zb]), color:shade("#9d7bff",-0.36)});  // 背面
    faces.push({pts:out.map(p=>[p[0],p[1],zf]), color:"#9d7bff"});               // 正面
    faces.forEach(f=>{ f.d=f.pts.reduce((s,p)=>s+proj(p[0],p[1],p[2]).d,0)/f.pts.length; });
    faces.sort((A,B)=>A.d-B.d);
    for(const f of faces){
      const pr=f.pts.map(p=>proj(p[0],p[1],p[2]));
      ctx.beginPath(); pr.forEach((q,idx)=> idx?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.closePath();
      ctx.fillStyle=f.color; ctx.fill();
      ctx.strokeStyle="rgba(10,16,30,.40)"; ctx.lineWidth=1; ctx.stroke();
    }
    // 左面圆弧高光
    let prev=null;
    for(let i=0;i<=N;i++){ const ps=(i/N)*Math.PI/2; const p=[X+R*Math.sin(ps), R*(1-Math.cos(ps)), zf+0.012];
      if(prev) line3D(prev,p,"rgba(235,242,255,.55)",1.6); prev=p; }
    // 小球动态轨迹
    if(S.trail.length>1){
      ctx.save(); ctx.globalAlpha=0.60;
      for(let i=1;i<S.trail.length;i++){
        const a=S.trail[i-1], b=S.trail[i];
        line3D([a.x,a.y,a.z],[b.x,b.y,b.z], "#5fd0ff", 2.2);
      }
      ctx.restore();
    }
    // 当前小球位置
    let bx,by;
    if(S.phase==='arc'){ const c=Math.cos(S.psi), s=Math.sin(S.psi); bx=X+(R-rb)*s; by=R*(1-c)+rb*c; }
    else { bx=S.bx; by=S.by; }
    // 速度矢量
    const sp=Math.hypot(S._vx||0,S._vy||0);
    if(sp>0.06){
      const Lv=Math.min(0.42,0.07*sp+0.10), ux=(S._vx||0)/sp, uy=(S._vy||0)/sp;
      arrow3D([bx,by,0],[bx+ux*Lv,by+uy*Lv,0],"#ffd24d",3);
    }
    sphere(bx,by,0,rb,"#4ea3ff");
    // 标注
    const pM=proj(X+R*0.86+wt*0.5, R*0.40, zf);
    ctx.fillStyle="#ffffff"; ctx.font="bold 17px sans-serif"; ctx.textAlign="center";
    ctx.fillText("M", pM.x, pM.y);
    const pR=proj(X+R*0.5, R+0.12, zf);
    ctx.fillStyle="#9fd2ff"; ctx.font="13px sans-serif";
    ctx.fillText("R", pR.x, pR.y);
    const pG=proj(X+(R+wt)/2, 0.0, 0);
    ctx.fillStyle="rgba(150,175,215,.9)"; ctx.font="12px sans-serif";
    ctx.fillText("接触面光滑", pG.x, pG.y+16);
  },
  phase(){
    if(!this.S) return "";
    return this.S.phase==='approach' ? "小球沿光滑地面滑向圆弧面"
         : this.S.phase==='arc' ? (this.S.dir>0 ? "小球沿 1/4 圆弧上滑" : "小球沿 1/4 圆弧下滑")
         : this.S.phase==='air' ? "小球脱轨腾空 · 随后落回轨道"
         : "小球滑离曲面 · 两者匀速分离";
  }
};

/* ---------- 6 滑块弹簧 ---------- */
MODELS.m6 = {
  id:"m6", name:"滑块弹簧模型", sub:"动量守恒 + 机械能守恒 · 共速时弹性势能最大",
  cam:{yaw:0.55,pitch:0.26}, scale:0.74, cx:0.50, cy:0.43, vt:true,
  traces:[{name:"v₁（蓝）",color:"#4ea3ff",idx:0},{name:"v₂（红）",color:"#ff5d6c",idx:1}],
  params:[
    {key:"ratio",label:"质量比 m₂:m₁",min:0.2,max:5,step:0.1,value:1,dec:1},
    {key:"v1",label:"m₁ 初速度 v₁",min:0,max:6,step:0.5,value:2.5,dec:1,unit:" m/s"},
    {key:"v2",label:"m₂ 初速度 v₂",min:-6,max:6,step:0.5,value:-2.5,dec:1,unit:" m/s"},
    {key:"k",label:"劲度系数 k",min:30,max:160,step:5,value:60,dec:0,unit:" N/m"}
  ],
  legend:[["#2f6fd0","滑块 m₁（蓝）"],["#d0454f","滑块 m₂（红）"],["#ffd24d","轻弹簧 k"],["#36e0e0","光滑水平面 / 刻度"]],
  knowledge:`
    <details open class="kcore"><summary>一、核心公式</summary><div class="body">
      <div class="fx"><span class="fxlab">① 动量守恒（合外力为零）</span><span class="eq">m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′</span></div>
      <div class="fx"><span class="fxlab">② 机械能守恒（只有弹力做功）</span><span class="eq">½m₁v₁² + ½m₂v₂² = ½m₁v₁′² + ½m₂v₂′² + Eₚ</span></div>
      <div class="fx hot"><span class="fxlab">③ 共速瞬间：Eₚ 最大、Eₖ 最小</span><span class="eq">v共 = ${fr("m₁v₁ + m₂v₂","m₁+m₂")}</span><span class="eq">Eₚmax = ${fr("m₁m₂","2(m₁+m₂)")}(v₁ − v₂)²</span></div>
      <div class="fx"><span class="fxlab">④ 回到原长：Eₚ = 0，动能最大</span><span class="eq">Eₖmax = Eₖ初（等价弹性碰撞）</span></div>
    </div></details>
    <details open><summary>二、v–t 图像看什么</summary><div class="body">
      <p>两条曲线都呈<b>正弦式</b>，绕质心速度 V 摆动，全程满足动量守恒。</p>
      <p>① <b>两曲线交点 = 共速点</b>，此刻 Eₚ 最大、Eₖ 最小；</p>
      <p>② 交点处曲线<b>最陡</b>（弹力最大、加速度最大）；</p>
      <p>③ 曲线与 t 轴所围<b>面积 = 位移</b>，两条曲线面积之差 = 弹簧形变量的变化；</p>
      <p>④ 周期 <span class="eq">T = 2π√(${fr("m₁m₂","(m₁+m₂)k")})</span>，只由质量和 k 决定，<b>与初速度无关</b>（初速度只改振幅）。</p>
    </div></details>
    <details><summary>三、两个关键状态</summary><div class="body">
      <p><b>共速</b>（弹簧最长或最短）：相当于一次完全非弹性碰撞，减少的动能全部转化为 Eₚ。</p>
      <p><b>原长</b>（Eₚ = 0）：相当于一次弹性碰撞刚结束，动能回到最大。</p>
      <p>所以弹簧模型 = 「完全非弹性碰 → 弹性碰」的无限循环。</p>
    </div></details>
    <details><summary>四、易错</summary><div class="body">
      <div class="warn2">
        ① 共速时<b>动量不变</b>，变的是动能，别把「共速」当「动量最小」；<br>
        ② 共速速度不一定为零（有质心速度时 v共 ≠ 0）；<br>
        ③ 求 Eₚmax 必须用<b>相对速度</b> (v₁ − v₂)，不能用各自速度代入；<br>
        ④ 弹簧<b>最长与最短</b>时 Eₚ 一样大（形变量大小相同）；<br>
        ⑤ 接触面有摩擦时机械能不守恒，要用能量守恒并计入 Q = f·s相对。
      </div>
    </div></details>`,
  examples:`

      <details><summary>思路</summary><div class="body">
        <div class="step">① C 下摆：机械能守恒求碰前速度 v₀；</div>
        <div class="step">② C 与 A 弹性正碰：碰撞极短，弹力、摩擦力的冲量可忽略 ⟹ 用动量守恒 + 动能守恒；</div>
        <div class="step">③ 碰后 A、B 与弹簧：水平方向无外力，A、B 间摩擦是内力 ⟹ 动量守恒求 A 的新速度；</div>
        <div class="step">④ 形变量由 +x₀ 变成 −x₀ ⟹ Eₚ 不变 ⟹ 用能量守恒（含 Q = μ m<sub>B</sub>g·2x₀）解 μ。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) C 下摆：<span class="eq">m<sub>C</sub> gL(1 − cos60°) = ½m<sub>C</sub> v₀²</span> ⟹ v₀ = 3 m/s</div>
        <div class="step">C 与 A 弹性碰：<span class="eq">m<sub>C</sub> v₀ = m<sub>C</sub> v<sub>C</sub> + m<sub>A</sub> v<sub>A</sub></span>，<span class="eq">½m<sub>C</sub> v₀² = ½m<sub>C</sub> v<sub>C</sub>² + ½m<sub>A</sub> v<sub>A</sub>²</span></div>
        <div class="step">解得 <span class="eq">v<sub>A</sub> = ${fr("2m<sub>C</sub>","m<sub>C</sub> + m<sub>A</sub>")}v₀ = 1.2 m/s</span>（方向向左）</div>
        <div class="step">(2) 以向左为正，A、B 系统动量守恒：<span class="eq">m<sub>A</sub> v<sub>A</sub> = m<sub>B</sub> v<sub>B</sub> + m<sub>A</sub> v<sub>A</sub>′</span></div>
        <div class="step"><span class="eq">0.4×1.2 = 0.1×0.8 + 0.4 v<sub>A</sub>′</span> ⟹ v<sub>A</sub>′ = 1.0 m/s</div>
        <div class="step">形变量同为 x₀ ⟹ Eₚ 不变；A 相对 B 滑过 2x₀ = 0.2 m：</div>
        <div class="step"><span class="eq">½m<sub>A</sub> v<sub>A</sub>² = ½m<sub>A</sub> v<sub>A</sub>′² + ½m<sub>B</sub> v<sub>B</sub>² + μ m<sub>B</sub> g·2x₀</span></div>
        <div class="step">代入 0.288 = 0.200 + 0.032 + 0.2μ ⟹ <b>μ = 0.28</b></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) v<sub>A</sub> = 1.2 m/s　　(2) μ = 0.28</b></div></details>
    </div>

        <div class="qcol">
          <div class="qtext">如图，物块 A、B 用轻弹簧连接并放置于水平传送带上，传送带以 1 m/s 的恒定速率顺时针转动。t=0 时，A 的速度大小为 2 m/s、方向水平向右，B 的速度为 0，弹簧处于原长；t=t₁ 时（t₁ 为未知量），A 第一次与传送带共速，弹簧弹性势能 0.75 J。已知 A、B 可视为质点，质量分别为 1 kg、2 kg，与传送带的动摩擦因数分别为 0.5、0.25；g 取 10 m/s²，A、B 始终在传送带上，弹簧始终在弹性限度内，则（　　）</div>
          <div class="opts">
            <div>A．在 t = ${fr("t₁","2")} 时，A 的加速度大小比 B 的小</div>
            <div>B．t = t₁ 时，B 的速度大小为 0.5 m/s</div>
            <div>C．t = t₁ 时，弹簧的压缩量为 0.2 m</div>
            <div>D．0～t₁ 过程中，A 在传送带上留下的划痕长度小于 0.05 m</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 传送带对 A、B 的摩擦力<b>大小相等方向相反</b>（f = μmg 恰好相等），故 A、B 系统合外力为零 ⟹ 动量守恒。</div>
        <div class="step">② 加速度看「f + F弹」：两者受同一弹力，质量小的加速度大。</div>
        <div class="step">③ 压缩量用功能关系（含摩擦力做功）。</div>
        <div class="step">④ 划痕长度＝相对位移，靠 <b>v–t 图像面积</b>比较两段大小。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">f<sub>A</sub> = 0.5×1×10 = 5 N，f<sub>B</sub> = 0.25×2×10 = 5 N，大小相等。</div>
        <div class="step">A 向右减速、B 向右加速；共速前系统合外力为零：<span class="eq">m<sub>A</sub> v₀ = m<sub>A</sub> v + m<sub>B</sub> v<sub>B</sub></span>，v = 1 m/s ⟹ <b>v<sub>B</sub> = 0.5 m/s</b>，B 对。</div>
        <div class="step">对 A、B：<span class="eq">f + F弹 = m<sub>A</sub> a<sub>A</sub></span>，<span class="eq">f + F弹 = m<sub>B</sub> a<sub>B</sub></span>，因 m<sub>A</sub> &lt; m<sub>B</sub> ⟹ <b>a<sub>A</sub> &gt; a<sub>B</sub></b>，A 错。</div>
        <div class="step">功能关系：<span class="eq">−f x<sub>A</sub> + f x<sub>B</sub> + ½m<sub>A</sub> v₀² = ½m<sub>A</sub> v² + ½m<sub>B</sub> v<sub>B</sub>² + Eₚ</span></div>
        <div class="step">代入 0.75 J 解得 <span class="eq">x<sub>A</sub> − x<sub>B</sub> = 0.1 m</span> ⟹ 压缩量 0.1 m ≠ 0.2 m，C 错。</div>
        <div class="step">相对位移：<span class="eq">x相A = x<sub>A</sub> − v t₁</span>，<span class="eq">x相B = v t₁ − x<sub>B</sub></span>，两者之和 = x<sub>A</sub> − x<sub>B</sub> = 0.1 m。</div>
        <div class="step">由 <span class="eq">a<sub>A</sub> = 2a<sub>B</sub></span> 作 v–t 图（原题图）：x相A 对应图中 MNA 面积，x相B 对应 NOBA 面积，</div>

          <div class="qtext">如图，光滑水平地面上停放着一辆质量 M=2 kg 的小车，车上的水平轨道与半径 R=0.5 m 的四分之一光滑圆弧轨道在 M 点相切。在水平轨道的右端固定一轻质弹簧，弹簧处于自然长度时左端位于水平轨道的 N 点正上方，N 点右侧轨道光滑，M、N 间距离 L=0.9 m。一个质量 m=1 kg 的物块（可视为质点）从圆弧轨道最高点由静止滑下，g 取 10 m/s²，物块与水平轨道 MN 段的动摩擦因数 μ=0.2，弹簧始终在弹性限度内，空气阻力不计。在后续运动过程中（　　）</div>

            <div>C．物块运动过程中弹簧共被压缩 2 次</div>

      <details><summary>思路</summary><div class="body">
        <div class="step">① 只有 MN 段有摩擦 ⟹ 用「总路程」算机械能损耗：s = E₀/f。</div>
        <div class="step">② 弹簧最短时物块与小车共速；水平方向动量守恒且初动量为零 ⟹ 共速为 0。</div>
        <div class="step">③ 能否再次到达 N，看剩余路程够不够 L。</div>
        <div class="step">④ 相对位移用「人船模型」；总位移是矢量合成，别漏竖直位移。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．E₀ = mgR = 5 J，f = μmg = 2 N，相对滑动总路程 <span class="eq">s = ${fr("E₀","f")} = 2.5 m</span>。</div>
        <div class="step">过程：M→N→（压缩后返回）→M→冲上圆弧→返回 M→再向右滑 x 停下：</div>
        <div class="step"><span class="eq">0.9 + 0.9 + x = 2.5</span> ⟹ x = 0.7 m，即停在 M 右侧 0.7 m 处，A 对。</div>
        <div class="step">B．第一次到 N 损失 <span class="eq">ΔE₁ = fL = 1.8 J</span>；弹簧最短时两者共速，水平动量为零 ⟹ 共速为 0，</div>
        <div class="step"><span class="eq">Eₚmax = E₀ − ΔE₁ = 3.2 J</span>，B 对。</div>
        <div class="step">C．第二次过 M 后只能再滑 0.7 m &lt; L = 0.9 m，到不了 N ⟹ 弹簧只被压缩 1 次，C 错。</div>
        <div class="step">D．水平方向相对位移 <span class="eq">Δx = R + x = 1.2 m</span>；人船模型 <span class="eq">m x₁ + M x₂ = 0</span>，<span class="eq">x₁ − x₂ = Δx</span></div>
        <div class="step">⟹ x₁ = 0.8 m，但还有竖直位移 R = 0.5 m，总位移 <span class="eq">s = √(x₁² + R²) ≠ 0.8 m</span>，D 错。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>AB</b></div></details>
    </div>

    <div class="qcard wide"><span class="qtag">压轴 · 变式1-3 · 2026·宁夏石嘴山·模拟预测</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">质量 m₁=2 kg 的滑块 a 和质量 m₂=1 kg 可视为质点的小滑块 b 放置在光滑水平面上，中间连接有被压缩的弹簧，弹簧和 b 不栓接。现由静止同时释放两滑块，b 被弹开后沿光滑水平面滑行速度 v=4 m/s；b 离开水平面后以平行于滑板 c 的速度恰好从上端滑上其上表面，滑板 c 足够长、质量 m₃=4 kg。斜面倾角 θ=37°，c 与斜面间动摩擦因数 μ₁=0.76，b 与 c 间动摩擦因数 μ₂=0.8，最大静摩擦力等于滑动摩擦力，sin37°=0.6，g=10 m/s²。<br>
          (1) 求 b 刚滑入 c 的速度大小 v₁；<br>
          (2) 求弹簧存储的弹性势能 Eₚ；<br>
