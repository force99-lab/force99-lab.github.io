      <details><summary>思路</summary><div class="body">
        <div class="step">(1) b 离开水平面后做斜抛/直线运动，速度沿斜面方向，按<b>分量关系</b>换算。</div>
        <div class="step">(2) 弹开过程：动量守恒（a、b 反向）+ 机械能守恒 ⟹ Eₚ。</div>
        <div class="step">(3) 先判断 c 是否相对斜面静止（比较两方向的摩擦力与重力分量），再对 b 用牛顿第二定律求减速位移，最后算 Q = f·s。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) 水平方向速度不变：<span class="eq">v = v₁ cos θ</span> ⟹ <span class="eq">v₁ = ${fr("v","cos37°")} = ${fr("4","0.8")} = 5 m/s</span></div>
        <div class="step">(2) 弹开瞬间动量守恒、机械能守恒（弹簧原为压缩，Eₚ 全部释放）：</div>
        <div class="step"><span class="eq">m₁ v_a = m₂ v</span> ⟹ v<sub>a</sub> = 2 m/s；<span class="eq">Eₚ = ½m₁ v_a² + ½m₂ v² = 4 + 8 = 12 J</span></div>
        <div class="step">(3) 判断 c 是否静止：沿斜面向上 <span class="eq">μ₂m₂g cosθ = 6.4 N</span>；</div>
        <div class="step">斜面对 c 的最大静摩擦 <span class="eq">μ₁(m₂+m₃)g cosθ = 30.4 N</span>，而 <span class="eq">m₃g sinθ + μ₂m₂g cosθ = 24 + 6.4 = 30.4 N</span>，</div>
        <div class="step">恰好平衡 ⟹ <b>c 始终静止</b>，只需分析 b。</div>
        <div class="step">对 b：<span class="eq">μ₂m₂g cosθ − m₂g sinθ = m₂a</span> ⟹ a = 0.4 m/s²（沿斜面向上为负，即减速下滑方向）</div>
        <div class="step">匀减速到停：<span class="eq">s = ${fr("v₁²","2a")} = ${fr("25","0.8")} = 31.25 m</span></div>
        <div class="step"><span class="eq">Q = μ₂m₂g s cosθ = 0.8×1×10×31.25×0.8 = 200 J</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) v₁ = 5 m/s　　(2) Eₚ = 12 J　　(3) Q = 200 J</b></div></details>
    </div>
    <div class="foot">例题与配图均取自《第08讲 动量守恒定律模型（模型和方法）（解析版）》§模型六 · 模型特训，原图保留、未改绘。</div>`,
  P:null, S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(function(p){ this.P[p.key]=p.value; }, this); }
    const m1=1.0, m2=m1*this.P.ratio, k=this.P.k;
    const L0=2.10, bw=0.52, TS=0.22, M=m1+m2;
    const x1=-L0/2, x2=L0/2;
    const v1=this.P.v1, v2=this.P.v2;
    const w=Math.sqrt(k*(1/m1+1/m2)), rd0=v2-v1;
    this.S={ m1,m2,k,L0,bw,TS,M,
      t:0, X:(m1*x1+m2*x2)/M, V:(m1*v1+m2*v2)/M,
      r:0, rdot:rd0, rd0, w, amp:Math.abs(rd0)/w,
      x1, x2, v1, v2, E0:0.5*m1*v1*v1+0.5*m2*v2*v2, hist:[] };
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  hist(){ return this.S.hist; },
  evalAt(t){
    const S=this.S, r=(S.rd0/S.w)*Math.sin(S.w*t), rd=S.rd0*Math.cos(S.w*t);
    const X=S.X+S.V*t;
    const x1=X-(S.m2/S.M)*(r+S.L0), x2=X+(S.m1/S.M)*(r+S.L0);
    const v1=S.V-(S.m2/S.M)*rd,  v2=S.V+(S.m1/S.M)*rd;
    return {t:t, r:r, rdot:rd, x1:x1, x2:x2, v1:v1, v2:v2};
  },
  phase(){
    const S=this.S, dv=S.v1-S.v2;
    if(Math.abs(dv) < 0.06){
      if(S.r < -0.004) return "② 共速（压缩最短）：Eₚ 最大，Eₖ 最小";
      if(S.r >  0.004) return "⑤ 共速（伸长最长）：Eₚ 最大，Eₖ 最小";
      return "④ 弹簧恢复原长：Eₚ = 0，Eₖ 最大";
    }
    if(S.r <= 0) return S.rdot < 0 ? "① 压缩：弹簧变短，m₁ 减速、m₂ 加速" : "③ 复原：弹性势能→动能，弹力做正功";
    return S.rdot > 0 ? "⑥ 伸长：弹簧被拉长，m₁ 加速、m₂ 减速" : "⑦ 回缩：伸长量减小，Eₚ→动能";
  },
  bars(){
    const S=this.S, px=S.m1*S.v1+S.m2*S.v2;
    const Ep=0.5*S.k*S.r*S.r, Ek=0.5*S.m1*S.v1*S.v1+0.5*S.m2*S.v2*S.v2;
    const emax=Math.max(S.E0, 0.1);
    const pmax=Math.max(Math.abs(S.m1*this.P.v1 + S.m2*this.P.v2), 0.1);
    return [
      {label:"系统动量 Pₓ", value:Math.abs(px), max:pmax, color:"#36e0e0", text:fmt(px)+" kg·m/s"},
      {label:"弹性势能 Eₚ", value:Ep, max:emax, color:"#ffd24d", text:fmt(Ep)+" J"},
      {label:"系统动能 Eₖ", value:Ek, max:emax, color:"#9d7bff", text:fmt(Ek)+" J"}
    ];
  },
  readout(){
    const S=this.S, px=S.m1*S.v1+S.m2*S.v2;
    const Ep=0.5*S.k*S.r*S.r, Ek=0.5*S.m1*S.v1*S.v1+0.5*S.m2*S.v2*S.v2;
    return [["v₁（m₁ 速度）", fmt(S.v1)+" m/s"],
            ["v₂（m₂ 速度）", fmt(S.v2)+" m/s"],
            ["弹簧形变量 x", (S.r>=0?"+":"−")+fmt(Math.abs(S.r)*100,1)+" cm"],
            ["弹性势能 Eₚ", fmt(Ep)+" J"],
            ["系统动能 Eₖ", fmt(Ek)+" J"],
            ["系统动量 Pₓ", fmt(px)+" kg·m/s"],
            ["总机械能 E", fmt(Ep+Ek)+" J"]];
  },
  step(dt){
    const S=this.S;
    S.t += dt*S.TS;
    const st=this.evalAt(S.t);
    S.r=st.r; S.rdot=st.rdot; S.x1=st.x1; S.x2=st.x2; S.v1=st.v1; S.v2=st.v2;
    this.vtSpan = 2*Math.PI/S.w;
    const last=S.hist[S.hist.length-1];
    if(!last || S.t-last.t > 0.006){
      S.hist.push({t:S.t, v:[S.v1,S.v2]});
      const T=2*Math.PI/S.w, win=1.75*T;
      while(S.hist.length>2 && S.t-S.hist[0].t > win) S.hist.shift();
    }
    if(Math.abs(S.x1)>5.6 || Math.abs(S.x2)>5.6) this.reset();
  },
  draw(ctx){
    const S=this.S, RAIL=0.10, bw=S.bw, sc=viewScale();
    // 实验台（比画布更宽，两端被画布裁掉 → 看起来是一条无限长的轨道）
    const RW=6.4;
    const q1=proj(-RW,0.002,0.36), q2=proj(RW,0.002,0.36),
          q3=proj(RW,0.002,-0.36), q4=proj(-RW,0.002,-0.36);
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y);
    ctx.lineTo(q3.x,q3.y); ctx.lineTo(q4.x,q4.y); ctx.closePath(); ctx.fill();
    box3D(0, RAIL/2, 0, RW*2, RAIL, 0.66, "#24456e");
    line3D([-RW+0.05,RAIL+0.002,0.33],[RW-0.05,RAIL+0.002,0.33],"rgba(150,210,255,.55)",1.4);
    for(let x=-6; x<=6.001; x+=0.5){
      const big=Math.abs(x-Math.round(x))<1e-6;
      line3D([x,RAIL,0.331],[x,RAIL-(big?0.075:0.04),0.331], big?"rgba(150,210,255,.75)":"rgba(120,170,230,.38)", big?1.6:1);
      if(big && Math.abs(x)>1e-6){
        const p=proj(x,0,0.64);
        if(p.x>52 && p.x<W-52){          // 贴边的刻度不标数字，避免被裁
          ctx.fillStyle="#6f86a8"; ctx.font="11px sans-serif"; ctx.textAlign="center";
          ctx.fillText((x<0?"−":"")+Math.abs(x)+"m", p.x, p.y+14);
        }
      }
    }
    // 落影
    contactShadow(S.x1,RAIL+0.002,0,bw*0.7);
    contactShadow(S.x2,RAIL+0.002,0,bw*0.7);
    // 弹簧：仍在 z=0 平面、两端插进滑块内部，先画一层让方块压住端头（无缝隙）
    const sx1=S.x1+bw/2-0.10, sx2=S.x2-bw/2+0.10, len=Math.max(0.06, sx2-sx1);
    const amp=Math.max(7, Math.min(15, 10*S.L0/len));   // 像素单位
    const Ep=0.5*S.k*S.r*S.r, hot=Ep>0.55*Math.max(S.E0,0.01);
    if(hot){
      ctx.save();
      ctx.shadowColor="rgba(255,210,77,.9)"; ctx.shadowBlur=16;
      spring3D([sx1,RAIL+bw/2,0],[sx2,RAIL+bw/2,0], 7, amp, "#ffd24d", 3.0);
      ctx.restore();
    }
    spring3D([sx1,RAIL+bw/2,0],[sx2,RAIL+bw/2,0], 7, amp, hot?"#ffe27a":"#a9cdf0", 3.0);
    // 滑块（覆盖弹簧端头，形成"连着"的视觉）
    box3D(S.x1, RAIL+bw/2, 0, bw, bw, bw*0.86, "#2f6fd0");
    box3D(S.x2, RAIL+bw/2, 0, bw, bw, bw*0.86, "#d0454f");
    // 速度矢量（只留箭头，不标数字）
    function vec(x,v,col){
      if(Math.abs(v)<0.05) return;
      const y=RAIL+bw+0.20;
      arrow3D([x,y,0],[x+v*0.20,y,0],col,3.2,"");
    }
    vec(S.x1,S.v1,"#ffd24d");
    vec(S.x2,S.v2,"#ffd24d");
    ctx.fillStyle="#5b7099"; ctx.font="11.5px sans-serif"; ctx.textAlign="center";
    ctx.fillText("v共 ≠ 0 时系统会整体平移，越出刻度自动重播", W/2, H-16);
  }
};

MODELS.m7 = {
  id:"m7", name:"人船模型", sub:"人动船动 · 位移与质量成反比",
  cam:{yaw:0.55,pitch:0.28}, scale:0.95,
  params:[
    {key:"ratio",label:"质量比 m:M",min:0.1,max:1,step:0.05,value:0.25,dec:2},
    {key:"L",label:"船长 L",min:2,max:6,step:0.5,value:4,dec:1,unit:" m"},
    {key:"u",label:"人相对船速度",min:0.4,max:2,step:0.1,value:1,dec:1,unit:" m/s"}
  ],
  legend:[["#ffb14d","人 m（行走）"],["#b5793c","船 M（漂浮）"],["#36e0e0","水面（光滑）"],["#3ee08a","船长 L = s人+s船"]],
  knowledge:`
    <details open class="kcore"><summary>一、核心公式（人船位移关系）</summary><div class="body">
      <div class="fx"><span class="fxlab">① 水平方向动量守恒（初动量为零）</span><span class="eq">m·v人 = M·v船</span></div>
      <div class="fx"><span class="fxlab">② 位移关系（对动量守恒沿时间积分）</span><span class="eq">m·s人 = M·s船，s人 + s船 = L</span></div>
      <div class="fx hot"><span class="fxlab">③ 人、船对地位移</span><span class="eq">s人 = ${fr("ML","m+M")}　s船 = ${fr("mL","m+M")}</span></div>
    </div></details>
    <details open><summary>二、运动特点</summary><div class="body">
      <p>人动船动、人静船静、人快船快、人慢船慢、人左船右；人、船速度（及平均速度）大小均与质量成<b>反比</b>。</p>
    </div></details>
    <details open><summary>三、拓展（某一方向动量守恒）</summary><div class="body"><p>只要系统在某一方向不受外力，该方向就满足人船关系：半圆槽中小球下摆、车上水平抛球、气球沿绳上升等。</p></div></details>
    <details><summary>四、易错</summary><div class="body"><div class="warn2">① 位移比是质量「反比」，不是正比；② 系统在该方向初动量必须为零（或该方向初动量为零）才能直接套 s人+s船=L；③ 人船模型求的是对地位移，不是相对位移。</div></div></details>`,
  examples:`
    <div class="qcard"><span class="qtag">基础 · 变式1-1 · 2025·安徽淮北·一模</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图所示，质量为 M、半径为 R 的内壁光滑半圆槽静置在光滑水平地面上，现将可视为质点、质量为 m 的小球从半圆槽左侧圆心等高处由静止释放。已知 M=2m，不计空气阻力，小球从释放到最低点的过程中，下列说法正确的是（　　）</div>
          <div class="opts">

      <details><summary>思路</summary><div class="body">
        <div class="step">① 小球竖直方向有加速度 ⟹ 系统总动量不守恒，仅<b>水平方向</b>守恒；</div>
        <div class="step">② 水平动量守恒沿时间积分得位移关系，配合几何 x₁+x₂=R 求球、槽对地位移；</div>
        <div class="step">③ 最低点用机械能守恒求速度；对槽用动量定理求合外力冲量。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．小球竖直方向受槽支持力与重力不平衡，系统竖直方向合外力≠0，只有水平方向动量守恒，总动量不守恒。A 错误。</div>
        <div class="step">B．水平方向动量守恒：<span class="eq">Mv₁ = mv₂</span>，对时间积累 <span class="eq">Mx₁ = mx₂</span>，几何关系 <span class="eq">x₁ + x₂ = R</span></div>
        <div class="step">联立得球相对槽的水平位移 <span class="eq">x₂ = ${fr("2","3")}R</span>，球对地的实际位移大小 <span class="eq">x = √(R² + x₂²) = ${fr("√13","3")}R</span> ≠ ${fr("2","3")}R。B 错误。</div>
        <div class="step">C．机械能守恒：<span class="eq">mgR = ${fr("1","2")}Mv₁² + ${fr("1","2")}mv₂²</span>，联立得 <span class="eq">v₁ = √(gR/3)</span>（槽），<span class="eq">v₂ = 2√(gR/3)</span>（球）。C 错误（把槽速当球速）。</div>
        <div class="step">D．对槽由动量定理：<span class="eq">I = Mv₁ = M√(gR/3)</span>。D 正确。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>D</b></div></details>
    </div>

      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图，长度为 L=2 m、质量为 M=2 kg 的长薄板静止放置在光滑水平地面上。一质量为 m=0.5 kg 的青蛙（可视为质点）静止在木板的左端。观察发现，青蛙竖直向上跳起时，能上升的最大高度为 h=1 m。青蛙跳起与着陆过程时间极短，忽略空气阻力，g=10 m/s²，求：<br>
          (1) 青蛙竖直向上跳起时，求青蛙做的功 W；<br>
          (2) 若青蛙从板的左端爬至右端，求此过程中青蛙对地的位移大小；<br>

      <details><summary>思路</summary><div class="body">
        <div class="step">① (1) 竖直起跳：动能定理 W−mgh=0；</div>
        <div class="step">② (2) 水平方向人船模型：mx₁=Mx₂，x₁+x₂=L；</div>
        <div class="step">③ (3) 斜跳：竖直上抛求 v_y，水平动量守恒 mv_x=MV，蛙落地相对板距离 Δx=(v_x+V)t。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) 由动能定理：<span class="eq">W − mgh = 0 ⟹ W = mgh = 0.5×10×1 = 5 J</span></div>
        <div class="step">(2) 水平方向动量守恒：<span class="eq">mv₁ = Mv₂</span>，两边乘时间 <span class="eq">mx₁ = Mx₂</span>，几何关系 <span class="eq">x₁ + x₂ = L = 2 m</span></div>
        <div class="step">⟹ <span class="eq">x₁ = ${fr("ML","m+M")} = ${fr("2×2","2.5")} = 1.6 m</span>（青蛙对地位移）</div>
        <div class="step">(3) 竖直上抛：<span class="eq">t = ${fr("2v_y","g")} ⟹ v_y = ${fr("gt","2")} = ${fr("10×0.4","2")} = 2 m/s</span></div>
        <div class="step">起跳做功同(1)：<span class="eq">W = ${fr("1","2")}m(v_x²+v_y²) + ${fr("1","2")}MV² = 5 J</span>；水平动量守恒 <span class="eq">mv_x = MV</span></div>
        <div class="step">蛙落地时到板右端距离 <span class="eq">Δx = (v_x + V)t</span>，联立解得 <span class="eq">Δx = ${fr("4√5","5")} m</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) 5 J　　(2) 1.6 m　　(3) ${fr("4√5","5")} m</b></div></details>
    </div>

    <div class="qcard"><span class="qtag">拓展 · 变式1-2 · 2026·陕西·模拟预测（多选）</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图所示，将一个内外侧均光滑的半圆形槽 P 置于光滑的水平面上，半圆形槽的半径为 R、质量为 m。在槽的右侧有一个质量为 m 的物块 Q（不与槽粘连），现让一质量为 4m 的小球自右侧槽口的正上方高 0.5R 处由静止开始下落，小球从 A 点与半圆形槽相切进入槽内，则下列说法正确的是（　　）</div>
          <div class="opts">
            <div>A．小球第一次运动到半圆槽最低点时，小球、半圆槽和物块在水平方向动量守恒</div>
            <div>B．小球第一次运动到半圆槽最低点时，小球与槽的速度大小相等</div>
            <div>C．小球第一次运动到半圆槽最低点时，物块 Q 向右运动的距离为 R</div>
            <div>D．整个过程半圆槽 P 对物块 Q 的冲量大小为 2m√(gR)</div>

        <div class="step">① 系统水平方向不受外力 ⟹ 水平动量守恒（A 正确）；</div>
        <div class="step">② 由动量守恒 4mv₁=(m+m)v₂ 得 v₁:v₂=1:2，速度大小不等（B 错）；</div>
        <div class="step">③ 人船模型 4mx₁=2mx₂ 得 Q 右移 ${fr("2R","3")}≠R（C 错）；</div>
        <div class="step">④ 机械能守恒求 v₂，再对 Q 用动量定理求槽对 Q 的冲量（D 正确）。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．由小球、半圆槽和物块组成的系统在水平方向不受外力，水平方向动量守恒。A 正确。</div>
        <div class="step">B．水平动量守恒（向左为正）：<span class="eq">4mv₁ − (m+m)v₂ = 0 ⟹ v₁ : v₂ = 1 : 2</span>，速度大小不等。B 错误。</div>
        <div class="step">C．水平方向人船模型：<span class="eq">4mx₁ = (m+m)x₂</span>，几何关系 <span class="eq">x₁ + x₂ = R</span> ⟹ <span class="eq">x₂ = ${fr("2R","3")}</span>（Q 向右运动距离），≠R。C 错误。</div>
        <div class="step">D．机械能守恒：<span class="eq">4mg(R+0.5R) = ${fr("1","2")}·4m·v₁² + ${fr("1","2")}·2m·v₂²</span> 联立得 <span class="eq">v₁=√(gR)，v₂=2√(gR)</span></div>
        <div class="step">半圆槽 P 对物块 Q 的冲量 <span class="eq">I_Q = m·v₂ = 2m√(gR)</span>。D 正确。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>AD</b></div></details>
    </div>`,
  P:null,S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(p=>this.P[p.key]=p.value); }
    const m=1, M=m/this.P.ratio, L=this.P.L;
    this.S={ m,M,L,u:this.P.u, a:0, done:false, t:0, gait:0 };
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  step(dt){
    const S=this.S;
    if(S.done){ S.t+=dt; S.gait*=Math.pow(0.05,dt); if(S.t>1.4){ this.reset(); } return; }
    S.a += S.u*dt;
    S.gait += dt*7.0;
    if(S.a>=S.L){ S.a=S.L; S.done=true; S.t=0; }
  },
  readout(){
    const S=this.S, tot=S.m+S.M;
    const sp=S.a*S.M/tot, sb=S.a*S.m/tot;
    return [["人对地位移 s人",fmt(sp)+" m"],["船对地位移 s船",fmt(sb)+" m"],["位移之和 s人+s船",fmt(sp+sb)+" m"],["人相对船走程",fmt(S.a)+" m"]];
  },
  draw(ctx){
    const S=this.S, m=S.m, M=S.M, L=S.L, a=S.a;
    const xb=-m*a/(m+M);
    const personX = xb - L/2 + a;
    const deckY = 0.30;
    drawWater();
    contactShadow(xb, 0.0, 0, L*0.62);
    boat3D(xb, L, 1.05, deckY, "#b5793c", "#caa46a");   // 真实船体（艏艉尖、舷弧、吃水）
    stickMan(personX, deckY, 0, 1.05, "#33dd55", S.gait, !S.done);  // 火柴人（行走）站在甲板（绿色）
    drawDispInScene(m,M,L,a);  // 场景中动态画两位移矢量（棕=船漂移、绿=人对地位移）
  }
};

/* ---------- 8 爆炸 ---------- */
MODELS.m8 = {
  id:"m8", name:"爆炸模型", sub:"斜抛至最高点炸裂 → 两块平抛 · 动量守恒 · 机械能增加",
  cam:{yaw:0.28,pitch:0.18}, scale:0.90, cx:0.38, cy:0.60,
  params:[
    {key:"theta",label:"抛射角 θ",min:30,max:70,step:1,value:55,dec:0,unit:"°"},
    {key:"v0",label:"初速度 v₀",min:3,max:10,step:0.5,value:6,dec:1,unit:" m/s"},
    {key:"E",label:"爆炸能量 E",min:2,max:60,step:1,value:10,dec:0,unit:" J"},
    {key:"ratio",label:"质量比 m₁:m₂",min:0.2,max:5,step:0.1,value:1,dec:1}
  ],
  legend:[["#e8eefc","上升段小球"],["#ff5d6c","碎片 m₁"],["#4ea3ff","碎片 m₂"],["#ffd24d","最高点炸裂"]],
  knowledge:`
    <details open class="kcore"><summary>一、三条规律</summary><div class="body">
      <div class="fx"><span class="fxlab">① 动量守恒</span><span class="eq">Σp = Σp′（内力≫外力）</span></div>
      <div class="fx"><span class="fxlab">② 机械能增加</span><span class="eq">Eₖ′ &gt; Eₖ（化学能→机械能）</span></div>
      <div class="fx hot"><span class="fxlab">③ 位置不变</span><span class="eq">爆炸瞬间位移可忽略，从原位置以新动量开始运动</span></div>
    </div></details>
    <details open><summary>二、解题方法</summary><div class="body"><p>先确定爆炸前系统总动量，再按矢量分解列守恒式；能量用爆炸前后动能差（增加的机械能 = 释放的化学能）。</p></div></details>
    <details open><summary>三、两类典型</summary><div class="body"><p><b>静止爆炸</b>：碎片动量等大反向；<b>运动物体爆炸</b>：总动量沿原方向不变（水平、竖直分量分别守恒）。</p></div></details>
    <details><summary>四、易错</summary><div class="body"><div class="warn2">① 爆炸过程机械能增加，<b>不能用动能守恒</b>；② 多碎片按矢量分解，各方向分别列守恒；③ 爆炸瞬间位置不变，但速度突变。</div></div></details>`,
  examples:`
    <div class="qcard"><span class="qtag">基础 · 典例1 · 2026·山东临沂·二模</span>
      <div class="qmain"><div class="qcol">
        <div class="qtext">2026 年某次区域联合演训中，我国东风系列战术导弹从山地发射阵地（海拔高度为 H）以初速度 v₀、抛射角 θ 斜向上发射，打击敌方位于低洼山谷的目标（目标阵地比发射阵地海拔低 h）。导弹飞行过程中忽略空气阻力，重力加速度为 g，导弹质量为 m，下列说法正确的是（　　）</div>
        <div class="opts">
          <div>A．导弹飞行总时间为 t = ${fr("2v₀sinθ","g")}</div>
          <div>B．当 θ 角为 45° 时导弹水平射程一定最大</div>
          <div>C．导弹击中目标时的动能为 ${fr("1","2")}mv₀² + mgH，飞行全过程机械能守恒</div>
          <div>D．若导弹在最高点受干扰炸裂为质量相等的两块，炸裂后瞬间一块竖直自由下落，则另一块的速度大小为 2v₀cosθ</div>
        </div>
      </div></div>
      <details><summary>思路</summary><div class="body">
        <div class="step">① A：目标比发射点低 h，竖直位移 −h，飞行时间比等高时更长；</div>
        <div class="step">② B：45° 射程最大仅适用于落点与发射点等高；</div>
        <div class="step">③ C：机械能守恒，但击中动能应为 ${fr("1","2")}mv₀²+mgh，与 H 无关；</div>
        <div class="step">④ D：最高点速度水平 v₀cosθ，水平动量守恒求另一块速度。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．等高时 t=${fr("2v₀sinθ","g")}，目标更低（−h），由 −h = v₀sinθ·t′ − ${fr("1","2")}gt′² 得 t′ &gt; ${fr("2v₀sinθ","g")}。A 错误。</div>
        <div class="step">B．45° 射程最大结论仅适用于发射点和落地点等高，本题有高度差，不成立。B 错误。</div>
        <div class="step">C．全程机械能守恒，发射点比目标高 h，重力势能减少 mgh，击中动能为 ${fr("1","2")}mv₀² + mgh，与 H 无关。C 错误。</div>
        <div class="step">D．最高点速度水平 <span class="eq">v = v₀cosθ</span>；炸裂水平动量守恒 <span class="eq">m·v₀cosθ = ${fr("m","2")}·0 + ${fr("m","2")}·v</span> ⟹ <span class="eq">v = 2v₀cosθ</span>。D 正确。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>D</b></div></details>
    </div>

    <div class="qcard"><span class="qtag">进阶 · 变式1-1 · 2026·山东青岛·二模（多选）</span>
      <div class="qmain"><div class="qcol">
        <div class="qtext">“双响炮”从地面竖直向上发射，到达距地面最高点时瞬间炸裂成 A、B 两块。A 块的质量为 10 g，以 1 m/s 的速度水平向东平抛后落在泥土中不再反弹；B 块的质量为 2.5 g，与水平地面碰撞后反弹的最大高度为 0.45 m（A、B 块最终落地点在同一水平面上）。已知 B 块第一次与地面接触的时间为 0.1 s，B 块与水平地面间的动摩擦因数为 0.2，重力加速度 g=10 m/s²，不考虑空气阻力。下列说法正确的是（　　）</div>
        <div class="opts">
          <div>A．在最高点的速度大小为 4 m/s</div>
          <div>B．A、B 两块第一次落地点间的距离为 3 m</div>
          <div>C．B 块与地面第一次接触时，受到的弹力的冲量大小为 0.06 N·s</div>
          <div>D．B 块第一次反弹至最高点时的速度大小为 0</div>
        </div>
      </div></div>
      <details><summary>思路</summary><div class="body">
        <div class="step">① 炸裂过程水平动量守恒（竖直总动量为零）求 B 块速度；</div>
        <div class="step">② 两块下落高度相同，平抛时间相同，落地点间距 = (v_A+v_B)t；</div>
        <div class="step">③ B 落地后竖直反弹用动量定理求弹力冲量；水平摩擦使水平速度减小，反弹至最高点仍具水平速度。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">A．炸裂动量守恒 <span class="eq">m_A v_A = m_B v_B</span> ⟹ <span class="eq">0.01×1 = 0.0025×v_B ⟹ v_B = 4 m/s</span>。A 正确。</div>
        <div class="step">B．下落高度 h=1.8 m，<span class="eq">t₁ = √(2h/g) = 0.6 s</span>；落地点间距 <span class="eq">x = (v_A+v_B)t₁ = (1+4)×0.6 = 3 m</span>。B 正确。</div>
        <div class="step">C．B 落地竖直速度 <span class="eq">v_By = gt₁ = 6 m/s</span>；反弹高 0.45 m ⟹ <span class="eq">v′_By = √(2g·0.45) = 3 m/s</span>。竖直动量定理（向上正）：<span class="eq">I_弹 − m_B gΔt = m_B v′_By − (−m_B v_By)</span></div>
        <div class="step">⟹ <span class="eq">I_弹 = 0.0025×(3+6) + 0.0025×10×0.1 = 0.025 N·s ≠ 0.06 N·s</span>。C 错误。</div>
        <div class="step">D．水平：<span class="eq">F_N = I_弹/Δt = 0.25 N</span>，<span class="eq">−μF_NΔt = m_B v′_Bx − m_B v_Bx</span> ⟹ <span class="eq">−0.2×0.25×0.1 = 0.0025(v′_Bx − 4)</span> ⟹ <span class="eq">v′_Bx = 2 m/s</span>。反弹至最高点竖直速度为零，速度大小 = 2 m/s ≠ 0。D 错误。</div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>AB</b></div></details>
    </div>

    <div class="qcard wide"><span class="qtag">拓展 · 变式1-3 · 2026·四川内江·模拟预测</span>
      <div class="qmain">
        <div class="qcol">
          <div class="qtext">如图所示，有一右侧带挡板的长木板静止在光滑水平地面上，可视为质点的物块 A、B 中间夹有微量炸药静置在木板上，物块 B 离挡板的距离 L=7.5 m。炸药具有的化学能 E₀=18 J，引爆炸药将两物块沿木板分开，炸药化学能的 50% 转化为两物块的动能，在以后的运动过程中两物块的碰撞以及物块与挡板间的碰撞均为弹性碰撞，碰撞时间和爆炸时间均不计，两物块均未从木板上滑下。已知两物块质量均为 m=1 kg，长木板的质量 M=2m，物块 A 与长木板间的动摩擦因数 μ=0.2，物块 B 与长木板间无摩擦，重力加速度 g=10 m/s²，求：<br>

      </div>
      <details><summary>思路</summary><div class="body">
        <div class="step">① (1) 爆炸：A、B 系统动量守恒 + 能量（50%E₀→动能）求 v_A；</div>
        <div class="step">② (2) 爆炸后 A 向左匀减、B 匀速向左、木板向左匀加；A 与木板共速后再一起匀速，B 到挡板弹性碰撞；</div>
        <div class="step">③ 分段求时间，最后对 B—木板弹性碰撞求木板速度。</div>
      </div></details>
      <details><summary>解答</summary><div class="body">
        <div class="step">(1) 对 A、B 系统动量守恒：<span class="eq">mv_A = mv_B</span>；能量：<span class="eq">E₀×50% = ${fr("1","2")}mv_A² + ${fr("1","2")}mv_B²</span></div>
        <div class="step">⟹ <span class="eq">9 = ${fr("1","2")}(v_A²+v_B²)</span>，且 v_A=v_B ⟹ <span class="eq">v_A = v_B = 3 m/s</span></div>
        <div class="step">(2) A、木板共速（向左正）：<span class="eq">mv_A = (m+M)v₁ ⟹ v₁ = ${fr("3","3")} = 1 m/s</span>；A 受 μmg=ma ⟹ a=2 m/s²，<span class="eq">v₁ = v_A − at₁ ⟹ t₁ = 1 s</span></div>
        <div class="step">B 位移 <span class="eq">x_B = v_B t₁ = 3 m</span>，木板位移 <span class="eq">x_板 = ${fr("v₁","2")}t₁ = 0.5 m</span>，<span class="eq">Δx = x_B + x_板 = 3.5 m &lt; L</span> 假设成立</div>
        <div class="step">之后 A 与木板共速匀速，B 到挡板：<span class="eq">L − Δx = (v_B + v_板)t₂ ⟹ 4 = (3+1)t₂ ⟹ t₂ = 1 s</span>，总 <span class="eq">t = t₁+t₂ = 2 s</span></div>
        <div class="step">B 与木板弹性碰撞（右为正）：<span class="eq">mv_B + M(−v₁) = mv′_B + Mv₂</span>，<span class="eq">${fr("1","2")}mv_B² + ${fr("1","2")}Mv₁² = ${fr("1","2")}mv′_B² + ${fr("1","2")}Mv₂²</span> ⟹ <span class="eq">v₂ = ${fr("5","3")} m/s</span></div>
      </div></details>
      <details class="ansd"><summary>答案</summary><div class="body"><b>(1) 3 m/s　　(2) t = 2 s，碰后木板速度 ${fr("5","3")} m/s</b></div></details>
    </div>`,
  P:null,S:null,
  reset(){
    if(!this.P){ this.P={}; this.params.forEach(p=>this.P[p.key]=p.value); }
    const g=9.8, th=this.P.theta*Math.PI/180, v0=this.P.v0, E=this.P.E, r=this.P.ratio;
    const m=1, m1=m*r/(1+r), m2=m/(1+r);
    const vx0=v0*Math.cos(th), vy0=v0*Math.sin(th);
    const T=vy0/g, H=vy0*vy0/(2*g), xL=-2.2, apexX=xL+vx0*T;
    // 爆炸沿水平方向：质心系中两块反向，V_rel = √(2E/μ)
    const mu=m1*m2/(m1+m2), Vrel=Math.sqrt(Math.max(0,2*E/mu));
    const u1=vx0+(m2/(m1+m2))*Vrel;          // 碎片 m₁：被“向前”抛出
    const u2=vx0-(m1/(m1+m2))*Vrel;          // 碎片 m₂：相对反向
    this.S={g,m,m1,m2,r,v0,vx0,vy0,T,H,xL,apexX,mu,Vrel,u1,u2,E,th,
      phase:'rise', t:0, t2:0, flash:0,
      bx:xL, by:0, p1x:apexX, p1y:H, p2x:apexX, p2y:H,
      trailRise:[], trail1:[], trail2:[], done:false, doneAt:0};
  },
  onParam(k,v){ this.P[k]=v; this.reset(); },
  step(dt){
    const S=this.S;
    if(S.done){ S.t+=dt; if(S.t-S.doneAt>1.0) this.reset(); return; }
    S.t += dt;
    if(S.flash>0) S.flash=Math.max(0,S.flash-dt);
    if(S.phase==='rise'){
      if(S.t>=S.T){                          // 到达最高点 → 炸裂为两块
        S.phase='fall'; S.t2=0; S.flash=0.30;
        S.p1x=S.apexX; S.p1y=S.H; S.p2x=S.apexX; S.p2y=S.H;
        S.trail1.push({x:S.apexX,y:S.H,z:0});
        S.trail2.push({x:S.apexX,y:S.H,z:0});
      } else {
        const t=S.t;
        S.bx=S.xL+S.vx0*t; S.by=S.vy0*t-0.5*S.g*t*t;
        S.trailRise.push({x:S.bx,y:S.by,z:0}); if(S.trailRise.length>320) S.trailRise.shift();
      }
    } else {                                 // 两块各自做平抛（水平速度恒定、竖直自由落体）
      S.t2 += dt;
      const tt=Math.min(S.t2,S.T);
      S.p1x=S.apexX+S.u1*tt; S.p1y=S.H-0.5*S.g*tt*tt;
      S.p2x=S.apexX+S.u2*tt; S.p2y=S.H-0.5*S.g*tt*tt;
      S.trail1.push({x:S.p1x,y:S.p1y,z:0}); if(S.trail1.length>320) S.trail1.shift();
      S.trail2.push({x:S.p2x,y:S.p2y,z:0}); if(S.trail2.length>320) S.trail2.shift();
      if(S.t2>=S.T){ S.t2=S.T; S.done=true; S.doneAt=S.t; }
    }
  },
  readout(){
    const S=this.S;
    if(S.phase==='rise'){
      const t=Math.min(S.t,S.T), vy=S.vy0-S.g*t;
      return [["水平速度 vₓ",fmt(S.vx0)+" m/s"],["竖直速度 v_y",fmt(vy)+" m/s"],
              ["高度 y",fmt(S.vy0*t-0.5*S.g*t*t)+" m"],["动量 Pₓ",fmt(S.m*S.vx0)+" kg·m/s"]];
    }
    return [["碎片 m₁ 速度",fmt(S.u1)+" m/s"],["碎片 m₂ 速度",fmt(S.u2)+" m/s"],
            ["系统 Pₓ",fmt(S.m1*S.u1+S.m2*S.u2)+" kg·m/s"],["火药增能 ΔEₖ",fmt(S.E)+" J"]];
  },
  draw(ctx){
    const S=this.S;
    function poly(tr,color,w){
      if(!tr||tr.length<2) return;
      ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.beginPath();
      tr.forEach((p,i)=>{ const q=proj(p.x,p.y,p.z); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
      ctx.stroke();
    }
    // 轨迹：上升段 + 两块下落段
    poly(S.trailRise,"rgba(190,208,235,.65)",2.4);
    poly(S.trail1,"#ff5d6c",3.0);
    poly(S.trail2,"#4ea3ff",3.0);
    // 小球 / 两块
    if(S.phase==='rise'){
      sphere(S.bx,S.by,0,0.13,"#e8eefc");
      const vy=S.vy0-S.g*Math.min(S.t,S.T);
      arrow3D([S.bx,S.by,0],[S.bx+S.vx0*0.12,S.by+vy*0.12,0],"#ffd24d",3);
    } else {
      sphere(S.p1x,S.p1y,0,0.13,"#ff5d6c");
      sphere(S.p2x,S.p2y,0,0.13,"#4ea3ff");
      arrow3D([S.p1x,S.p1y,0],[S.p1x+S.u1*0.06,S.p1y,0],"rgba(255,93,108,.95)",3);
      arrow3D([S.p2x,S.p2y,0],[S.p2x+S.u2*0.06,S.p2y,0],"rgba(78,163,255,.95)",3);
    }
    // 爆炸点标记 + 闪光
    const pa=proj(S.apexX,S.H,0);
    ctx.strokeStyle="rgba(255,210,77,.55)"; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(pa.x,pa.y,5,0,TAU); ctx.stroke(); ctx.setLineDash([]);
    if(S.flash>0){
      const k=1-S.flash/0.30;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-k);
      ctx.strokeStyle="#ffd24d"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(pa.x,pa.y,8+k*40,0,TAU); ctx.stroke();
      for(let i=0;i<8;i++){ const a=i*TAU/8;
        ctx.beginPath();
        ctx.moveTo(pa.x+Math.cos(a)*(10+k*18), pa.y+Math.sin(a)*(10+k*18));
        ctx.lineTo(pa.x+Math.cos(a)*(16+k*36), pa.y+Math.sin(a)*(16+k*36));
        ctx.stroke(); }
      ctx.restore();
    }
    // 标注
    ctx.fillStyle="#cdd9f2"; ctx.font="13px sans-serif"; ctx.textAlign="center";
    const pm=proj(S.apexX, S.H+0.16, 0);
    ctx.fillText("最高点炸裂", pm.x, pm.y);
    if(S.phase==='rise'){
      const pl=proj(S.xL-0.12, 0.14, 0); ctx.textAlign="right";
      ctx.fillStyle="#9fb4d4"; ctx.fillText("斜抛", pl.x, pl.y);
    }
  },
  phase(){
    if(!this.S) return "";
    return this.S.phase==='rise' ? "小球斜抛上升 → 最高点" : "最高点炸裂 · 两块平抛下落";
  }
};


/* ============ 人船模型专用图元 ============ */
function drawWater(){
  const A=proj(-9,0,4.5),B=proj(9,0,4.5),C=proj(9,0,-4.5),D=proj(-9,0,-4.5);
  ctx.fillStyle="rgba(36,118,188,.16)";
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.lineTo(D.x,D.y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(120,200,255,.20)"; ctx.lineWidth=1;
  for(let k=0;k<6;k++){
    const zz=-4 + k*1.6;
    const x0=proj(-7,0,zz), x1=proj(7,0,zz);
    ctx.beginPath(); ctx.moveTo(x0.x,x0.y); ctx.lineTo(x1.x,x1.y); ctx.stroke();
  }
}
/* 船体：细长小舟（艏艉尖、舷弧、吃水），投影环带 + 画家算法（仿 box3D 按 d 升序绘制） */
function boat3D(cx,L,W,deckY,hull,deck){
  const fr=[-1,-0.66,-0.33,0,0.33,0.66,1];   // 沿船长站位（分数）
  const kd=0.46;                               // 吃水深度（龙骨低于甲板）
  const rings=[];
  for(let i=0;i<fr.length;i++){
    const u=fr[i], w=W*Math.sqrt(Math.max(0.05,1-u*u)), x=cx+u*(L/2);
    const rib=[[-w/2,deckY],[-w*0.40,deckY-kd*0.50],[0,deckY-kd],[w*0.40,deckY-kd*0.50],[w/2,deckY]];
    rings.push(rib.map(function(p){return proj(x,p[1],p[0]);}));
  }
  const hullP=[], deckP=[];
  for(let i=0;i<rings.length-1;i++){
    const A=rings[i], B=rings[i+1];
    for(let k=0;k<A.length-1;k++){
      const a=A[k],b=A[k+1],c=B[k+1],d=B[k];
      hullP.push({pts:[a,b,c,d], d:(a.d+b.d+c.d+d.d)/4});
    }
    const a=A[0],b=A[4],c=B[4],d=B[0];
    deckP.push({pts:[a,b,c,d], d:(a.d+b.d+c.d+d.d)/4});
  }
  let dmin=1e9,dmax=-1e9; hullP.forEach(function(p){ if(p.d<dmin)dmin=p.d; if(p.d>dmax)dmax=p.d; });
  hullP.sort(function(u,v){return u.d-v.d;});
  deckP.sort(function(u,v){return u.d-v.d;});
  hullP.forEach(function(p){
    ctx.beginPath();
    p.pts.forEach(function(q,k){ k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.closePath();
    const t=dmax>dmin?(p.d-dmin)/(dmax-dmin):0.5;
    ctx.fillStyle=shade(hull, -0.22 + 0.44*t);
    ctx.fill();
    ctx.strokeStyle="rgba(8,14,26,.45)"; ctx.lineWidth=1; ctx.stroke();
  });
  deckP.forEach(function(p){
    ctx.beginPath();
    p.pts.forEach(function(q,k){ k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); });
    ctx.closePath();
    ctx.fillStyle=shade(deck,0.06);
    ctx.fill();
    ctx.strokeStyle="rgba(8,14,26,.40)"; ctx.lineWidth=1; ctx.stroke();
  });
}
/* 人：火柴人（圆头+直线四肢），带行走步态（双腿前后交替摆动+抬脚，双臂反相） */
function stickMan(x, footY, z, h, color, gait, moving){
  const base=proj(x, footY, z);
  const top=proj(x, footY+h, z);
  const ppu=Math.max(22, Math.hypot(top.x-base.x, top.y-base.y));
  const Hpx=ppu*0.92, bx=base.x, by=base.y;
  const lw=Math.max(2.4, Hpx*0.052);
  const hipY=by-0.46*Hpx, shY=by-0.74*Hpx, headCY=by-0.88*Hpx, headR=0.12*Hpx;
  const bob=moving?Math.abs(Math.sin(gait))*0.05*Hpx:0;
  const hy=hipY-bob, sy=shY-bob, hY=headCY-bob;
  ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineWidth=lw; ctx.lineCap="round"; ctx.lineJoin="round";
  const sw=moving?Math.sin(gait):0;
  const dx=0.20*Hpx*sw, lift=0.10*Hpx;
  const lFootX=bx+dx, rFootX=bx-dx;
  const lFootY=by-Math.max(0,sw)*lift, rFootY=by-Math.max(0,-sw)*lift;
  const lHandX=bx-dx*0.7, rHandX=bx+dx*0.7, handY=sy+0.30*Hpx;
  ctx.beginPath(); ctx.moveTo(bx,hy); ctx.lineTo(lFootX,lFootY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,hy); ctx.lineTo(rFootX,rFootY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,hy); ctx.lineTo(bx,sy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,sy); ctx.lineTo(lHandX,handY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,sy); ctx.lineTo(rHandX,handY); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx,hY,headR,0,TAU); ctx.fill();
}
/* 位移关系可视化：直接在动画场景（水面）上显示 s人 + s船 = 当前船长 L */
function drawDispInScene(m,M,L,a){
  const zG=0.95, yG=0.12;
  const xb=-m*a/(m+M);
  const curL=xb-L/2, curR=xb+L/2, ghostL=-L/2, ghostR=L/2;
  const o1=proj(-L/2-0.7,yG-0.02,zG), o2=proj(L/2+0.7,yG-0.02,zG);
  ctx.strokeStyle="rgba(160,190,225,.22)"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(o1.x,o1.y); ctx.lineTo(o2.x,o2.y); ctx.stroke(); ctx.setLineDash([]);
  const g0=proj(ghostL,yG-0.02,zG), g1=proj(ghostR,yG-0.02,zG);
  ctx.fillStyle="rgba(210,225,250,.85)";
  ctx.beginPath(); ctx.arc(g0.x,g0.y,2.6,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(g1.x,g1.y,2.6,0,TAU); ctx.fill();
  const sP=M*a/(m+M);                          // 人对地位移（相对地，从 0 逐渐增大）
  arrowWater(ghostR, curR, zG, yG, "#b5793c");           // 船漂移 s船：原右端 → 当前右端，向左从 0 生长
  arrowWater(ghostL, ghostL+sP, zG, yG, "#3ee08a");      // 人对地位移 s人：原左端 → 当前位置，向右从 0 生长
}
function arrowWater(x1,x2,z,y,color){
  const a=proj(x1,y,z), b=proj(x2,y,z);
  if(Math.hypot(b.x-a.x,b.y-a.y)<2) return;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=3.2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  const ang=Math.atan2(b.y-a.y,b.x-a.x), s=8;
  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x-s*Math.cos(ang-0.45), b.y-s*Math.sin(ang-0.45));
  ctx.lineTo(b.x-s*Math.cos(ang+0.45), b.y-s*Math.sin(ang+0.45));
  ctx.closePath(); ctx.fill();
}

const MODEL = MODELS["m6"];
"use strict";
/* ================= 通用引擎：3D 舞台 + 双区壳 ================= */
const TAU = Math.PI * 2, G = 9.8;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const fmt = (v,d=2)=> isFinite(v)? v.toFixed(d) : "—";
function shade(hex, amt){
  const c = hex.replace("#",""), n = parseInt(c,16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+255*amt),0,255); g=clamp(Math.round(g+255*amt),0,255); b=clamp(Math.round(b+255*amt),0,255);
  return "rgb("+r+","+g+","+b+")";
}

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0,H=0,DPR=Math.min(2, window.devicePixelRatio||1);
const CAM = {yaw:0.55, pitch:0.30};
let CAM0 = {yaw:0.55, pitch:0.30};
let zoom=1, running=true, last=0, spin=0;

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  W = Math.max(320, r.width); H = Math.max(240, r.height);
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
/* 容器尺寸变化即重算：首次布局、侧栏出现滚动条、全屏切换都不会留白 */
if(window.ResizeObserver){
  try{ new ResizeObserver(function(){ resize(); }).observe(cv.parentElement); }catch(e){}
}

function viewScale(){ return Math.min(W*0.17, H*0.23) * zoom * (MODEL.scale||1); }
function viewOrigin(){ return {cx: W*(MODEL.cx!=null?MODEL.cx:0.44), cy: H*(MODEL.cy!=null?MODEL.cy:0.60)}; }

function proj(x,y,z){
  const o = viewOrigin(), s = viewScale();
  const cy = Math.cos(CAM.yaw), sy = Math.sin(CAM.yaw);
  const X = x*cy + z*sy;
  const Z = -x*sy + z*cy;
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const Y = y*cp - Z*sp;
  const D = y*sp + Z*cp;
  return {x:o.cx + X*s, y:o.cy - Y*s, d:D};
}

/* ---------- 基本图元 ---------- */
function sphere(x,y,z,r,color){
  const p = proj(x,y,z), rr = Math.max(5, r*viewScale());
  const lx = p.x - rr*0.40, ly = p.y - rr*0.44;
  const g = ctx.createRadialGradient(lx, ly, rr*0.05, p.x, p.y, rr*1.04);
  g.addColorStop(0.00, "#ffffff");
  g.addColorStop(0.14, shade(color, 0.62));
  g.addColorStop(0.38, shade(color, 0.18));
  g.addColorStop(0.68, color);
  g.addColorStop(0.90, shade(color, -0.42));
  g.addColorStop(1.00, shade(color, -0.66));
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU);
  ctx.fillStyle = g; ctx.fill();

  // 边缘光（右下）
  ctx.save();
  ctx.beginPath(); ctx.arc(p.x, p.y, rr*0.965, -0.25, 1.05);
  ctx.strokeStyle = "rgba(190,225,255,.42)";
  ctx.lineWidth = Math.max(1.2, rr*0.07);
  ctx.stroke();
  ctx.restore();

  // 环境遮蔽（底部暗）
  ctx.save();
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.clip();
  const ag = ctx.createRadialGradient(p.x, p.y+rr*0.62, rr*0.08, p.x, p.y+rr*0.62, rr*1.02);
  ag.addColorStop(0, "rgba(0,0,0,.38)"); ag.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = ag; ctx.fillRect(p.x-rr, p.y-rr, rr*2, rr*2);
  ctx.restore();

  // 锐利高光
  const sx = p.x - rr*0.37, sy = p.y - rr*0.43;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rr*0.26);
  sg.addColorStop(0, "rgba(255,255,255,.98)");
  sg.addColorStop(0.35, "rgba(255,255,255,.55)");
  sg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, rr*0.26, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.beginPath(); ctx.ellipse(sx, sy, rr*0.075, rr*0.052, -0.6, 0, TAU); ctx.fill();

  // 轮廓线，保证边缘清晰
  ctx.strokeStyle = "rgba(6,12,24,.50)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, TAU); ctx.stroke();
}

function contactShadow(x,y,z,r){
  const p = proj(x,y,z), rr = Math.max(5, r*viewScale());
  const g = ctx.createRadialGradient(p.x, p.y, rr*0.08, p.x, p.y, rr*1.45);
  g.addColorStop(0, "rgba(0,0,0,.55)");
  g.addColorStop(0.55, "rgba(0,0,0,.22)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rr*1.45, rr*0.44, 0, 0, TAU); ctx.fill();
}

function box3D(cx,cy,cz,w,h,d,color){
  const x0=cx-w/2, x1=cx+w/2, y0=cy-h/2, y1=cy+h/2, z0=cz-d/2, z1=cz+d/2;
  const V = [
    [x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],
    [x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]
  ].map(v=>proj(v[0],v[1],v[2]));
  const faces = [
    {i:[0,1,2,3], k:0.00},
    {i:[4,5,6,7], k:0.10},
    {i:[0,1,5,4], k:-0.18},
    {i:[3,2,6,7], k:0.22},
    {i:[0,3,7,4], k:-0.10},
    {i:[1,2,6,5], k:-0.05}
  ].map(f=>({...f, d:(V[f.i[0]].d+V[f.i[1]].d+V[f.i[2]].d+V[f.i[3]].d)/4}))
   .sort((a,b)=>a.d-b.d);
  for(const f of faces){
    ctx.fillStyle = shade(color, f.k);
    ctx.strokeStyle = "rgba(10,18,32,.45)"; ctx.lineWidth = 1;
    ctx.beginPath();
    f.i.forEach((idx,j)=> j? ctx.lineTo(V[idx].x,V[idx].y) : ctx.moveTo(V[idx].x,V[idx].y));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function line3D(a,b,color,w,dash){
  const p=proj(a[0],a[1],a[2]), q=proj(b[0],b[1],b[2]);
  ctx.strokeStyle=color; ctx.lineWidth=w||1.5;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  if(dash) ctx.setLineDash([]);
}

function arrow3D(a,b,color,w,label){
  const p=proj(a[0],a[1],a[2]), q=proj(b[0],b[1],b[2]);
  const ang=Math.atan2(q.y-p.y, q.x-p.x);
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w||3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  const L=12;
  ctx.beginPath(); ctx.moveTo(q.x,q.y);
  ctx.lineTo(q.x-L*Math.cos(ang-0.42), q.y-L*Math.sin(ang-0.42));
  ctx.lineTo(q.x-L*Math.cos(ang+0.42), q.y-L*Math.sin(ang+0.42));
  ctx.closePath(); ctx.fill();
  if(label){ ctx.fillStyle=color; ctx.font="bold 14px sans-serif"; ctx.textAlign="left";
    ctx.fillText(label, q.x+8, q.y+4); }
}

function spring3D(a,b,coils,amp,color,lw){
  const p=proj(a[0],a[1],a[2]), q=proj(b[0],b[1],b[2]);
  const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len, px=-uy, py=ux;
  const n=Math.max(70, coils*22), W=lw||2.4;
  ctx.lineJoin="round"; ctx.lineCap="round";
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n, off=amp*Math.sin(TAU*coils*t);
    pts.push([p.x+dx*t+px*off, p.y+dy*t+py*off]);
  }
  // 先描一层深色底（增加金属棒的"体"），再叠亮色主股 —— 只有一根弹簧
  ctx.strokeStyle="rgba(6,12,24,.55)"; ctx.lineWidth=W+2.2;
  ctx.beginPath(); pts.forEach((v,i)=> i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1])); ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=W;
  ctx.beginPath(); pts.forEach((v,i)=> i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1])); ctx.stroke();
}

/* 凸包（Andrew monotone chain），用于旋转体侧影填充 */
function convexHull(pts){
  const p = pts.slice().sort((a,b)=> (a.x-b.x) || (a.y-b.y));
  if(p.length < 3) return p;
  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[];
  for(const q of p){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  const up=[];
  for(let i=p.length-1;i>=0;i--){ const q=p[i]; while(up.length>=2 && cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}

/* 子弹：绕 x 轴的「圆柱弹体 + 圆锥弹头」，金属质感，弹头指向 +x
   cx,cy,cz 子弹几何中心；r 半径；Lb 圆柱长；Lc 圆锥长（指向 +x）；pal 金属基色 */
function bullet3D(cx,cy,cz,r,Lb,Lc,pal){
  const xB=cx-Lb/2, xF=cx+Lb/2, xT=xF+Lc;
  const NS=20, NA=18, pts=[];
  for(let i=0;i<=NS;i++){ const x=xB+(xF-xB)*i/NS;
    for(let k=0;k<NA;k++){ const a=TAU*k/NA; pts.push(proj(x, cy+r*Math.cos(a), cz+r*Math.sin(a))); } }
  for(let i=0;i<=NS;i++){ const t=i/NS, x=xF+(xT-xF)*t, rr=r*(1-t);
    for(let k=0;k<NA;k++){ const a=TAU*k/NA; pts.push(proj(x, cy+rr*Math.cos(a), cz+rr*Math.sin(a))); } }
  for(let k=0;k<NA;k++){ const a=TAU*k/NA; pts.push(proj(xB, cy+r*Math.cos(a), cz+r*Math.sin(a))); }
  const poly=convexHull(pts);
  if(poly.length<3) return;
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const q of poly){ if(q.x<minx)minx=q.x; if(q.x>maxx)maxx=q.x; if(q.y<miny)miny=q.y; if(q.y>maxy)maxy=q.y; }
  const pB=proj(xB,cy,cz), pT=proj(xT,cy,cz);
  const ax=Math.atan2(pT.y-pB.y, pT.x-pB.x);
  const ppx=Math.cos(ax+Math.PI/2), ppy=Math.sin(ax+Math.PI/2);
  const mx=(minx+maxx)/2, my=(miny+maxy)/2;
  let dm=0; for(const q of poly){ const d=(q.x-mx)*ppx+(q.y-my)*ppy; if(Math.abs(d)>dm)dm=Math.abs(d); }
  dm=Math.max(dm,2);
  // 主体：沿「垂直轴」方向做暗-亮-暗渐变，模拟圆柱金属曲面
  const g=ctx.createLinearGradient(mx-ppx*dm, my-ppy*dm, mx+ppx*dm, my+ppy*dm);
  g.addColorStop(0.00, shade(pal,-0.60));
  g.addColorStop(0.20, shade(pal,-0.16));
  g.addColorStop(0.40, shade(pal, 0.50));
  g.addColorStop(0.50, shade(pal, 0.80));
  g.addColorStop(0.60, shade(pal, 0.34));
  g.addColorStop(0.82, shade(pal,-0.24));
  g.addColorStop(1.00, shade(pal,-0.62));
  ctx.beginPath(); poly.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="rgba(8,14,26,.55)"; ctx.lineWidth=1; ctx.stroke();
  // 锥柱分界线（投影椭圆，淡）
  const fe=proj(xF,cy,cz), fr=Math.max(2, r*viewScale()*0.7);
  ctx.strokeStyle="rgba(8,14,26,.28)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(fe.x,fe.y, fr*0.34, fr, ax, 0, TAU); ctx.stroke();
  // 镜面高光条（沿弹体上缘）
  const h1=proj(cx-Lb*0.42, cy+r*0.40, cz), h2=proj(cx+Lb*0.40, cy+r*0.40, cz);
  const sg=ctx.createLinearGradient(h1.x,h1.y,h2.x,h2.y);
  sg.addColorStop(0,"rgba(255,255,255,0)"); sg.addColorStop(0.5,"rgba(255,255,255,.80)"); sg.addColorStop(1,"rgba(255,255,255,0)");
  ctx.strokeStyle=sg; ctx.lineCap="round"; ctx.lineWidth=Math.max(1.4, r*viewScale()*0.42);
  ctx.beginPath(); ctx.moveTo(h1.x,h1.y); ctx.lineTo(h2.x,h2.y); ctx.stroke();
  // 弹头尖端高光点
  const tip=proj(xT,cy,cz);
  ctx.fillStyle="rgba(255,255,255,.92)"; ctx.beginPath(); ctx.arc(tip.x,tip.y,1.6,0,TAU); ctx.fill();
}

function grid3D(){
  const ext = 4.6, zf = 5.0, zb = -6.0;
  const p1 = proj(-ext,0,zb), p2 = proj(ext,0,zb), p3 = proj(ext,0,zf), p4 = proj(-ext,0,zf);
  // 地面实体
  const fg = ctx.createLinearGradient(p1.x,p1.y,p4.x,p4.y);
  fg.addColorStop(0.00, "#12233d");
  fg.addColorStop(0.45, "#0d1a2e");
  fg.addColorStop(1.00, "#070d19");
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath(); ctx.fill();

  // 中央光池
  const c = proj(0,0,0);
  const rg = ctx.createRadialGradient(c.x,c.y,10,c.x,c.y,Math.max(W,H)*0.42);
  rg.addColorStop(0,"rgba(90,160,240,.12)");
  rg.addColorStop(0.5,"rgba(70,130,210,.05)");
  rg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath(); ctx.fill();

  // 网格（远处淡）
  for(let gx=-ext; gx<=ext+1e-6; gx+=0.4){
    const major = Math.abs(gx-Math.round(gx))<1e-6;
    const al = (0.05 + 0.20*Math.max(0,1-Math.abs(gx)/ext)) * (major?1.8:1);
    ctx.strokeStyle = "rgba(96,170,255,"+al.toFixed(3)+")";
    ctx.lineWidth = major?1.2:0.8;
    const a1=proj(gx,0,zb), a2=proj(gx,0,zf);
    ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.lineTo(a2.x,a2.y); ctx.stroke();
  }
  for(let gz=zb; gz<=zf+1e-6; gz+=0.4){
    const major = Math.abs(gz-Math.round(gz))<1e-6;
    const al = (0.05 + 0.18*Math.max(0,1-Math.abs(gz)/6.0)) * (major?1.8:1);
    ctx.strokeStyle = "rgba(96,170,255,"+al.toFixed(3)+")";
    ctx.lineWidth = major?1.2:0.8;
    const a1=proj(-ext,0,gz), a2=proj(ext,0,gz);
    ctx.beginPath(); ctx.moveTo(a1.x,a1.y); ctx.lineTo(a2.x,a2.y); ctx.stroke();
  }

  // 地平线雾化
  const hy = Math.max(p1.y,p2.y);
  const fog = ctx.createLinearGradient(0,hy-10,0,hy+230);
  fog.addColorStop(0,"rgba(6,11,22,.92)"); fog.addColorStop(0.55,"rgba(6,11,22,.45)"); fog.addColorStop(1,"rgba(6,11,22,0)");
  ctx.fillStyle=fog; ctx.fillRect(0,hy-10,W,250);
  // 地平线
  ctx.strokeStyle = "rgba(90,190,255,.30)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
}

function drawLegend(){
  const rows = MODEL.legend || [];
  if(!rows.length) return;
  const x=18, y=56, w=262, h=rows.length*18+14;
  ctx.fillStyle="rgba(8,14,28,.62)";
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x-10,y-17,w,h,8) : ctx.rect(x-10,y-17,w,h);
  ctx.fill();
  ctx.textAlign="left";
  rows.forEach((r,i)=>{
    const yy=y+i*18;
    ctx.fillStyle=r[0]; ctx.beginPath(); ctx.arc(x+3,yy-4,3.5,0,TAU); ctx.fill();
    ctx.fillStyle="#9fb4d4"; ctx.font="12px sans-serif"; ctx.fillText(r[1], x+13, yy);
  });
}

function bg(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#0b1730");
  g.addColorStop(0.55, "#080f1e");
  g.addColorStop(1, "#05080f");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const vg = ctx.createRadialGradient(W*0.45,H*0.42,Math.min(W,H)*0.15, W*0.45,H*0.42,Math.max(W,H)*0.78);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}

/* ---------- 视角交互 ---------- */
const pointers = new Map();
let dragStart=null, pinchStart=null;
cv.style.cursor="grab";
function pDist(){
  const a=[...pointers.values()];
  if(a.length<2) return 1;
  return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)||1;
}
function onDown(e){
  e.preventDefault();
  if(cv.setPointerCapture){ try{cv.setPointerCapture(e.pointerId);}catch(err){} }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ dragStart={x:e.clientX,y:e.clientY,yaw:CAM.yaw,pitch:CAM.pitch}; cv.style.cursor="grabbing"; }
  else if(pointers.size===2){ pinchStart={dist:pDist(),zoom:zoom}; dragStart=null; }
}
function onMove(e){
  if(!pointers.has(e.pointerId)) return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1 && dragStart){
    CAM.yaw = clamp(dragStart.yaw + (e.clientX-dragStart.x)*0.006, -1.60, 1.60);
    CAM.pitch = clamp(dragStart.pitch + (e.clientY-dragStart.y)*0.004, -0.15, 0.90);
  } else if(pointers.size===2 && pinchStart){
    zoom = clamp(pinchStart.zoom * (pDist()/pinchStart.dist), 0.55, 1.9);
  }
}
function onUp(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0){ dragStart=null; pinchStart=null; cv.style.cursor="grab"; }
  else if(pointers.size===1){
    const p=[...pointers.values()][0];
    dragStart={x:p.x,y:p.y,yaw:CAM.yaw,pitch:CAM.pitch}; pinchStart=null;
  }
}
cv.addEventListener("pointerdown",onDown);
cv.addEventListener("pointermove",onMove);
cv.addEventListener("pointerup",onUp);
cv.addEventListener("pointercancel",onUp);
cv.addEventListener("dblclick",()=>{ CAM.yaw=CAM0.yaw; CAM.pitch=CAM0.pitch; zoom=1; });
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- 全屏 / 页签 ---------- */
function toggleFS(){
  if(!document.fullscreenElement){
    const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req) req.call(el);
  } else {
    const ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(ex) ex.call(document);
  }
}
const fsBtn=document.getElementById("fsBtn");
if(fsBtn){
  fsBtn.onclick=toggleFS;
  document.addEventListener("fullscreenchange",()=>{
    fsBtn.textContent = document.fullscreenElement ? "⛶ 退出全屏" : "⛶ 全屏";
    setTimeout(()=>resize(),80);
  });
  window.addEventListener("keydown",e=>{
    const t=e.target&&e.target.tagName;
    if((e.key==="f"||e.key==="F") && t!=="INPUT" && t!=="SELECT" && t!=="TEXTAREA") toggleFS();
    if(e.key===" " && t!=="INPUT"){ e.preventDefault(); running=!running; const b=document.getElementById("btnPlay"); if(b) b.textContent=running?"⏸ 暂停":"▶ 继续"; }
  });
}
function showTab(id){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.tab===id));
  document.getElementById("p1").style.display = id==="p1"?"flex":"none";
  const p2=document.getElementById("p2");
  p2.classList.toggle("on", id==="p2");
  if(id==="p1") resize();
}
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{ showTab(t.dataset.tab); history.replaceState(null,"","#"+t.dataset.tab); };
});

/* ---------- DOM 构建 ---------- */
function buildUI(){
  document.getElementById("mTitle").textContent = MODEL.name;
  document.getElementById("mSub").textContent = MODEL.sub || "";
  CAM0 = {yaw:(MODEL.cam&&MODEL.cam.yaw!=null)?MODEL.cam.yaw:0.55,
          pitch:(MODEL.cam&&MODEL.cam.pitch!=null)?MODEL.cam.pitch:0.30};
  CAM.yaw=CAM0.yaw; CAM.pitch=CAM0.pitch;

  const side = document.getElementById("side");
  side.innerHTML =
    '<div class="khd">知识归纳</div>' + (MODEL.knowledge||"") +
    '<div class="rocard"><div class="rohd">实时读数</div><div class="rogrid" id="ro"></div></div>';

  const ctrl = document.getElementById("ctrl");
  const ps = (MODEL.params||[]).map(p=>
    '<div class="grp"><label>'+p.label+'</label>'+
    '<input type="range" id="rg_'+p.key+'" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+p.value+'">'+
    '<span class="val" id="vv_'+p.key+'">'+p.value+(p.unit||"")+'</span></div>').join("");
  ctrl.innerHTML = ps +
    '<button class="btn ok" id="btnPlay">⏸ 暂停</button>'+
    '<button class="btn warn" id="btnReset">↺ 重置</button>';
  (MODEL.params||[]).forEach(p=>{
    const el=document.getElementById("rg_"+p.key);
    el.addEventListener("input",()=>{
      const v=parseFloat(el.value);
      document.getElementById("vv_"+p.key).textContent = fmt(v, p.dec==null?1:p.dec)+(p.unit||"");
      MODEL.onParam && MODEL.onParam(p.key, v);
    });
  });
  document.getElementById("btnPlay").onclick=function(){
    running=!running; this.textContent = running?"⏸ 暂停":"▶ 继续";
  };
  document.getElementById("btnReset").onclick=()=>{ MODEL.reset(); };

  document.getElementById("p2").innerHTML = MODEL.examples || "";
  document.getElementById("pNote");
}

let roCache = null;
function updateReadout(){
  const ro=document.getElementById("ro");
  if(!ro || !MODEL.readout) return;
  const data = MODEL.readout();
  if(!roCache || roCache.n !== data.length){
    ro.innerHTML = data.map(function(r){
      const hot = /动量/.test(String(r[0]));
      return '<div class="mrow'+(hot?' hot':'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';
    }).join("");
    roCache = {n:data.length, nodes:[].slice.call(ro.children)};
  }
  for(let i=0;i<data.length;i++){
    const el = roCache.nodes[i]; if(!el) continue;
    const b = el.lastElementChild;
    if(b && b.textContent !== data[i][1]) b.textContent = data[i][1];
  }
}

/* ---------- 主循环 ---------- */

function drawPhase(){
  if(!MODEL.phase) return;
  ctx.fillStyle="rgba(54,224,224,.95)"; ctx.font="bold 15px sans-serif"; ctx.textAlign="center";
  ctx.fillText(MODEL.phase(), W/2, 30);
}

function drawBars(){
  if(!MODEL.bars) return;
  const arr=MODEL.bars(); if(!arr||!arr.length) return;
  const w=272, h=arr.length*36+16, x=W-w-16, y=H-h-16;
  ctx.fillStyle="rgba(8,14,28,.78)"; ctx.strokeStyle="rgba(54,224,224,.22)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke();
  arr.forEach(function(b,i){
    const yy=y+22+i*36;
    ctx.textAlign="left"; ctx.font="12px sans-serif"; ctx.fillStyle="#8fa6c8";
    ctx.fillText(b.label, x+10, yy);
    ctx.textAlign="right"; ctx.fillStyle=b.color; ctx.fillText(b.text||fmt(b.value), x+w-10, yy);
    const bx=x+10, by=yy+7, bw=w-20;
    ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fillRect(bx,by,bw,7);
    ctx.fillStyle=b.color; ctx.fillRect(bx,by,bw*clamp(b.value/(b.max||1),0,1),7);
  });
}

/* ---------- v–t 图像（速度变化特征） ---------- */
function drawVT(){
  if(!MODEL.vt || !MODEL.hist) return;
  const hist = MODEL.hist(); if(!hist || !hist.length) return;
  const w = 372, h = 206, x = 16, y = H - h - 16;
  const gx = x + 46, gw = w - 66, gy0 = y + 40, gy1 = y + h - 34, gh = gy1 - gy0;

  let vmax = 0.4, vmin = 0, t0 = hist[0].t, t1 = hist[hist.length-1].t;
  hist.forEach(function(p){ MODEL.traces.forEach(function(tr){
    const v = p.v[tr.idx] || 0;
    vmax = Math.max(vmax, v); vmin = Math.min(vmin, v); }); });
  const hasNeg = vmin < -0.05;
  const vTop = Math.ceil(vmax * 1.15 * 2) / 2;
  const vBot = hasNeg ? -vTop : 0;
  const spanMin = MODEL.vtSpan ? MODEL.vtSpan * 0.55 : 0;   // 数据不足时按最小窗绘，不拉平
  const span = Math.max(1e-4, t1 - t0, spanMin);
  const X = t => gx + (t - t0) / span * gw;
  const Y = v => gy0 + (vTop - v) / (vTop - vBot) * gh;

  // 面板
  ctx.fillStyle = "rgba(8,14,28,.82)"; ctx.strokeStyle = "rgba(54,224,224,.24)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#9fb4d4"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("v–t 图像（m/s）", x + 12, y + 19);

  // 网格 + y 刻度
  ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
  const ticks = hasNeg ? [vTop, vTop/2, 0, -vTop/2, -vTop] : [vTop, vTop/2, 0];
  ticks.forEach(function(v){
    const yy = Y(v);
    ctx.strokeStyle = Math.abs(v) < 1e-9 ? "rgba(150,190,240,.55)" : "rgba(96,150,220,.18)";
    ctx.lineWidth = Math.abs(v) < 1e-9 ? 1.2 : 1;
    if(Math.abs(v) < 1e-9) ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(gx, yy); ctx.lineTo(gx + gw, yy); ctx.stroke();
    if(Math.abs(v) < 1e-9) ctx.setLineDash([]);
    ctx.fillStyle = Math.abs(v) < 1e-9 ? "#8fa6c8" : "#5b7099";
    ctx.fillText(Math.abs(v) < 1e-9 ? "0" : (v > 0 ? "" : "−") + Math.abs(v).toFixed(1), gx - 8, yy + 3.5);
  });
  // x 刻度
  ctx.textAlign = "center"; ctx.fillStyle = "#5b7099";
  ctx.fillText("t/s", gx + gw, gy1 + 16);
  ctx.textAlign = "left";
  ctx.fillText(t0.toFixed(2), gx, gy1 + 16);
  ctx.textAlign = "right";
  ctx.fillText(t1.toFixed(2), gx + gw - 24, gy1 + 16);

  // 零点参考（共速线）
  ctx.save();
  ctx.beginPath(); ctx.rect(gx, gy0, gw, gh); ctx.clip();

  // 共速点：两曲线交点
  const cross = [];
  const EPS = 1e-6;
  let lastC = -1e9;
  for(let i = 1; i < hist.length; i++){
    const a = hist[i-1].v[0] - hist[i-1].v[1], b = hist[i].v[0] - hist[i].v[1];
    // 只在「符号翻转」或「由正变零」时记一次共速，且 0.08T 内不重复（否则共速后每帧都判成共速）
    const hit = (a * b < 0) || (a > EPS && Math.abs(b) < EPS) || (a < -EPS && Math.abs(b) < EPS);
    if(!hit) continue;
    const r = (Math.abs(a) + Math.abs(b)) > 0 ? Math.abs(a) / (Math.abs(a) + Math.abs(b)) : 0.5;
    const tt = hist[i-1].t + (hist[i].t - hist[i-1].t) * r;
    if(tt - lastC < Math.max(0.05, (t1 - t0) * 0.08)) continue;
    lastC = tt;
    const vv = hist[i-1].v[0] + (hist[i].v[0] - hist[i-1].v[0]) * r;
    cross.push({t: tt, v: vv});
  }
  cross.forEach(function(c){
    ctx.strokeStyle = "rgba(255,210,77,.30)"; ctx.lineWidth = 1;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(X(c.t), gy0); ctx.lineTo(X(c.t), gy1); ctx.stroke();
    ctx.setLineDash([]);
  });

  // 曲线
  if(hist.length >= 3) MODEL.traces.forEach(function(tr){
    if(tr.dash) ctx.setLineDash(tr.dash); else ctx.setLineDash([]);
    ctx.strokeStyle = tr.color; ctx.lineWidth = tr.w || 2.4; ctx.lineJoin = "round";
    ctx.beginPath();
    hist.forEach(function(p, i){
      const px = X(p.t), py = Y(p.v[tr.idx] || 0);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.restore();

  // 共速圆点
  cross.forEach(function(c){
    ctx.fillStyle = "rgba(255,210,77,.95)";
    ctx.beginPath(); ctx.arc(X(c.t), Y(c.v), 3.6, 0, TAU); ctx.fill();
  });

  // 当前点
  const lastP = hist[hist.length-1];
  MODEL.traces.forEach(function(tr){
    const px = X(lastP.t), py = Y(lastP.v[tr.idx] || 0);
    ctx.fillStyle = tr.color;
    ctx.beginPath(); ctx.arc(px, py, 4.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(8,14,28,.9)"; ctx.lineWidth = 1.2; ctx.stroke();
  });

  // 图例
  ctx.textAlign = "left"; ctx.font = "11px sans-serif";
  MODEL.traces.forEach(function(tr, i){
    const lx = x + w - 96, ly = y + 15 + i * 13;
    ctx.fillStyle = tr.color;
    ctx.fillRect(lx, ly - 6, 12, 3);
    ctx.fillStyle = "#9fb4d4";
    ctx.fillText(tr.name, lx + 16, ly);
  });
  if(cross.length){
    ctx.fillStyle = "rgba(255,210,77,.9)"; ctx.font = "10.5px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(MODEL.vtCrossLabel || "● 共速（Eₚ 最大）", x + 12, y + h - 9);
  }
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000||0); last=now;
  if(running && MODEL.step) MODEL.step(dt);
  spin += dt*1.5;
  bg();
  grid3D();
  if(MODEL.draw) MODEL.draw(ctx);
  drawLegend();
  drawPhase();
  drawBars();
  drawVT();
  updateReadout();
  requestAnimationFrame(frame);
}

resize();
buildUI();
resize();          // UI 建好后再对齐一次，避免画布比容器窄
MODEL.reset && MODEL.reset();
requestAnimationFrame(t=>{ last=t; frame(t); });

</script>
</body>
