<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>力的动态平衡 · 五类模型图解</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei",system-ui,"Segoe UI",sans-serif;background:#070d18;color:#e6eefc;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100vw}
#stage{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;
 background:radial-gradient(125% 95% at 46% 0%,#14283f 0%,#0a1526 46%,#05090f 100%)}
#cv{display:block;width:100%;height:100%}
#stitle{position:absolute;left:20px;top:14px;pointer-events:none;z-index:3}
#stitle b{display:block;font-size:16px;font-weight:800;letter-spacing:1.4px;color:#dcebff;text-shadow:0 0 18px rgba(64,150,255,.65)}
#stitle i{display:block;font-style:normal;font-size:11.5px;color:#8aa6c8;margin-top:4px;letter-spacing:.6px}
#side{width:414px;flex:0 0 414px;height:100vh;overflow-y:auto;padding:12px 12px 30px;
 background:linear-gradient(180deg,#0d1728,#0a1220);border-left:1px solid rgba(96,152,224,.16)}
#side::-webkit-scrollbar{width:8px}
#side::-webkit-scrollbar-thumb{background:#1d3352;border-radius:4px}
.card{background:linear-gradient(180deg,rgba(32,58,98,.42),rgba(16,30,52,.42));
 border:1px solid rgba(96,152,224,.20);border-radius:12px;padding:11px 12px;margin-bottom:11px;
 box-shadow:0 4px 20px rgba(0,0,0,.30)}
.card h3{margin:0 0 9px;font-size:13.5px;color:#cfe3ff;letter-spacing:.6px;display:flex;align-items:center;gap:7px;font-weight:800}
.card h3::before{content:"";width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#38a3ff,#2ee6a8);box-shadow:0 0 9px rgba(56,163,255,.75)}
.tabrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:11px}
.tabrow button{padding:9px 6px;font-size:12.5px;line-height:1.3}
button{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid rgba(120,180,255,.28);
 border-radius:9px;padding:8px 12px;cursor:pointer;color:#dff0ff;transition:.16s;
 background:linear-gradient(135deg,rgba(46,120,215,.40),rgba(28,76,152,.40))}
button:hover{filter:brightness(1.22)}
button.on{background:linear-gradient(135deg,#2f8ef0,#1f6ad0);border-color:rgba(160,215,255,.65);box-shadow:0 0 15px rgba(56,150,255,.55)}
button.ghost{background:rgba(255,255,255,.045);color:#a9c2e0;border-color:rgba(120,170,220,.20)}
button.ghost.on{background:linear-gradient(135deg,#17a877,#0e8b60);color:#eafff7;border-color:rgba(120,255,210,.42)}
.btns{display:flex;flex-wrap:wrap;gap:7px}
.row{display:flex;align-items:center;gap:9px;margin:9px 0}
.row label{flex:0 0 124px;font-size:12.5px;color:#a8bfdb;line-height:1.35}
.row input[type=range]{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
 background:linear-gradient(90deg,#2f8ef0,#17a877);outline:none}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
 background:#eaf5ff;border:2px solid #2f8ef0;cursor:pointer;box-shadow:0 0 9px rgba(70,160,255,.85)}
.row .val{flex:0 0 60px;text-align:right;font-size:12.5px;font-weight:800;color:#7fc4ff;font-variant-numeric:tabular-nums}
.know p{margin:6px 0;font-size:12.6px;line-height:1.66;color:#b7cce4}
.know b{color:#6fc0ff}
.fml{font-family:"Consolas","Courier New",monospace;font-size:12.4px;color:#a8e8d0;background:rgba(16,44,44,.42);
 border-left:3px solid #17c58c;padding:6px 9px;border-radius:5px;margin:7px 0;display:block;line-height:1.6}
.warn{color:#ffb454}
#verdict{font-size:13px;font-weight:800;line-height:1.5;padding:9px 11px;border-radius:9px;margin-bottom:9px;
 background:linear-gradient(135deg,rgba(40,90,160,.42),rgba(20,70,60,.42));border:1px solid rgba(96,170,240,.30);color:#cfe8ff}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed rgba(120,170,220,.16)}
.kv .k{color:#93aac8}.kv .v{font-weight:800;color:#8fd6ff;font-variant-numeric:tabular-nums}
.hint{font-size:11.4px;color:#7f95b2;margin-top:8px;line-height:1.55}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="stitle"><b id="ttl">力的动态平衡</b><i id="sub">五类模型 · 矢量三角形图解</i></div>
  </div>
  <div id="side"></div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
var S={model:0,playing:true,auto:true,t:0};
var PV=[{th:34},{al:32,Hf:1.6},{phi:0,gam:120},{yA:3.6,yB:3.6,d:3.8,L:5.0,F:0,G:10},{th:30,bt:0}];
var OUT={};
var COL={g:'#ffc552', f:'#4fd8ff', t:'#ff6fb0', n:'#5ce6a8', dim:'rgba(150,185,225,.55)'};

/* ============ 基础工具 ============ */
function resize(){
  var r=cv.parentNode.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(260,Math.round(r.width)); H=Math.max(240,Math.round(r.height));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function arrow(x1,y1,x2,y2,col,w,head){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  if(L<2)return;
  var a=Math.atan2(dy,dx);
  head=head||Math.min(15,Math.max(9,w*3.6));
  ctx.save();ctx.shadowColor=col;ctx.shadowBlur=9;
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*head*0.8,y2-Math.sin(a)*head*0.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-0.40)*head,y2-Math.sin(a-0.40)*head);
  ctx.lineTo(x2-Math.cos(a+0.40)*head,y2-Math.sin(a+0.40)*head);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function seg(x1,y1,x2,y2,col,w,blur){
  ctx.save();if(blur){ctx.shadowColor=col;ctx.shadowBlur=blur;}
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function dash(x1,y1,x2,y2,col,w,d){
  ctx.save();ctx.setLineDash(d||[7,6]);ctx.strokeStyle=col;ctx.lineWidth=w||1.3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function txt(s,x,y,col,size,align,bold){
  ctx.save();ctx.fillStyle=col;
  ctx.font=(bold?'800 ':'600 ')+(size||13)+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=4;
  ctx.fillText(s,x,y);ctx.restore();
}
function dot(x,y,r,col){
  ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
}
function rust(x1,y1,x2,y2,step){
  step=step||12;var a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);
  var nx=Math.sin(a),ny=-Math.cos(a);
  ctx.save();ctx.strokeStyle='rgba(150,185,225,.34)';ctx.lineWidth=1.3;
  for(var s=0;s<L-4;s+=step){
    var px=x1+Math.cos(a)*s,py=y1+Math.sin(a)*s;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+nx*step*0.9+Math.cos(a)*step*0.9,py+ny*step*0.9+Math.sin(a)*step*0.9);ctx.stroke();
  }
  ctx.restore();
}
function angArc(cx,cy,rad,a0,a1,col,w,ccw){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w||2;
  ctx.beginPath();ctx.arc(cx,cy,rad,a0,a1,!!ccw);ctx.stroke();ctx.restore();
}
function gl(x1,y1,x2,y2,col,w,blur){seg(x1,y1,x2,y2,col,w,blur);}

/* 立体铜色金属球（3D 高光 + 金属反光 + 暗铜轮廓） */
function ball3D(cx,cy,r){
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);
  var g=ctx.createRadialGradient(cx-r*0.36,cy-r*0.40,r*0.03,cx+r*0.06,cy+r*0.08,r*1.08);
  g.addColorStop(0,'#fffaf5');g.addColorStop(0.10,'#ffeada');
  g.addColorStop(0.30,'#f6cba4');g.addColorStop(0.50,'#e9a67a');
  g.addColorStop(0.70,'#d17f57');g.addColorStop(0.88,'#a4552f');
  g.addColorStop(1,'#6b3016');
  ctx.fillStyle=g;ctx.fill();
  ctx.save();ctx.clip();
  var g2=ctx.createRadialGradient(cx,cy,r*0.50,cx,cy,r*1.02);
  g2.addColorStop(0,'rgba(78,30,10,0)');
  g2.addColorStop(0.70,'rgba(84,34,12,0.13)');
  g2.addColorStop(1,'rgba(66,26,8,0.55)');
  ctx.fillStyle=g2;ctx.fillRect(cx-r-2,cy-r-2,2*r+4,2*r+4);
  ctx.beginPath();ctx.arc(cx+r*0.20,cy+r*0.26,r*0.50,0.30,1.95);
  ctx.strokeStyle='rgba(255,205,165,.40)';ctx.lineWidth=r*0.14;ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.ellipse(cx-r*0.33,cy-r*0.38,r*0.28,r*0.19,-0.62,0,7);
  ctx.fillStyle='rgba(255,255,255,.72)';ctx.fill();
  ctx.beginPath();ctx.ellipse(cx-r*0.22,cy-r*0.30,r*0.13,r*0.085,-0.62,0,7);
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);
  ctx.strokeStyle='#5b2911';ctx.lineWidth=Math.max(1.3,r*0.075);ctx.stroke();
  ctx.restore();
}

/* 三角形阴影（斜线填充：标识相似三角形） */
function hatch(pts,fill,line,gap){
  if(!pts||pts.length<3)return;
  ctx.save();
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  ctx.clip();
  var mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  pts.forEach(function(p){
    if(p[0]<mnx)mnx=p[0]; if(p[0]>mxx)mxx=p[0];
    if(p[1]<mny)mny=p[1]; if(p[1]>mxy)mxy=p[1];
  });
  var hgt=mxy-mny, step=gap||9;
  ctx.strokeStyle=line;ctx.lineWidth=1.1;
  for(var d=mnx-hgt;d<mxx+2;d+=step){
    ctx.beginPath();ctx.moveTo(d,mxy+2);ctx.lineTo(d+hgt,mny-2);ctx.stroke();
  }
  ctx.restore();
}

/* ============ 各模型物理计算 ============ */
function calc1(){
  var th=PV[0].th*Math.PI/180,G=1;
  return {th:PV[0].th,G:G,F:G*Math.tan(th),T:G/Math.cos(th)};
}
function calc2(){
  var mg=1,R=1,r=0.20,Hh=PV[1].Hf,al=PV[1].al*Math.PI/180;
  var ax=(R+r)*Math.sin(al), ay=(R+r)*Math.cos(al);
  var Cx=0, Cy=Hh;
  var L=Math.hypot(ax-Cx,ay-Cy);
  return {mg:mg,R:R,r:r,Hh:Hh,al:al,ax:ax,ay:ay,Cx:Cx,Cy:Cy,L:L,FT:mg*L/Hh,FN:mg*(R+r)/Hh};
}
function calc3(){
  var phi=PV[2].phi*Math.PI/180, gam=PV[2].gam*Math.PI/180, G=1;
  function rot(u){var c=Math.cos(phi),s=Math.sin(phi);return [u[0]*c+u[1]*s,-u[0]*s+u[1]*c];}
  var uA0=[-1,0], uB0=[Math.cos(Math.PI-gam),Math.sin(Math.PI-gam)];
  var uA=rot(uA0),uB=rot(uB0);
  var det=uA[0]*uB[1]-uB[0]*uA[1];
  var TA=-uB[0]*G/det, TB=uA[0]*G/det;
  var Rc=G/(2*Math.sin(gam)), ocx=-(G/2)/Math.tan(Math.PI-gam);
  return {phi:PV[2].phi,gam:PV[2].gam,G:G,uA:uA,uB:uB,TA:TA,TB:TB,Rc:Rc,ocx:ocx};
}
function calc4(){return {};}
function calc5(){
  var mg=1, th=PV[4].th*Math.PI/180, bt=PV[4].bt*Math.PI/180;
  var al=Math.PI/2+bt;                          /* 挡板方向角：90°竖直 → 180°水平 */
  var r=0.30, d=al-th;
  var F=mg*Math.sin(th)/Math.sin(d);            /* 挡板对球的弹力 */
  var N=mg*Math.sin(al)/Math.sin(d);            /* 斜面对球的支持力 */
  var s=r*(1+Math.cos(d))/Math.sin(d);          /* 球心沿斜面到顶点的距离 */
  var ex=Math.cos(th),ey=Math.sin(th);          /* 沿斜面向上 */
  var nx=-Math.sin(th),ny=Math.cos(th);         /* 斜面外法线 */
  return {mg:mg,th:th,bt:bt,al:al,F:F,N:N,s:s,r:r,
          ex:ex,ey:ey,nx:nx,ny:ny,cx:s*ex+r*nx,cy:s*ey+r*ny};
}

/* ============ 背景 ============ */
function drawBG(){
  ctx.save();
  ctx.strokeStyle='rgba(88,140,200,.075)';ctx.lineWidth=1;
  for(var x=44;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=44;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  var rg=ctx.createRadialGradient(W*0.42,H*0.44,10,W*0.42,H*0.44,Math.max(W,H)*0.66);
  rg.addColorStop(0,'rgba(48,110,190,.16)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* =====================================================================
   模型 1：动态三角形（一力恒定 + 一力方向不变）
   ===================================================================== */
function draw1(){
  var c=calc1(),Gs=c.G,F=c.F,T=c.T,th=c.th*Math.PI/180;
  var lw=Math.min(W*0.40,412);
  /* ---------- 左：实物图（悬点固定、绳长固定，球随 θ 摆动） ---------- */
  var cx0=18,cx1=lw-16;
  var qx=(cx0+cx1)/2, ceilY=Math.max(80,H*0.14);
  var rl=Math.min(200,Math.max(120,H*0.72-ceilY));
  var bx=qx+rl*Math.sin(th), by=ceilY+rl*Math.cos(th);
  seg(cx0+6,ceilY,cx1-6,ceilY,'rgba(150,185,225,.6)',7);
  rust(cx0+6,ceilY,cx1-6,ceilY);
  gl(bx,by,qx,ceilY,'#ff9fd0',3.2,12);
  angArc(qx,ceilY,46,Math.PI/2,Math.PI/2-th,'rgba(255,180,120,.95)',2.2,true);
  txt('θ',qx+46,ceilY+54,'#ffc98a',15,null,true);
  /* 小球（立体铜色金属质感） */
  ctx.save();ctx.shadowColor='rgba(255,175,115,.55)';ctx.shadowBlur=17;
  ball3D(bx,by,17);ctx.restore();
  txt('O',bx-24,by-22,'#ffd9bd',12,null,true);
  /* 三个力 */
  var Lg=Math.min(86,rl*0.40);
  var ul=Math.hypot(qx-bx,ceilY-by)||1, ux=(qx-bx)/ul, uy=(ceilY-by)/ul;
  arrow(bx,by,bx+ux*Lg*T,by+uy*Lg*T,COL.t,3.4);
  txt('T',bx+ux*Lg*T*0.60-20,by+uy*Lg*T*0.60,COL.t,15,null,true);
  arrow(bx,by,bx+Lg*F,by,COL.f,3.4);
  txt('F',bx+Lg*F*0.55,by-16,COL.f,15,null,true);
  arrow(bx,by,bx,by+Lg,COL.g,3.4);
  txt('G',bx+23,by+Lg*0.72,COL.g,15,null,true);
  txt('实物：绳方向变化，F 恒沿水平',(cx0+cx1)/2,H-26,'#8aa6c8',12);

  /* ---------- 右：矢量三角形 ---------- */
  var rx0=lw+26, rx1=W-26;
  var availW=rx1-rx0, availH=H-150;
  var sp=Math.min(availH*0.66, availW*0.88/1.80);
  var rcx=(rx0+rx1)/2, rcy=H*0.53;
  var P0x=rcx-F*sp/2, P0y=rcy-sp/2;
  var P1x=P0x, P1y=P0y+sp;
  var P2x=P0x+F*sp, P2y=P1y;
  /* T 扫过的扇形残影 */
  var steps=Math.max(1,Math.round(c.th/6));
  for(var i=1;i<steps;i++){
    var thi=i*6*Math.PI/180, Fi=Gs*Math.tan(thi);
    var qx=P1x+Fi*sp, qy=P1y;
    seg(qx,qy,P0x,P0y,'rgba(255,111,176,.20)',1.6);
  }
  /* 三边 */
  arrow(P0x,P0y,P1x,P1y,COL.g,4.2);
  arrow(P1x,P1y,P2x,P2y,COL.f,4.2);
  arrow(P2x,P2y,P0x,P0y,COL.t,4.2);
  /* 直角标记（F ⊥ G） */
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.6;
  ctx.strokeRect(P1x,P1y-14,14,14);ctx.restore();
  dash(P0x,P0y,P0x,P1y,'rgba(255,197,82,.30)',1.2,[5,6]);
  /* 标注 */
  txt('G',P0x-20,P0y+sp*0.5,COL.g,15,null,true);
  txt('F',(P1x+P2x)/2,P1y+18,COL.f,15,null,true);
  txt('T',(P0x+P2x)/2-6,(P0y+P2y)/2-14,COL.t,15,null,true);
  txt('矢量三角形（G 定长、F 定方向）',(rx0+rx1)/2,H-26,'#8aa6c8',12);

  OUT={th:c.th,F:c.F,T:c.T};
}

/* =====================================================================
   模型 2：相似三角形（半球 + 绳）
   ===================================================================== */
function draw2(){
  var c=calc2(),mg=c.mg,R=c.R,r=c.r,Hh=c.Hh;
  var sc=Math.min((W*0.60-30)/2.15,(H-175)/(Hh+0.62));
  var ox=30+R*sc, oy=H-84;
  function X(wx){return ox+wx*sc;}
  function Y(wy){return oy-wy*sc;}
  /* 地面 */
  seg(ox-R*sc-14,oy,ox+R*sc+150,oy,'rgba(150,185,225,.5)',5);
  rust(ox-R*sc-14,oy,ox+R*sc+150,oy);
  /* 半球（很轻的填充，便于力三角叠加在上层） */
  ctx.save();
  var hg=ctx.createLinearGradient(0,oy-R*sc,0,oy);
  hg.addColorStop(0,'rgba(96,170,240,.20)');hg.addColorStop(1,'rgba(40,90,160,.06)');
  ctx.fillStyle=hg;
  ctx.beginPath();ctx.arc(X(0),Y(0),R*sc,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,190,255,.85)';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.arc(X(0),Y(0),R*sc,Math.PI,0);ctx.stroke();
  ctx.restore();
  dot(X(0),Y(0),3.5,'#9fd8ff');
  txt('O',X(0)-15,Y(0)+15,'#9fd8ff',14);
  txt('B',X(0)-15,Y(R),'#9fd8ff',14);
  dash(X(0),Y(0),X(0),Y(R),'rgba(120,190,255,.35)',1.2);
  txt('R',X(0)+54,Y(R*0.42),'#9fd8ff',13);

  /* ---------- 结构三角形 △CAO（阴影标识） ---------- */
  hatch([[X(c.Cx),Y(c.Cy)],[X(c.ax),Y(c.ay)],[X(0),Y(0)]],'rgba(255,197,82,.14)','rgba(255,197,82,.42)',10);
  ctx.save();
  ctx.setLineDash([7,6]);ctx.lineWidth=2.0;
  ctx.strokeStyle='rgba(255,197,82,.85)';
  ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(c.Cx),Y(c.Cy));ctx.stroke();
  ctx.strokeStyle='rgba(255,111,176,.85)';
  ctx.beginPath();ctx.moveTo(X(c.Cx),Y(c.Cy));ctx.lineTo(X(c.ax),Y(c.ay));ctx.stroke();
  ctx.strokeStyle='rgba(92,230,168,.9)';
  ctx.beginPath();ctx.moveTo(X(c.ax),Y(c.ay));ctx.lineTo(X(0),Y(0));ctx.stroke();

  /* ---------- 绳：与滑轮外缘相切（不过滑轮中心） ---------- */

  var q2=[ux*Math.cos(ph)+uy*Math.sin(ph),-ux*Math.sin(ph)+uy*Math.cos(ph)];

  arrow(X(Ex),Y(Cw[1])+70,X(Ex),Y(Cw[1])+112,'#5ce6a8',2.5);
  txt('缓慢拉动',X(Ex)-24,Y(Cw[1])+134,'#5ce6a8',12);
  /* 滑轮 */

  ctx.beginPath();ctx.arc(X(Cw[0]),Y(Cw[1]),rp*sc,0,7);ctx.fill();ctx.stroke();
  ctx.restore();
  dot(X(Cw[0]),Y(Cw[1]),2.2,'#cfe8ff');
  seg(X(Cw[0]),Y(Cw[1])+rp*sc+2,X(Cw[0]),Y(Cw[1])+rp*sc+34,'rgba(150,185,225,.5)',3.4);
  txt('C',X(Cw[0])-19,Y(Cw[1])+3,'#9fd0ff',14);

  var axs=X(c.ax),ays=Y(c.ay),rb=r*sc;

  ball3D(axs,ays,rb);ctx.restore();

  arrow(axs,ays,Amx,Amy,COL.g,3.6);          /* mg  */
  arrow(Amx,Amy,Afx,Afy,COL.t,3.6);          /* F_T */
  arrow(Afx,Afy,axs,ays,COL.n,3.6);          /* F_N */
  txt('mg',axs-27,ays+mg*sF*0.55,COL.g,13,null,true);
  txt('F_T',(Amx+Afx)/2-8,(Amy+Afy)/2+17,COL.t,13,null,true);
  txt('F_N',(Afx+axs)/2+24,(Afy+ays)/2,COL.n,13,null,true);
  dot(axs,ays,3.4,'#ffffff');

  txt('L',(X(c.ax)+X(c.Cx))/2+20,(Y(c.ay)+Y(c.Cy))/2-6,'#ff9fd0',14);
  txt('H',X(0)+17,(Y(c.Cy)+Y(0))/2,'#ffc552',14);
  txt('R+r',(X(0)+X(c.ax))/2-4,(Y(0)+Y(c.ay))/2+18,'#5ce6a8',13);
  /* 相似说明 */
  var ax0=ox+R*sc+20, ax1=W-16, atc=(ax0+ax1)/2;
  txt('力矢量三角形（青）∽ 结构三角形 CAO（黄）',atc,56,'#cfe3ff',13.5,null,true);
  txt('mg ∥ CO      F_T ∥ 绳 CA      F_N ∥ AO',atc,80,'#8aa6c8',12);
  OUT={L:c.L,FT:c.FT,FN:c.FN,al:c.al*180/Math.PI};
}

/* =====================================================================
   模型 3：矢量圆（两绳夹角不变）
   ===================================================================== */
function draw3(){
  var c=calc3(),G=c.G;
  var lw=Math.min(W*0.44,440);
  /* ---------- 左：装置（可旋转） ---------- */
  var sc=Math.min((lw-80)*0.40/1.7,(H-190)*0.36/1.7);
  var ox=lw*0.50, oy=H*0.48;
  function X(wx){return ox+wx*sc;}
  function Y(wy){return oy-wy*sc;}
  var rl=1.55;
  var Ax=c.uA[0]*rl, Ay=c.uA[1]*rl, Bx=c.uB[0]*rl, By=c.uB[1]*rl;
  /* 刚性杆 AB */
  seg(X(Ax),Y(Ay),X(Bx),Y(By),'rgba(150,185,225,.85)',8);
  seg(X(Ax),Y(Ay),X(Bx),Y(By),'rgba(210,232,255,.55)',3);
  rust(X(Ax),Y(Ay),X(Bx),Y(By),16);
  dot(X(Ax),Y(Ay),6,'#8fc8ff');txt('A',X(Ax)+(Ax<0?-22:22),Y(Ay)-16,'#8fc8ff',14);
  dot(X(Bx),Y(By),6,'#8fc8ff');txt('B',X(Bx),Y(By)-16,'#8fc8ff',14);
  /* 绳 */
  gl(X(0),Y(0),X(Ax),Y(Ay),'#ff9fd0',3.2,10);
  gl(X(0),Y(0),X(Bx),Y(By),'#ffb45c',3.2,10);
  /* 灯 */
  var Cx=X(0),Cy=Y(0);
  ctx.save();
  ctx.fillStyle='rgba(255,214,120,.95)';ctx.shadowColor='rgba(255,200,90,.9)';ctx.shadowBlur=18;
  ctx.beginPath();ctx.moveTo(Cx-20,Cy+58);ctx.lineTo(Cx+20,Cy+58);ctx.lineTo(Cx+9,Cy+30);ctx.lineTo(Cx-9,Cy+30);ctx.closePath();ctx.fill();
  ctx.restore();
  seg(Cx,Cy,Cx,Cy+30,'rgba(255,214,120,.85)',3);
  txt('G',Cx-22,Cy+72,'#ffc552',13,null,true);
  dot(Cx,Cy,5,'#fff2c0');
  txt('C',Cx-20,Cy-14,'#ffe8a8',14);
  /* 旋转箭头 */
  var ra0=-Math.PI*0.5+c.phi*Math.PI/180;
  angArc(Cx,Cy,60,ra0-Math.PI*0.55,ra0,'rgba(92,230,168,.85)',2.6);
  txt('装置顺时针旋转 φ='+c.phi.toFixed(0)+'°',Cx,Cy-96,'#5ce6a8',12.5);
  txt('实物：装置转过 90°（两绳夹角始终不变）',lw*0.5,H-26,'#8aa6c8',12);

  /* ---------- 右：矢量圆 ---------- */
  var rx0=lw+26,rx1=W-26,ry0=90,ry1=H-70;
  var sc2=Math.min((rx1-rx0)/1.75,(ry1-ry0)/1.85);
  var cx=(rx0+rx1)/2, cy=ry0+(ry1-ry0)*0.52;
  var cwx=c.ocx, cwy=G/2;   /* 矢量圆圆心 */
  function VX(wx){return cx+(wx-cwx)*sc2;}
  function VY(wy){return cy-(wy-cwy)*sc2;}
  var P=[c.TA*c.uA[0], c.TA*c.uA[1]];
  /* 圆 */
  ctx.save();
  ctx.strokeStyle='rgba(92,230,168,.5)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.arc(VX(cwx),VY(cwy),c.Rc*sc2,0,7);ctx.stroke();
  ctx.restore();
  /* 弧（实线部分，经 P 所在的一侧） */
  var aC=Math.atan2(0-cwy,0-cwx), aCp=Math.atan2(G-cwy,0-cwx);
  ctx.save();ctx.strokeStyle='rgba(92,230,168,.95)';ctx.lineWidth=3.4;
  ctx.beginPath();ctx.arc(VX(cwx),VY(cwy),c.Rc*sc2,aC,aCp,true);ctx.stroke();ctx.restore();
  /* 圆心 */
  dot(VX(cwx),VY(cwy),3.2,'rgba(92,230,168,.9)');
  /* 弦 G */
  arrow(VX(0),VY(0),VX(0),VY(G),COL.g,4);
  txt('G（定弦）',VX(0)-52,VY(G/2),COL.g,13,null,true);
  /* 两力 */
  arrow(VX(0),VY(0),VX(P[0]),VY(P[1]),COL.f,4);
  arrow(VX(P[0]),VY(P[1]),VX(0),VY(G),'#ffb45c',4);
  dot(VX(P[0]),VY(P[1]),5.5,'#ffffff');
  txt('P',VX(P[0])-18,VY(P[1])-16,'#ffffff',14,null,true);
  txt('T_A',VX(P[0]*0.5)+16,VY(P[1]*0.5)+8,COL.f,13,null,true);
  txt('T_B',VX(P[0]*0.5)+18,VY((P[1]+G)/2)-6,'#ffb45c',13,null,true);
  txt('矢量圆：夹角不变，P 沿圆弧滑动',(rx0+rx1)/2,ry0-22,'#cfe3ff',13,null,true);
  txt('圆周角恒定 → P 在圆上',(rx0+rx1)/2,ry1+16,'#8aa6c8',11.5);
  OUT={phi:c.phi,TA:c.TA,TB:c.TB,gam:c.gam};
}

/* =====================================================================
   模型 5：挡板绕斜坡顶点缓慢转至水平（β: 0°→90°）
   ===================================================================== */
function draw5(){
  var c=calc5(),mg=c.mg,th=c.th,al=c.al,bl=0.95;
  var lw=W*0.62;
  var sc=Math.min((lw-90)/2.35,(H-235)/1.25);
  var ox=46+bl*sc, oy=H-176;
  function X(wx){return ox+wx*sc;}
  function Y(wy){return oy-wy*sc;}
  /* 水平地面（过顶点） */
  seg(X(-bl-0.06),Y(0),X(0.52),Y(0),'rgba(150,185,225,.5)',5);
  /* 斜面 */
  var ix=1.30, iy=ix*Math.tan(th);
  seg(X(0),Y(0),X(ix),Y(iy),'rgba(150,185,225,.8)',5);
  angArc(X(0),Y(0),62,-th,0,'rgba(255,180,120,.95)',2.3);
  txt('θ',X(0)+Math.cos(th/2)*82,Y(0)-Math.sin(th/2)*82,'#ffc98a',15,null,true);
  dot(X(0),Y(0),4.5,'#bcd8ff');
  /* 接触点（球与斜面） */
  var tx=X(c.s*c.ex),ty=Y(c.s*c.ey);
  /* 挡板（厚板，绕顶点逆时针转动；板面与球相切） */
  var bwd=13, blen=bl*sc;
  ctx.save();
  ctx.translate(X(0),Y(0));ctx.rotate(-al);
  var bg=ctx.createLinearGradient(0,-bwd,0,0);
  bg.addColorStop(0,'rgba(96,146,205,.42)');bg.addColorStop(.55,'rgba(198,228,255,.94)');bg.addColorStop(1,'rgba(222,240,255,.98)');
  ctx.fillStyle=bg;ctx.strokeStyle='rgba(150,200,255,.8)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.rect(0,-bwd,blen,bwd);ctx.fill();ctx.stroke();
  ctx.restore();
  /* 球心到接触点 */
  var bx=X(c.cx),by=Y(c.cy),rb=c.r*sc;
  dash(bx,by,tx,ty,'rgba(92,230,168,.42)',1.3);
  dot(tx,ty,3,'rgba(92,230,168,.9)');
  /* 挡板转角 β 的顶点轨迹弧 */
  if(c.bt>1.2){
    angArc(X(0),Y(0),blen+14,-Math.PI/2,-al,'rgba(92,230,168,.55)',2.0,true);
    var ea=-al, hx=X(0)+Math.cos(ea)*(blen+14), hy=Y(0)+Math.sin(ea)*(blen+14);
    arrow(hx+Math.sin(al)*11,hy+Math.cos(al)*11,hx,hy,'rgba(92,230,168,.8)',2.2);
    var mid=-(Math.PI/2+al)/2;
    txt('β',X(0)+Math.cos(mid)*(blen+34),Y(0)+Math.sin(mid)*(blen+34),'#5ce6a8',14,null,true);
  }
  /* 球（立体铜色金属球） */
  ctx.save();ctx.shadowColor='rgba(255,175,115,.5)';ctx.shadowBlur=16;
  ball3D(bx,by,rb);ctx.restore();
  txt('m',bx+rb*0.06,by+rb*0.06,'#6d3117',12,null,true);
  /* 三个力（均从球心出发） */
  var sF=Math.min(96,sc*0.44);
  arrow(bx,by,bx+c.nx*sF*c.N,by-c.ny*sF*c.N,COL.n,3.3);          /* N：斜面法线 */
  txt('N',bx+c.nx*sF*c.N-18,by-c.ny*sF*c.N+4,COL.n,13,null,true);
  var fx=Math.sin(al),fy=Math.cos(al);                            /* F：挡板法线 */
  arrow(bx,by,bx+fx*sF*c.F,by+fy*sF*c.F,COL.f,3.3);
  txt('F',bx+fx*sF*c.F+16,by+fy*sF*c.F-6,COL.f,13,null,true);
  arrow(bx,by,bx,by+sF*mg,COL.g,3.3);                             /* mg */
  txt('mg',bx-26,by+sF*mg*0.60,COL.g,13,null,true);
  /* 图例 */
  dot(74,88,6,COL.g);txt('mg 重力 —— 大小、方向都不变',94,88,'#c3d6ee',12.5,'left');
  dot(74,116,6,COL.n);txt('N 斜面支持力 —— 方向不变（恒垂直斜面）',94,116,'#c3d6ee',12.5,'left');
  dot(74,144,6,COL.f);txt('F 挡板弹力 —— 方向随挡板一起转动',94,144,'#c3d6ee',12.5,'left');
  txt('实物受力图：竖直挡板绕斜坡顶点缓慢逆时针转到水平',lw*0.5,H-30,'#8aa6c8',12);

  /* ---------- 右：矢量三角形（mg 定边 · N 定方向） ---------- */
  var rx0=lw+30,rx1=W-30,ry0=H*0.13,ry1=H*0.88;
  var sv=Math.min((rx1-rx0)/1.55,(ry1-ry0)/2.35);
  var px=(rx0+rx1)/2, py=(ry0+ry1)/2;
  var P0x=px, P0y=py-0.5*sv*mg;
  var P1x=P0x, P1y=P0y+sv*mg;
  var nnx=-Math.sin(th), nny=-Math.cos(th);      /* N 的屏幕方向 */
  var P2x=P1x+nnx*sv*c.N, P2y=P1y+nny*sv*c.N;
  dash(P1x,P1y,P1x+nnx*sv*1.42,P1y+nny*sv*1.42,'rgba(92,230,168,.34)',1.4);
  for(var i=1;i<=18;i++){
    var bi=i*5*Math.PI/180, ali=Math.PI/2+bi, dii=ali-th;
    var Ni=mg*Math.sin(ali)/Math.sin(dii);
    seg(P1x+nnx*sv*Ni,P1y+nny*sv*Ni,P0x,P0y,'rgba(79,216,255,.15)',1.5);
  }
  arrow(P0x,P0y,P1x,P1y,COL.g,4.2);
  arrow(P1x,P1y,P2x,P2y,COL.n,4.2);
  arrow(P2x,P2y,P0x,P0y,COL.f,4.2);
  txt('mg',P0x-24,P0y+sv*mg*0.5,COL.g,14,null,true);
  txt('N',(P1x+P2x)/2-18,(P1y+P2y)/2,COL.n,14,null,true);
  txt('F',(P0x+P2x)/2+18,(P0y+P2y)/2,COL.f,14,null,true);
  txt('矢量三角形：mg 定边 · N 定方向 · F 端点沿定方向线滑动',(rx0+rx1)/2,ry0-16,'#cfe3ff',13,null,true);
  txt('β→90°：N→0（与 mg 反向共线），F→mg',(rx0+rx1)/2,ry1+20,'#8aa6c8',12);
  OUT={th:PV[4].th,bt:PV[4].bt,F:c.F,N:c.N};
}

/* ============ 主绘制 ============ */
function draw(){
  try{
    ctx.clearRect(0,0,W,H);
    drawBG();
    if(S.model===0)draw1();
    else if(S.model===1)draw2();
    else if(S.model===2)draw3();
    else if(S.model===3)draw4();
    else draw5();
    /* 动画区右下角水印：字母依次亮闪（循环） */
    (function(){
      ctx.save();
      var wm='force99';
      ctx.font='700 15px "Microsoft YaHei",sans-serif';
      ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.lineJoin='round';
      var cw=[],tw=0,i,j;
      for(i=0;i<wm.length;i++){var w=ctx.measureText(wm[i]).width;cw.push(w);tw+=w;}
      var x0=W-12-tw, y0=H-12, N=wm.length;
      /* 暗底：始终隐约可见，不闪 */
      ctx.lineWidth=3;ctx.strokeStyle='rgba(6,11,20,.5)';
      ctx.fillStyle='rgba(150,195,235,.20)';
      for(i=0,j=x0;i<N;i++){ctx.strokeText(wm[i],j,y0);ctx.fillText(wm[i],j,y0);j+=cw[i];}
      /* 字母依次亮闪：高斯峰沿字母序号移动，过峰后熄灭，循环 */
      var ph=((Date.now()/1000)*0.5)%(1+0.25/N);   /* 含短暂全暗间隙 */
      var peak=ph*N;
      for(i=0,j=x0;i<N;i++){
        var d=i-peak, b=Math.exp(-d*d*2.2);
        if(b<0.05){j+=cw[i];continue;}
        ctx.shadowBlur=14*b;
        ctx.shadowColor='rgba(150,240,255,'+(0.85*b).toFixed(3)+')';
        var r=Math.round(205+50*b);
        ctx.fillStyle='rgba('+r+',244,255,'+(0.15+0.85*b).toFixed(3)+')';
        ctx.fillText(wm[i],j,y0);
        j+=cw[i];
      }
      ctx.restore();
    })();
    window.__drawErr=null;
  }catch(e){window.__drawErr=(e&&e.message)||String(e);}
}

+'<p class="warn">要点：三力中「恒力」只保留方向模板，关键是把几何长度比搬过来。</p>',
 '<p>三力平衡，<b>一力恒定</b>（重力 G），另两力方向一直变但<b>两力夹角不变</b>。</p>'
+'<p>在矢量三角形中，G 作为固定弦，两变化力交点 P 对弦的张角恒定 → 由圆周角定理，<b>P 必在一条圆弧上滑动</b>，这条圆弧即「矢量圆」。</p>'
+'<span class="fml">G/sin γ = T_A /sin∠ = T_B /sin∠（正弦定理）</span>'
+'<p><b>结论：</b>P 沿弧移动时，<b>某一力恰好过圆心（成为直径）时取最大值 G/sin γ</b>，其余位置均较小。</p>'
+'<p class="warn">本题（γ=120°，顺时针转 90°）：T_B 单调减小（最终绳松），T_A 先增后减。</p>',
 '<p><b>模型</b>：绳两端固定于 A、B（可上下 / 左右移动），光滑挂钩（活结）挂衣物；绳长 L 不变。衣物受重力 G（竖直向下）与水平风力 F。</p>'
+'<p>平衡时<b>两侧绳张力大小相等</b> T_A=T_B=T；衣物所受<b>等效重力</b>（G+F 合力）作用于挂钩点 C，方向沿悬挂绳（金箭头）。</p>'
+'<p><b>红·关键几何</b>：由平衡方程 T(ê₁+ê₂)=(F,−G) 可知，等效重力的向上延长线恰为两绳夹角的<b>平分线</b>，故两绳与该线的夹角恒相等（图中两个 α 相等）；无风时两绳完全对称、张角相等。</p>'
+'<span class="fml">无风：θ = asin(d/L)，&nbsp; T = G/(2cosθ)，&nbsp; 张开角 = 2θ</span>'
+'<p><b>红·核心结论（高考易错）</b>：<b>上下移动挂钩</b>（改变 yA、yB）→ θ 与 T <b>严格不变</b>，只改变悬挂高度。别误以为「挂高一点张力变小」。</p>'
+'<p class="warn">橙·易错：<b>左右移动挂钩</b>（改变间距 d）→ d↑ → 绳越平（θ↑）→ T 越大，极端 d→L 时 T→∞。风力 F 只改变两段夹角分配，整体 T 可增可减，不能笼统说「风越大张力越大」。</p>',
 '<p>光滑斜面（倾角 θ）上放一球，用<b>竖直挡板</b>挡住（挡板下端铰接在斜坡顶点）。挡板绕顶点<b>缓慢逆时针转到水平</b>：转角 β 由 0° 增到 90°。</p>'
+'<p>球受三力：重力 mg（<b>大小方向都不变</b>）、斜面支持力 N（<b>方向不变</b>，恒垂直于斜面）、挡板弹力 F（<b>方向随挡板转动</b>）。</p>'
+'<span class="fml">F = mg·sinθ / sin(α−θ)</span>'
+'<span class="fml">N = mg·sinα / sin(α−θ)，&nbsp; α = 90°+β</span>'
+'<p><b>结论：</b>β 增大（α: 90°→180°）过程中 <b>N 单调减小到 0</b>（球越来越轻地压斜面），<b>F 单调增大到 mg</b>（挡板转到水平时球整个压在挡板上、全部由它承担）。</p>'
+'<p class="warn">矢量三角形看法：mg 定边不动、N 方向锁死在斜面法线，F 的端点沿这条定方向线滑动 —— 与「① 动态三角形」是同一个模型。</p>'
];
var KVS=[
 ['kv-th','绳与竖直夹角 θ','θ'],['kv-F','F / G','F'],['kv-T','T / G','T']
];
var KVSETS=[
 ['kv-th|绳与竖直夹角 θ|°','kv-F|F / G|','kv-T|T / G|'],
 ['kv-L|绳长 L（相对值）|','kv-FT|F_T / mg|','kv-FN|F_N / mg|'],
 ['kv-phi|旋转角 φ|°','kv-TA|T_A / G|','kv-TB|T_B / G|'],
 ['kv-t1|绳AC与竖直 θ₁|°','kv-t2|绳BC与竖直 θ₂|°','kv-spread|两段张开角 θ张|°','kv-tg|绳张力 T|N','kv-tgG|T / G|','kv-stable|稳定平衡|'],
 ['kv-bt|挡板转角 β|°','kv-F|挡板弹力 F / mg|','kv-N|斜面支持力 N / mg|']
];
var HINTS=[
 '拖动 θ 或开启自动扫描：观察 G 边不动、F 边保持水平、T 边扫过扇形。',
 '拖动 α / H：注意 F_N 始终不变，F_T 随绳长同步变化。',
 '拖动 φ 让装置转 90°：观察 T_B 一路变小，T_A 先增后减。',
 '拖动 yA/yB（挂点上下）、d（左右/间距）、L（绳长）、F（风）、G（衣物重）：观察 θ₁/θ₂ 与 T 的变化。',
 '拖动 β：挡板从竖直转到水平，球沿斜面滑到顶点 —— N 一路变小、F 一路变大。'
];
var VERDICTS=[
 function(o){return 'θ='+o.th.toFixed(0)+'° ：F/G='+o.F.toFixed(2)+'，T/G='+o.T.toFixed(2)+(o.T<=1.01?'（T 取最小值 G）':'');},
 function(o){return 'F_N/mg='+o.FN.toFixed(3)+' — 与小球位置无关，恒为常数';},
 function(o){return 'φ='+o.phi.toFixed(0)+'° ：T_A/G='+o.TA.toFixed(2)+'，T_B/G='+o.TB.toFixed(2)+(o.TB<0.06?'（绳 B 松弛）':'');},
 function(o){if(!o.sol)return '绳长不足，无法悬挂（请增大 L）';var s='θ₁='+o.t1.toFixed(1)+'°、θ₂='+o.t2.toFixed(1)+'°：张开角='+o.spread.toFixed(1)+'°，T/G='+o.TG.toFixed(3);if(Math.abs(PV[3].F)<0.05)s+='（无风：θ=asin(d/L)）';else s+='（有风：挂钩偏背风侧）';return s;},
 function(o){return 'β='+o.bt.toFixed(0)+'° ：F/mg='+o.F.toFixed(3)+'，N/mg='+o.N.toFixed(3)+(o.bt>=89?'（已到水平：F=mg、N=0）':'');}
];
var TITLES=['力的动态平衡 · ① 动态三角形','力的动态平衡 · ② 相似三角形','力的动态平衡 · ③ 矢量圆','力的动态平衡 · ④ 晾衣架','力的动态平衡 · ⑤ 挡板转动'];

function buildPanel(){
  var m=S.model,h='';
  h+='<div class="tabrow">';
  for(var i=0;i<NAMES.length;i++)h+='<button data-model="'+i+'" class="'+(i===m?'on':'ghost')+'">'+NAMES[i]+'</button>';
  h+='</div>';
  h+='<div class="card"><h3>① 控制区</h3><div class="btns">'
   +'<button id="btnPlay" class="'+(S.playing?'on':'ghost')+'">'+(S.playing?'⏸ 暂停':'▶ 播放')+'</button>'
   +'<button id="btnAuto" class="'+(S.auto?'on':'ghost')+'">自动扫描</button>'
   +'<button id="btnReset" class="ghost">↺ 重置</button></div>';
  PARS[m].forEach(function(p){
    h+='<div class="row"><label>'+p.label+'</label><input type="range" data-k="'+p.k+'" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+PV[m][p.k]+'"><span class="val" id="v_'+p.k+'">'+PV[m][p.k]+p.unit+'</span></div>';
  });
  h+='</div>';
  h+='<div class="card know"><h3>② 物理知识归纳</h3>'+KNOW[m]+'</div>';
  h+='<div class="card"><h3>③ 实时物理量</h3><div id="verdict">就绪</div>';
  KVSETS[m].forEach(function(s){
    var a=s.split('|');
    h+='<div class="kv"><span class="k">'+a[1]+'</span><span class="v" id="'+a[0]+'">–</span></div>';
  });
  h+='<div class="hint">'+HINTS[m]+'</div></div>';
  document.getElementById('side').innerHTML=h;
  document.getElementById('ttl').textContent=TITLES[m];
  document.getElementById('sub').textContent=SUBS[m];
  bindPanel();
}
function bindPanel(){
  var side=document.getElementById('side');
  Array.prototype.forEach.call(side.querySelectorAll('[data-model]'),function(b){
    b.onclick=function(){S.model=+b.getAttribute('data-model');S.t=0;buildPanel();};
  });
  document.getElementById('btnPlay').onclick=function(){S.playing=!S.playing;this.className=S.playing?'on':'ghost';this.textContent=S.playing?'⏸ 暂停':'▶ 播放';};
  document.getElementById('btnAuto').onclick=function(){S.auto=!S.auto;this.className=S.auto?'on':'ghost';};
  document.getElementById('btnReset').onclick=function(){S.t=0;resetPV();S.auto=true;S.playing=true;buildPanel();};
  Array.prototype.forEach.call(side.querySelectorAll('input[data-k]'),function(inp){
    inp.oninput=function(){
      var k=inp.getAttribute('data-k');
      PV[S.model][k]=parseFloat(inp.value);
      S.auto=false;
      var ab=document.getElementById('btnAuto');if(ab)ab.className='ghost';
      var un='';PARS[S.model].forEach(function(p){if(p.k===k)un=p.unit;});
      var el=document.getElementById('v_'+k);if(el)el.textContent=(Math.round(parseFloat(inp.value)*100)/100)+un;
    };
  });
}
function resetPV(){
  PV[0].th=34;PV[1].al=32;PV[1].Hf=1.6;PV[2].phi=0;PV[2].gam=120;
  PV[3].yA=3.6;PV[3].yB=3.6;PV[3].d=3.8;PV[3].L=5.0;PV[3].F=0;PV[3].G=10;
  PV[4].th=30;PV[4].bt=0;
}
function syncPanel(){
  var m=S.model;
  PARS[m].forEach(function(p){
    var inp=document.querySelector('input[data-k="'+p.k+'"]');
    if(inp&&document.activeElement!==inp)inp.value=PV[m][p.k];
    var el=document.getElementById('v_'+p.k);
    if(el)el.textContent=(Math.round(PV[m][p.k]*100)/100)+p.unit;
  });
}
function setv(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
function updateReadout(){
  if(S.model===0){
    setv('kv-th',OUT.th?OUT.th.toFixed(0)+'°':'–');
    setv('kv-F',OUT.F!=null?OUT.F.toFixed(3):'–');
    setv('kv-T',OUT.T!=null?OUT.T.toFixed(3):'–');
  }else if(S.model===1){
    setv('kv-L',OUT.L!=null?OUT.L.toFixed(3):'–');
    setv('kv-FT',OUT.FT!=null?OUT.FT.toFixed(3):'–');
    setv('kv-FN',OUT.FN!=null?OUT.FN.toFixed(3):'–');
  }else if(S.model===2){
    setv('kv-phi',OUT.phi!=null?OUT.phi.toFixed(0)+'°':'–');
    setv('kv-TA',OUT.TA!=null?OUT.TA.toFixed(3):'–');
    setv('kv-TB',OUT.TB!=null?OUT.TB.toFixed(3):'–');
  }else if(S.model===3){
    setv('kv-t1',OUT.sol?OUT.t1.toFixed(1)+'°':'–');
    setv('kv-t2',OUT.sol?OUT.t2.toFixed(1)+'°':'–');
    setv('kv-spread',OUT.sol?OUT.spread.toFixed(1)+'°':'–');
    setv('kv-tg',OUT.sol?OUT.T.toFixed(2)+' N':'–');
    setv('kv-tgG',OUT.sol?OUT.TG.toFixed(3):'–');
    setv('kv-stable',OUT.sol?(OUT.stable?'是':'否'):'无解');
  }else{
    setv('kv-bt',OUT.bt!=null?OUT.bt.toFixed(0)+'°':'–');
    setv('kv-F',OUT.F!=null?OUT.F.toFixed(3):'–');
    setv('kv-N',OUT.N!=null?OUT.N.toFixed(3):'–');
  }
  var ve=document.getElementById('verdict');
  if(ve&&OUT&&Object.keys(OUT).length)ve.textContent=VERDICTS[S.model](OUT);
}
function driveAuto(){
  var t=S.t,m=S.model;
  if(m===0)PV[0].th=30+28*Math.sin(t*0.75);
  else if(m===1)PV[1].al=32+30*Math.sin(t*0.62);
  else if(m===2)PV[2].phi=45-45*Math.cos(t*0.55);
  else if(m===3)PV[3].d=3.8+0.7*Math.sin(t*0.5); /* 自动扫描：左右移动间距 d → 夹角变化 */
  else if(m===4)PV[4].bt=45*(1-Math.cos(t*0.5)); /* β: 0°→90°→0° 往返扫描 */
}

/* ============ 循环 ============ */
var last=0;
function frame(ts){
  if(!last)last=ts;
  var dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(S.playing){S.t+=dt;if(S.auto)driveAuto();}
  draw();syncPanel();updateReadout();
  window.__t=S.t;
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
resize();buildPanel();
requestAnimationFrame(function(ts){last=ts;window.__ready=true;frame(ts);});
window.__getState=function(){return {model:S.model,out:OUT,err:window.__drawErr};};
})();
</script>
</body>
</html>
