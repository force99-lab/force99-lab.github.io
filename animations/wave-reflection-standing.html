<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行波与反射波叠加 - 稳定版</title>
    <link rel="icon" type="image/png" href="../assets/img/wave-reflection-standing-favicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #eee;
            padding: 10px;
        }
        .container {
            background: #0f0f1f;
            padding: 15px 20px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 95%;
            max-width: 1400px;
        }
        canvas { display: block; background: #000; border-radius: 12px; width: 100%; height: auto; aspect-ratio: 3/1; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            gap: 12px 16px;
            font-size: 15px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-group label {
            font-weight: 500;
            color: #bbb;
            white-space: nowrap;
        }
        input[type="range"] {
            height: 5px;
            -webkit-appearance: none;
            background: #4a4a7a;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #6c6cf0;
            cursor: pointer;
            box-shadow: 0 0 8px #6c6cf0aa;
        }
        .val { min-width: 40px; text-align: center; font-weight: 600; color: #8f8fff; }
        button {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            background: #3a3a7a;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button:hover { transform: scale(1.03); filter: brightness(1.2); }
        button#playBtn { background: #4a9eff; min-width: 80px; }
        button#resetBtn { background: #6b6b8a; }
        button#stepBtn { background: #f0a030; color: #000; }
        button#boundaryBtn { background: #a855f7; min-width: 100px; }
        button#autoBtn { background: #22c55e; min-width: 100px; }
        .status { font-size: 15px; color: #8a8aaa; margin-left: 6px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 15px;
            color: #aaa;
            margin-top: 12px;
            justify-content: center;
        }
        .legend span { display: flex; align-items: center; gap: 8px; }
        .color-dot { display: inline-block; width: 20px; height: 4px; border-radius: 2px; }
        .color-dot.red { background: #ff4d4d; }
        .color-dot.blue { background: #4d8cff; }
        .color-dot.white { background: #ffffff; }
        .circle-sample { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ffaa44; }
        .node-mark { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ffdd44; }
        .anti-mark { display: inline-block; width: 12px; height: 12px; background: #ff8844; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        #phaseDisplay { font-weight: 600; color: #ffd966; font-size: 17px; min-width: 80px; text-align: center; }
        @media (max-width: 700px) {
            .controls { font-size: 13px; }
            button { font-size: 13px; padding: 5px 12px; }
            input[type="range"] { width: 70px; }
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="canvas" width="1200" height="400"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>频率</label>
            <input type="range" id="freqSlider" min="0.2" max="2.0" step="0.01" value="0.8">
            <span class="val" id="freqValue">0.80</span>
        </div>
        <div class="control-group">
            <label>振幅</label>
            <input type="range" id="ampSlider" min="0" max="100" step="2" value="60">
            <span class="val" id="ampValue">60</span>
        </div>
        <div class="control-group">
            <label>反射系数</label>
            <input type="range" id="reflSlider" min="0" max="1" step="0.02" value="1.0">
            <span class="val" id="reflValue">1.00</span>
        </div>
        <div class="control-group">
            <button id="boundaryBtn">固定端</button>
            <button id="autoBtn">⚡ 自动驻波</button>
        </div>
        <div class="control-group">
            <button id="playBtn">▶ 开始</button>
            <button id="stepBtn">⏭ +1/4T</button>
            <button id="resetBtn">⟳ 重置</button>
            <span class="status" id="statusText">● 停止</span>
        </div>
    </div>
    <div class="controls">
        <div class="control-group">
            <label>时间</label>
            <input type="range" id="timeSlider" min="0" max="20" step="0.02" value="0">
            <span class="val" id="timeValue">0.00s</span>
        </div>
        <div class="control-group">
            <span style="color:#aaa;">相位：</span>
            <span id="phaseDisplay">0.00 T</span>
        </div>
        <div class="legend" style="margin-top:0;">
            <span><span class="color-dot red"></span> 入射波</span>
            <span><span class="color-dot blue"></span> 反射波</span>
            <span><span class="color-dot white"></span> 合成波</span>
            <span><span class="circle-sample"></span> 质点</span>
            <span><span class="node-mark"></span> 节点</span>
            <span><span class="anti-mark"></span> 波腹</span>
            <span>⚡ 波速 200 px/s</span>
        </div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const width = 1200, height = 400;
    const CENTER_Y = height / 2;
    const WAVE_SPEED = 200;
    const NUM_POINTS = 500;
    const NUM_PARTICLES = 50;
    const BOUNDARY_X = 900;
    const MAX_TIME = 20;

    // 状态变量
    let freq = 0.8;
    let amp = 60;
    let reflCoeff = 1.0;
    let boundaryType = 'fixed';
    let time = 0;
    let isPlaying = false;
    let animId = null;
    let targetTime = null;

    // DOM
    const freqSlider = document.getElementById('freqSlider');
    const ampSlider = document.getElementById('ampSlider');
    const reflSlider = document.getElementById('reflSlider');
    const timeSlider = document.getElementById('timeSlider');
    const freqValue = document.getElementById('freqValue');
    const ampValue = document.getElementById('ampValue');
    const reflValue = document.getElementById('reflValue');
    const timeValue = document.getElementById('timeValue');
    const playBtn = document.getElementById('playBtn');
    const stepBtn = document.getElementById('stepBtn');
    const resetBtn = document.getElementById('resetBtn');
    const boundaryBtn = document.getElementById('boundaryBtn');
    const autoBtn = document.getElementById('autoBtn');
    const statusText = document.getElementById('statusText');
    const phaseDisplay = document.getElementById('phaseDisplay');

    // ---- 更新显示 ----
    function updatePhaseDisplay() {
        const T = 1 / freq;
        phaseDisplay.textContent = (time / T).toFixed(2) + ' T';
    }

    function updateTimeSlider() {
        timeSlider.max = MAX_TIME.toFixed(2);
        timeSlider.value = Math.min(time, MAX_TIME).toFixed(2);
        timeValue.textContent = time.toFixed(2) + ' s';
    }

    // ---- 步进 ----
    function stepForward() {
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 继续';
            statusText.textContent = '● 暂停';
        }
        const T = 1 / freq;
        let target = time + T / 4;
        if (target > MAX_TIME) target = MAX_TIME;
        targetTime = target;
        isPlaying = true;
        playBtn.textContent = '⏸ 暂停';
        statusText.textContent = '▶ 振动中';
        if (!animId) animate();
    }

    // ---- 重置 ----
    function resetSimulation() {
        time = 0;
        targetTime = null;
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 开始';
            statusText.textContent = '● 停止';
        }
        updateTimeSlider();
        updatePhaseDisplay();
        draw();
    }

    // ---- 频率更新 ----
    function updateFrequency(newFreq) {
        freq = Math.max(0.2, Math.min(2.0, parseFloat(newFreq)));
        freqValue.textContent = freq.toFixed(2);
        resetSimulation();
    }

    // ---- 振幅更新 ----
    function updateAmp(val) {
        amp = parseFloat(val);
        ampValue.textContent = amp.toFixed(0);
        draw();
    }

    // ---- 反射系数更新 ----
    function updateRefl(val) {
        reflCoeff = parseFloat(val);
        reflValue.textContent = reflCoeff.toFixed(2);
        draw();
    }

    // ---- 边界切换 ----
    function toggleBoundary() {
        if (boundaryType === 'fixed') {
            boundaryType = 'free';
            boundaryBtn.textContent = '自由端';
            boundaryBtn.style.background = '#f472b6';
        } else {
            boundaryType = 'fixed';
            boundaryBtn.textContent = '固定端';
            boundaryBtn.style.background = '#a855f7';
        }
        draw();
    }

    // ---- 自动驻波 ----
    function autoStanding() {
        const L = BOUNDARY_X;
        const v = WAVE_SPEED;
        let bestFreq = 0.8;
        let bestN = 1;
        let bestDiff = Infinity;
        for (let n = 1; n <= 20; n++) {
            let f = n * v / (2 * L);
            if (f >= 0.2 && f <= 2.0) {
                if (n >= 2 && n <= 8) {
                    let diff = Math.abs(f - 0.8);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        bestFreq = f;
                        bestN = n;
                    }
                }
            }
        }
        if (bestDiff === Infinity) bestFreq = v / (2 * L) * 3;
        freqSlider.value = bestFreq;
        updateFrequency(bestFreq);
        autoBtn.style.background = '#facc15';
        autoBtn.textContent = `⚡ 驻波 (n=${bestN})`;
        setTimeout(() => {
            autoBtn.style.background = '#22c55e';
            autoBtn.textContent = '⚡ 自动驻波';
        }, 2000);
    }

    // ---- 绘制（加强异常保护） ----
    function draw() {
        try {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // 安全参数
            const safeFreq = Math.max(0.2, Math.min(2.0, freq));
            const omega = 2 * Math.PI * safeFreq;
            const k = omega / WAVE_SPEED;
            const wavelength = WAVE_SPEED / safeFreq;
            const T = 1 / safeFreq;

            // 方格
            const gridStep = 24;
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 0.8;
            for (let x = 0; x <= width; x += gridStep) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke();
            }
            for (let y = 0; y <= height; y += gridStep) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
            }

            // 坐标轴
            ctx.save();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 8; ctx.shadowColor = '#ffffff44';
            ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(width-10, CENTER_Y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(width-10, CENTER_Y-8); ctx.lineTo(width, CENTER_Y); ctx.lineTo(width-10, CENTER_Y+8); ctx.stroke();
            ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
            ctx.fillText('x', width-25, CENTER_Y-10);
            ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, height-14); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(0, 0); ctx.lineTo(8, 14); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-8, height-14); ctx.lineTo(0, height); ctx.lineTo(8, height-14); ctx.stroke();
            ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('y', 20, 22);
            ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('0', -8, CENTER_Y+3);
            ctx.restore();

            // 物理参数
            ctx.fillStyle = '#ccccdd'; ctx.font = '16px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillText(`频率 f = ${safeFreq.toFixed(2)} Hz`, 14, 14);
            ctx.fillText(`波长 λ = ${wavelength.toFixed(0)} px`, 14, 36);
            ctx.fillText(`波速 v = ${WAVE_SPEED} px/s`, 14, 58);
            ctx.fillText(`振幅 = ${amp.toFixed(0)} px  反射系数 = ${reflCoeff.toFixed(2)}  边界: ${boundaryType}`, 14, 80);
            const L = BOUNDARY_X;
            const n_fixed = 2 * L / wavelength;
            const n_rounded = Math.round(n_fixed);
            const isStanding = (Math.abs(n_fixed - n_rounded) < 0.05) && reflCoeff > 0.9;
            ctx.fillStyle = isStanding ? '#4ade80' : '#f87171';
            ctx.fillText(`驻波条件: ${isStanding ? '✅ 满足 (边界为'+(boundaryType==='fixed'?'波节':'波腹')+')' : '❌ 不满足 (调节频率或点击"自动驻波")'}`, 14, 102);

            // ---- 醒目边界 ----
            ctx.save();
            ctx.strokeStyle = '#ffdd00';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffdd00aa';
            ctx.beginPath();
            ctx.moveTo(BOUNDARY_X, 0);
            ctx.lineTo(BOUNDARY_X, height);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.font = 'bold 20px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            const label = (boundaryType === 'fixed') ? '固定端' : '自由端';
            ctx.fillText('边界 ' + label, BOUNDARY_X, 10);
            ctx.fillStyle = '#ffdd00';
            ctx.beginPath();
            ctx.arc(BOUNDARY_X, 10, 8, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(BOUNDARY_X, height-10, 8, 0, 2*Math.PI);
            ctx.fill();
            ctx.restore();

            // ---- 计算入射波、反射波、合成波 ----
            const xValues = [];
            const yInc = [], yRef = [], ySum = [];
            const phaseShift = (boundaryType === 'fixed') ? Math.PI : 0;
            const refAmp = reflCoeff * amp;

            for (let i = 0; i <= NUM_POINTS; i++) {
                const x = (i / NUM_POINTS) * width;
                xValues.push(x);
                let y_inc = 0, y_ref = 0;
                const t_inc = time - x / WAVE_SPEED;
                if (t_inc > 0) {
                    y_inc = amp * Math.sin(omega * t_inc);
                }
                if (x <= BOUNDARY_X) {
                    const t_ref = time - (2 * BOUNDARY_X - x) / WAVE_SPEED;
                    if (t_ref > 0) {
                        y_ref = refAmp * Math.sin(omega * t_ref + phaseShift);
                    }
                }
                yInc.push(y_inc);
                yRef.push(y_ref);
                ySum.push(y_inc + y_ref);
            }

            // ---- 绘制波形 ----
            // 入射波
            ctx.beginPath();
            ctx.strokeStyle = '#ff4d4d';
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ff4d4d66';
            for (let i = 0; i <= NUM_POINTS; i++) {
                const drawY = CENTER_Y - yInc[i];
                if (i === 0) ctx.moveTo(xValues[i], drawY);
                else ctx.lineTo(xValues[i], drawY);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 反射波
            ctx.beginPath();
            ctx.strokeStyle = '#4d8cff';
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#4d8cff66';
            for (let i = 0; i <= NUM_POINTS; i++) {
                const drawY = CENTER_Y - yRef[i];
                if (i === 0) ctx.moveTo(xValues[i], drawY);
                else ctx.lineTo(xValues[i], drawY);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 合成波
            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffffff88';
            for (let i = 0; i <= NUM_POINTS; i++) {
                const drawY = CENTER_Y - ySum[i];
                if (i === 0) ctx.moveTo(xValues[i], drawY);
                else ctx.lineTo(xValues[i], drawY);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // ---- 节点和波腹标记 ----
            if (isStanding && reflCoeff > 0.8) {
                const lambda = wavelength;
                const nodePositions = [];
                const antiPositions = [];
                for (let n = 0; n <= 20; n++) {
                    let x_node = n * lambda / 2;
                    if (x_node >= 0 && x_node <= BOUNDARY_X) nodePositions.push(x_node);
                    let x_anti = (2 * n + 1) * lambda / 4;
                    if (x_anti >= 0 && x_anti <= BOUNDARY_X) antiPositions.push(x_anti);
                }
                for (let x of nodePositions) {
                    ctx.beginPath();
                    ctx.arc(x, CENTER_Y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 220, 0, 0.7)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffdd44';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                for (let x of antiPositions) {
                    const y_anti = CENTER_Y - (amp + refAmp);
                    const y_anti2 = CENTER_Y + (amp + refAmp);
                    ctx.beginPath();
                    ctx.moveTo(x, y_anti);
                    ctx.lineTo(x - 6, y_anti + 10);
                    ctx.lineTo(x + 6, y_anti + 10);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 136, 68, 0.7)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff8844';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(x, y_anti2);
                    ctx.lineTo(x - 6, y_anti2 - 10);
                    ctx.lineTo(x + 6, y_anti2 - 10);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 136, 68, 0.7)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff8844';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ---- 离散质点 ----
            const particlePositions = [];
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const x = (i / (NUM_PARTICLES - 1)) * width;
                let y = 0;
                const t_inc_p = time - x / WAVE_SPEED;
                let y_inc_p = 0;
                if (t_inc_p > 0) {
                    y_inc_p = amp * Math.sin(omega * t_inc_p);
                }
                let y_ref_p = 0;
                if (x <= BOUNDARY_X) {
                    const t_ref_p = time - (2 * BOUNDARY_X - x) / WAVE_SPEED;
                    if (t_ref_p > 0) {
                        y_ref_p = refAmp * Math.sin(omega * t_ref_p + phaseShift);
                    }
                }
                y = y_inc_p + y_ref_p;
                particlePositions.push({ x, y });
            }

            for (let p of particlePositions) {
                const drawY = CENTER_Y - p.y;
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.moveTo(p.x, CENTER_Y);
                ctx.lineTo(p.x, drawY);
                ctx.stroke();
            }

            for (let p of particlePositions) {
                const drawY = CENTER_Y - p.y;
                const radius = 4;
                let color;
                if (p.y > 0) {
                    const intensity = Math.min(p.y / (amp || 1), 1);
                    color = `rgb(255, ${Math.floor(200 - 180*intensity)}, ${Math.floor(200 - 180*intensity)})`;
                } else if (p.y < 0) {
                    const intensity = Math.min(-p.y / (amp || 1), 1);
                    color = `rgb(${Math.floor(200 - 180*intensity)}, ${Math.floor(200 - 180*intensity)}, 255)`;
                } else {
                    color = '#aaa';
                }
                ctx.beginPath();
                ctx.arc(p.x, drawY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = color + '88';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- 水印 ----
            ctx.save();
            ctx.font = 'italic bold 48px "Brush Script MT", "Comic Sans MS", cursive';
            ctx.fillStyle = 'rgba(0, 255, 0, 0.15)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0, 255, 0, 0.3)';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText('force99', width - 18, height - 12);
            ctx.restore();

            // ---- 状态 ----
            if (!isPlaying && time > 0) {
                ctx.fillStyle = '#ffd966'; ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.fillText('⏸ 暂停', 14, 130);
            }
            if (time === 0) {
                ctx.fillStyle = '#888'; ctx.font = '18px sans-serif';
                ctx.fillText('点击「开始」或拖动时间滑块', 14, 130);
            }
        } catch (err) {
            console.error('绘制异常:', err);
            // 显示错误信息在画布上
            ctx.fillStyle = '#ff0000';
            ctx.font = '20px sans-serif';
            ctx.fillText('绘制错误，请检查控制台', 10, 50);
        }
    }

    // ---- 动画循环 ----
    function animate() {
        if (isPlaying) {
            const dt = 1 / 60;
            time += dt;
            if (time >= MAX_TIME) {
                time = MAX_TIME;
                isPlaying = false;
                playBtn.textContent = '▶ 开始';
                statusText.textContent = '● 停止';
                targetTime = null;
            }
            if (targetTime !== null && time >= targetTime) {
                time = targetTime;
                isPlaying = false;
                playBtn.textContent = '▶ 继续';
                statusText.textContent = '● 暂停';
                targetTime = null;
            }
            timeSlider.value = Math.min(time, MAX_TIME).toFixed(2);
            timeValue.textContent = time.toFixed(2) + ' s';
            updatePhaseDisplay();
        }
        draw();
        animId = requestAnimationFrame(animate);
    }

    // ---- 事件绑定 ----
    freqSlider.addEventListener('input', function() { updateFrequency(this.value); });
    ampSlider.addEventListener('input', function() { updateAmp(this.value); });
    reflSlider.addEventListener('input', function() { updateRefl(this.value); });
    boundaryBtn.addEventListener('click', toggleBoundary);
    autoBtn.addEventListener('click', autoStanding);

    timeSlider.addEventListener('input', function() {
        const val = parseFloat(this.value);
        time = Math.min(val, MAX_TIME);
        targetTime = null;
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 继续';
            statusText.textContent = '● 暂停';
        }
        timeValue.textContent = time.toFixed(2) + ' s';
        updatePhaseDisplay();
        draw();
    });

    playBtn.addEventListener('click', function() {
        if (time >= MAX_TIME && !isPlaying) {
            resetSimulation();
            return;
        }
        if (time === 0 && !isPlaying) {
            isPlaying = true;
            playBtn.textContent = '⏸ 暂停';
            statusText.textContent = '▶ 振动中';
            targetTime = null;
            if (!animId) animate();
            return;
        }
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '⏸ 暂停' : '▶ 继续';
        statusText.textContent = isPlaying ? '▶ 振动中' : '● 暂停';
        if (isPlaying) targetTime = null;
        if (isPlaying && !animId) animate();
    });

    stepBtn.addEventListener('click', stepForward);
    resetBtn.addEventListener('click', resetSimulation);

    // ---- 启动 ----
    updateTimeSlider();
    resetSimulation();
    animate();
})();
</script>
</body>
</html>
