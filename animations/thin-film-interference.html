<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薄膜干涉 - 双视图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #e8ecf4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 10px;
            font-size: 20px;
            color: #6a9cf5;
        }
        .main {
            flex: 1;
            display: flex;
            gap: 15px;
            min-height: 0;
        }
        .viewers {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .viewer {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a3450;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .viewer canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .viewer-label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12px;
            color: rgba(180, 200, 240, 0.6);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 15px;
        }
        .controls {
            width: 260px;
            background: #0c1222;
            border: 1px solid #1f2848;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }
        .panel-title {
            font-size: 13px;
            color: #7e92c0;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1a2340;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .control-label .val {
            color: #7aa2f7;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #1d2744;
            border-radius: 4px;
            outline: none;
        }
        .info-box {
            background: #0a1020;
            border: 1px solid #1f2848;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            line-height: 1.6;
            margin-top: 15px;
        }
        .info-box strong {
            color: #ffa657;
        }
        .color-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 12px;
        }
        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #2a3450;
        }
    </style>
</head>
<body>
    <div class="header">薄膜干涉 · 双视图演示</div>
    <div class="main">
        <div class="viewers">
            <div class="viewer" id="viewer2d">
                <canvas id="canvas2d"></canvas>
                <div class="viewer-label">干涉条纹（俯视）</div>
            </div>
            <div class="viewer" id="viewer3d">
                <canvas id="canvas3d"></canvas>
                <div class="viewer-label">截面示意图</div>
            </div>
        </div>
        <div class="controls">
            <div class="panel-title">控制参数</div>
            <div class="control-group">
                <div class="control-label"><span>楔角 θ</span><span class="val" id="angleVal">0.5°</span></div>
                <input type="range" id="angle" min="0.1" max="2.0" step="0.1" value="0.5">
            </div>
            <div class="control-group">
                <div class="control-label"><span>波长 λ</span><span class="val" id="wavelengthVal">580 nm</span></div>
                <input type="range" id="wavelength" min="380" max="780" step="10" value="580">
                <div class="color-indicator">
                    <span>光源颜色</span>
                    <div class="color-swatch" id="colorSwatch"></div>
                </div>
            </div>
            <div class="control-group">
                <div class="control-label"><span>凸起幅度 h</span><span class="val" id="bumpVal">2.0 μm</span></div>
                <input type="range" id="bump" min="-3.0" max="3.0" step="0.1" value="2.0">
            </div>
            <div class="control-group">
                <div class="control-label"><span>凸起位置</span><span class="val" id="posVal">50%</span></div>
                <input type="range" id="pos" min="0" max="100" step="5" value="50">
            </div>
            <div class="info-box">
                <strong>物理原理：</strong><br>
                光程差 δ = 2d + λ/2（含半波损失）<br>
                亮纹：2d + λ/2 = kλ<br>
                暗纹：2d + λ/2 = (2k+1)λ/2<br><br>
                <strong>条纹弯曲规律：</strong><br>
                • 凸起(h>0)：空气膜变薄 → 条纹远离接触端<br>
                • 凹陷(h<0)：空气膜变厚 → 条纹靠近接触端
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const canvas2d = document.getElementById('canvas2d');
        const ctx2d = canvas2d.getContext('2d');
        const canvas3d = document.getElementById('canvas3d');
        const ctx3d = canvas3d.getContext('2d');

        // 参数
        const params = {
            angle: 0.5,
            wavelength: 580,
            bump: 2.0,
            bumpPos: 0.5
        };

        // 波长转RGB
        function wavelengthToRGB(wl) {
            let r, g, b;
            if (wl < 440) { r = -(wl - 440) / 60; g = 0; b = 1; }
            else if (wl < 490) { r = 0; g = (wl - 440) / 50; b = 1; }
            else if (wl < 510) { r = 0; g = 1; b = -(wl - 510) / 20; }
            else if (wl < 580) { r = (wl - 510) / 70; g = 1; b = 0; }
            else if (wl < 645) { r = 1; g = -(wl - 645) / 65; b = 0; }
            else { r = 1; g = 0; b = 0; }

            let factor;
            if (wl < 420) factor = 0.3 + 0.7 * (wl - 380) / 40;
            else if (wl <= 700) factor = 1.0;
            else factor = 0.3 + 0.7 * (780 - wl) / 80;

            return [r * factor, g * factor, b * factor];
        }

        // 调整画布大小
        function resizeCanvas(canvas, container) {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = rect.width || 300;
            const h = rect.height || 200;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return { w, h, ctx };
        }

        // 渲染2D干涉条纹
        function render2D() {
            const { w, h, ctx } = resizeCanvas(canvas2d, document.getElementById('viewer2d'));

            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;

            const theta = params.angle * Math.PI / 180;
            const lambda_eff = params.wavelength * 1e-6 * 10;
            const amp = params.bump * 1e-3;
            const bumpX = params.bumpPos * w;

            const [rBase, gBase, bBase] = wavelengthToRGB(params.wavelength);

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    let d = x * Math.tan(theta) * 0.01;
                    const dx = (x - bumpX) / 80;
                    const bumpEffect = amp * Math.exp(-dx * dx / 2);
                    d -= bumpEffect;

                    const phase = 4 * Math.PI * d / lambda_eff;
                    const intensity = Math.pow(Math.sin(phase / 2), 2);

                    const idx = (y * w + x) * 4;
                    data[idx] = Math.min(255, Math.round(rBase * intensity * 255));
                    data[idx + 1] = Math.min(255, Math.round(gBase * intensity * 255));
                    data[idx + 2] = Math.min(255, Math.round(bBase * intensity * 255));
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // 标注
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.font = '11px sans-serif';
            ctx.fillText(`θ=${params.angle.toFixed(1)}°  λ=${params.wavelength}nm`, 8, 18);
            ctx.fillText('← 接触端          厚度增加 →', w/2 - 60, h - 8);
        }

        // 渲染3D截面图
        function render3D() {
            const { w, h, ctx } = resizeCanvas(canvas3d, document.getElementById('viewer3d'));

            ctx.fillStyle = '#0a0e1a';
            ctx.fillRect(0, 0, w, h);

            const margin = 40;
            const plotW = w - 2 * margin;
            const plotH = h - 2 * margin;
            const ox = margin;
            const oy = h - margin;

            const theta = params.angle * Math.PI / 180;
            const amp_mm = Math.abs(params.bump) * 1e-3;
            const bumpSign = params.bump > 0 ? 1 : -1;
            const bumpX_pos = params.bumpPos * plotW + ox;

            ctx.strokeStyle = 'rgba(136,204,255,0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(ox + plotW, oy - plotH * 0.6);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,200,100,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            for (let i = 0; i <= 100; i++) {
                const x = ox + (i / 100) * plotW;
                let y = oy;
                const dist = Math.abs(x - bumpX_pos) / (plotW * 0.15);
                const bumpY = bumpSign * amp_mm * 30 * Math.exp(-dist * dist / 2);
                y -= bumpY;
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,100,100,0.9)';
            ctx.beginPath();
            ctx.arc(bumpX_pos, oy - bumpSign * amp_mm * 30, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '10px sans-serif';
            ctx.fillText(params.bump > 0 ? '凸起' : '凹陷', bumpX_pos + 8, oy - bumpSign * amp_mm * 30 - 5);

            ctx.fillStyle = 'rgba(150,170,200,0.5)';
            ctx.font = '10px sans-serif';
            ctx.fillText('x (mm)', ox + plotW - 35, oy + 15);
            ctx.fillText('接触点 d=0', ox - 45, oy + 15);
        }

        // 更新所有
        function updateAll() {
            render2D();
            render3D();

            const [r, g, b] = wavelengthToRGB(params.wavelength);
            document.getElementById('colorSwatch').style.background = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
        }

        // 事件监听
        document.getElementById('angle').addEventListener('input', (e) => {
            params.angle = parseFloat(e.target.value);
            document.getElementById('angleVal').textContent = params.angle.toFixed(1) + '°';
            updateAll();
        });

        document.getElementById('wavelength').addEventListener('input', (e) => {
            params.wavelength = parseInt(e.target.value);
            document.getElementById('wavelengthVal').textContent = params.wavelength + ' nm';
            updateAll();
        });

        document.getElementById('bump').addEventListener('input', (e) => {
            params.bump = parseFloat(e.target.value);
            document.getElementById('bumpVal').textContent = params.bump.toFixed(1) + ' μm';
            updateAll();
        });

        document.getElementById('pos').addEventListener('input', (e) => {
            params.bumpPos = parseInt(e.target.value) / 100;
            document.getElementById('posVal').textContent = e.target.value + '%';
            updateAll();
        });

        window.addEventListener('resize', updateAll);

        // 初始渲染
        setTimeout(updateAll, 50);
    </script>
</body>
</html>
