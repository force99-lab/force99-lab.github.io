<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双波源反向传播 · 质点叠加 · 脉冲模式</title>
    <link rel="icon" type="image/png" href="../assets/img/wave-superposition-favicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #eee;
            padding: 10px;
        }
        .container {
            background: #0f0f1f;
            padding: 15px 20px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 95%;
            max-width: 1400px;
        }
        canvas { display: block; background: #000; border-radius: 12px; width: 100%; height: auto; aspect-ratio: 3/1; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            gap: 12px 16px;
            font-size: 15px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-group label {
            font-weight: 500;
            color: #bbb;
            white-space: nowrap;
        }
        input[type="range"] {
            height: 5px;
            -webkit-appearance: none;
            background: #4a4a7a;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #6c6cf0;
            cursor: pointer;
            box-shadow: 0 0 8px #6c6cf0aa;
        }
        .val { min-width: 40px; text-align: center; font-weight: 600; color: #8f8fff; }
        button {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            background: #3a3a7a;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button:hover { transform: scale(1.03); filter: brightness(1.2); }
        button.pulse-preset { background: #4a6a8a; padding: 4px 12px; font-size: 13px; }
        button.pulse-preset.active { background: #f0a030; color: #000; }
        button#playBtn { background: #4a9eff; min-width: 80px; }
        button#resetBtn { background: #6b6b8a; }
        button#stepBtn { background: #f0a030; color: #000; }
        button#phaseBtn { background: #a855f7; min-width: 90px; }
        .status { font-size: 15px; color: #8a8aaa; margin-left: 6px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 15px;
            color: #aaa;
            margin-top: 12px;
            justify-content: center;
        }
        .legend span { display: flex; align-items: center; gap: 8px; }
        .color-dot { display: inline-block; width: 20px; height: 4px; border-radius: 2px; }
        .color-dot.red { background: #ff4d4d; }
        .color-dot.blue { background: #4d8cff; }
        .color-dot.white { background: #ffffff; }
        .circle-sample { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ffaa44; }
        #phaseDisplay { font-weight: 600; color: #ffd966; font-size: 17px; min-width: 80px; text-align: center; }
        @media (max-width: 700px) {
            .controls { font-size: 13px; }
            button { font-size: 13px; padding: 5px 12px; }
            input[type="range"] { width: 70px; }
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="canvas" width="1200" height="400"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>频率</label>
            <input type="range" id="freqSlider" min="0.2" max="2.0" step="0.1" value="0.8">
            <span class="val" id="freqValue">0.8</span>
        </div>
        <div class="control-group">
            <label>源1振幅</label>
            <input type="range" id="amp1Slider" min="0" max="100" step="2" value="60">
            <span class="val" id="amp1Value">60</span>
        </div>
        <div class="control-group">
            <label>源2振幅</label>
            <input type="range" id="amp2Slider" min="0" max="100" step="2" value="60">
            <span class="val" id="amp2Value">60</span>
        </div>
        <div class="control-group">
            <label>延迟</label>
            <input type="range" id="delaySlider" min="0" max="2" step="0.02" value="0">
            <span class="val" id="delayValue">0.00s</span>
        </div>
        <div class="control-group">
            <label>脉冲宽度</label>
            <input type="range" id="pulseSlider" min="0.05" max="1.0" step="0.01" value="0.25">
            <span class="val" id="pulseValue">0.25T</span>
        </div>
    </div>
    <div class="controls">
        <div class="control-group">
            <label><input type="checkbox" id="pulseCheck"> 脉冲模式</label>
            <button class="pulse-preset" data-pulse="0.25">1/4T</button>
            <button class="pulse-preset" data-pulse="0.5">1/2T</button>
            <button class="pulse-preset" data-pulse="1.0">1T</button>
            <button class="pulse-preset" data-pulse="0">连续</button>
        </div>
        <div class="control-group">
            <button id="phaseBtn">同相</button>
            <button id="playBtn">▶ 开始</button>
            <button id="stepBtn">⏭ +1/4T</button>
            <button id="resetBtn">⟳ 重置</button>
            <span class="status" id="statusText">● 停止</span>
        </div>
        <div class="control-group">
            <label>时间</label>
            <input type="range" id="timeSlider" min="0" max="10" step="0.02" value="0">
            <span class="val" id="timeValue">0.00s</span>
        </div>
        <div class="control-group">
            <span style="color:#aaa;">相位：</span>
            <span id="phaseDisplay">0.00 T</span>
        </div>
    </div>
    <div class="legend">
        <span><span class="color-dot red"></span> 波1</span>
        <span><span class="color-dot blue"></span> 波2</span>
        <span><span class="color-dot white"></span> 合成波</span>
        <span><span class="circle-sample"></span> 质点</span>
        <span>⚡ 波速 200 px/s</span>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const width = 1200, height = 400;
    const CENTER_Y = height / 2;
    const WAVE_SPEED = 200;
    const NUM_POINTS = 500;
    const NUM_PARTICLES = 50;
    const SOURCE2_POS = 800;

    // 状态变量
    let freq = 0.8;
    let amp1 = 60;
    let amp2 = 60;
    let delay2 = 0;
    let phase2 = 0;
    let time = 0;
    let isPlaying = false;
    let animId = null;
    let targetTime = null;

    // 脉冲参数
    let pulseMode = false;
    let pulseWidth = 0.25;  // 以周期为单位

    // DOM
    const freqSlider = document.getElementById('freqSlider');
    const amp1Slider = document.getElementById('amp1Slider');
    const amp2Slider = document.getElementById('amp2Slider');
    const delaySlider = document.getElementById('delaySlider');
    const pulseSlider = document.getElementById('pulseSlider');
    const timeSlider = document.getElementById('timeSlider');
    const freqValue = document.getElementById('freqValue');
    const amp1Value = document.getElementById('amp1Value');
    const amp2Value = document.getElementById('amp2Value');
    const delayValue = document.getElementById('delayValue');
    const pulseValue = document.getElementById('pulseValue');
    const timeValue = document.getElementById('timeValue');
    const playBtn = document.getElementById('playBtn');
    const stepBtn = document.getElementById('stepBtn');
    const resetBtn = document.getElementById('resetBtn');
    const phaseBtn = document.getElementById('phaseBtn');
    const pulseCheck = document.getElementById('pulseCheck');
    const statusText = document.getElementById('statusText');
    const phaseDisplay = document.getElementById('phaseDisplay');
    const presetBtns = document.querySelectorAll('.pulse-preset');

    // ---- 更新显示 ----
    function updatePhaseDisplay() {
        const T = 1 / freq;
        phaseDisplay.textContent = (time / T).toFixed(2) + ' T';
    }

    function updateTimeSlider() {
        const T = 1 / freq;
        const maxTime = 4 * T;
        timeSlider.max = maxTime.toFixed(2);
        timeSlider.value = time.toFixed(2);
        timeValue.textContent = time.toFixed(2) + ' s';
        delaySlider.max = (2 * T).toFixed(2);
        delaySlider.step = (T / 20).toFixed(3);
        // 脉冲宽度显示
        pulseValue.textContent = (pulseWidth).toFixed(2) + 'T';
        // 高亮对应预设按钮
        presetBtns.forEach(btn => {
            const val = parseFloat(btn.dataset.pulse);
            if (Math.abs(val - pulseWidth) < 0.01) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // ---- 步进 ----
    function stepForward() {
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 继续';
            statusText.textContent = '● 暂停';
        }
        const T = 1 / freq;
        const maxTime = parseFloat(timeSlider.max);
        let target = time + T / 4;
        if (target > maxTime) target = maxTime;
        targetTime = target;
        isPlaying = true;
        playBtn.textContent = '⏸ 暂停';
        statusText.textContent = '▶ 振动中';
        if (!animId) animate();
    }

    // ---- 重置 ----
    function resetSimulation() {
        time = 0;
        targetTime = null;
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 开始';
            statusText.textContent = '● 停止';
        }
        updateTimeSlider();
        updatePhaseDisplay();
        draw();
    }

    // ---- 频率更新 ----
    function updateFrequency(newFreq) {
        freq = newFreq;
        freqValue.textContent = freq.toFixed(1);
        resetSimulation();
    }

    // ---- 振幅更新 ----
    function updateAmp1(val) {
        amp1 = parseFloat(val);
        amp1Value.textContent = amp1.toFixed(0);
        draw();
    }
    function updateAmp2(val) {
        amp2 = parseFloat(val);
        amp2Value.textContent = amp2.toFixed(0);
        draw();
    }

    // ---- 延迟更新 ----
    function updateDelay(val) {
        delay2 = parseFloat(val);
        delayValue.textContent = delay2.toFixed(2) + 's';
        draw();
    }

    // ---- 脉冲更新 ----
    function updatePulse(val) {
        pulseWidth = parseFloat(val);
        pulseValue.textContent = pulseWidth.toFixed(2) + 'T';
        // 高亮预设按钮
        presetBtns.forEach(btn => {
            const v = parseFloat(btn.dataset.pulse);
            if (Math.abs(v - pulseWidth) < 0.01) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        draw();
    }

    // ---- 相位切换 ----
    function togglePhase() {
        if (phase2 === 0) {
            phase2 = Math.PI;
            phaseBtn.textContent = '反相';
            phaseBtn.style.background = '#f472b6';
        } else {
            phase2 = 0;
            phaseBtn.textContent = '同相';
            phaseBtn.style.background = '#a855f7';
        }
        draw();
    }

    // ---- 绘制 ----
    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        // 方格
        const gridStep = 24;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 0.8;
        for (let x = 0; x <= width; x += gridStep) {
            ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke();
        }
        for (let y = 0; y <= height; y += gridStep) {
            ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
        }

        // 坐标轴
        ctx.save();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 8; ctx.shadowColor = '#ffffff44';
        ctx.beginPath(); ctx.moveTo(0, CENTER_Y); ctx.lineTo(width-10, CENTER_Y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(width-10, CENTER_Y-8); ctx.lineTo(width, CENTER_Y); ctx.lineTo(width-10, CENTER_Y+8); ctx.stroke();
        ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('x', width-25, CENTER_Y-10);
        ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, height-14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(0, 0); ctx.lineTo(8, 14); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-8, height-14); ctx.lineTo(0, height); ctx.lineTo(8, height-14); ctx.stroke();
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('y', 20, 22);
        ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('0', -8, CENTER_Y+3);
        ctx.restore();

        // 物理参数
        const omega = 2 * Math.PI * freq;
        const k = omega / WAVE_SPEED;
        const wavelength = WAVE_SPEED / freq;
        const T = 1 / freq;
        const pulseDuration = pulseMode ? pulseWidth * T : Infinity;
        ctx.fillStyle = '#ccccdd'; ctx.font = '16px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(`频率 f = ${freq.toFixed(1)} Hz`, 14, 14);
        ctx.fillText(`波长 λ = ${wavelength.toFixed(0)} px`, 14, 36);
        ctx.fillText(`波速 v = ${WAVE_SPEED} px/s`, 14, 58);
        ctx.fillText(`源1振幅 = ${amp1.toFixed(0)} px  源2振幅 = ${amp2.toFixed(0)} px  延迟 = ${delay2.toFixed(2)} s`, 14, 80);
        ctx.fillText(`脉冲模式: ${pulseMode ? 'ON (脉冲宽度='+pulseWidth.toFixed(2)+'T)' : 'OFF (连续波)'}`, 14, 102);

        // 标记波源位置
        ctx.save();
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#ff4d4d';
        ctx.fillText('▼ 源1', 0, CENTER_Y - 12);
        ctx.beginPath(); ctx.moveTo(0, CENTER_Y-6); ctx.lineTo(0, CENTER_Y+6); ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#4d8cff';
        ctx.fillText('▼ 源2', SOURCE2_POS, CENTER_Y - 12);
        ctx.beginPath(); ctx.moveTo(SOURCE2_POS, CENTER_Y-6); ctx.lineTo(SOURCE2_POS, CENTER_Y+6); ctx.strokeStyle = '#4d8cff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();

        // ---- 计算两列波和合成波（连续曲线） ----
        const xValues = [];
        const y1 = [], y2 = [], ySum = [];
        for (let i = 0; i <= NUM_POINTS; i++) {
            const x = (i / NUM_POINTS) * width;
            xValues.push(x);
            let y1_val = 0, y2_val = 0;
            // 波1：从x=0向右传播
            const t1 = time - x / WAVE_SPEED;
            if (t1 > 0) {
                if (pulseMode && t1 > pulseDuration) {
                    y1_val = 0;
                } else {
                    y1_val = amp1 * Math.sin(omega * t1);
                }
            }
            // 波2：从x=SOURCE2_POS向左传播
            if (x <= SOURCE2_POS) {
                const effectiveTime = time - delay2;
                const t2 = effectiveTime - (SOURCE2_POS - x) / WAVE_SPEED;
                if (t2 > 0) {
                    if (pulseMode && t2 > pulseDuration) {
                        y2_val = 0;
                    } else {
                        y2_val = amp2 * Math.sin(omega * t2 + phase2);
                    }
                }
            }
            y1.push(y1_val);
            y2.push(y2_val);
            ySum.push(y1_val + y2_val);
        }

        // ---- 绘制连续波形 ----
        // 波1 (红色)
        ctx.beginPath();
        ctx.strokeStyle = '#ff4d4d';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ff4d4d66';
        for (let i = 0; i <= NUM_POINTS; i++) {
            const drawY = CENTER_Y - y1[i];
            if (i === 0) ctx.moveTo(xValues[i], drawY);
            else ctx.lineTo(xValues[i], drawY);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 波2 (蓝色)
        ctx.beginPath();
        ctx.strokeStyle = '#4d8cff';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#4d8cff66';
        for (let i = 0; i <= NUM_POINTS; i++) {
            const drawY = CENTER_Y - y2[i];
            if (i === 0) ctx.moveTo(xValues[i], drawY);
            else ctx.lineTo(xValues[i], drawY);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 合成波 (白色，加粗)
        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#ffffff88';
        for (let i = 0; i <= NUM_POINTS; i++) {
            const drawY = CENTER_Y - ySum[i];
            if (i === 0) ctx.moveTo(xValues[i], drawY);
            else ctx.lineTo(xValues[i], drawY);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        // ---- 绘制离散质点（依次被带动，叠加原理） ----
        const particlePositions = [];
        for (let i = 0; i < NUM_PARTICLES; i++) {
            const x = (i / (NUM_PARTICLES - 1)) * width;
            let y = 0;
            // 波1到达该点的时间
            const t1 = time - x / WAVE_SPEED;
            let y1_p = 0;
            if (t1 > 0) {
                if (pulseMode && t1 > pulseDuration) {
                    y1_p = 0;
                } else {
                    y1_p = amp1 * Math.sin(omega * t1);
                }
            }
            // 波2到达该点的时间
            let y2_p = 0;
            if (x <= SOURCE2_POS) {
                const effectiveTime = time - delay2;
                const t2 = effectiveTime - (SOURCE2_POS - x) / WAVE_SPEED;
                if (t2 > 0) {
                    if (pulseMode && t2 > pulseDuration) {
                        y2_p = 0;
                    } else {
                        y2_p = amp2 * Math.sin(omega * t2 + phase2);
                    }
                }
            }
            y = y1_p + y2_p;
            particlePositions.push({ x, y });
        }

        // 画指示线
        for (let p of particlePositions) {
            const drawY = CENTER_Y - p.y;
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.moveTo(p.x, CENTER_Y);
            ctx.lineTo(p.x, drawY);
            ctx.stroke();
        }

        // 画质点
        for (let p of particlePositions) {
            const drawY = CENTER_Y - p.y;
            const radius = 4;
            let color;
            if (p.y > 0) {
                const intensity = Math.min(p.y / amp1, 1);
                color = `rgb(255, ${Math.floor(200 - 180*intensity)}, ${Math.floor(200 - 180*intensity)})`;
            } else if (p.y < 0) {
                const intensity = Math.min(-p.y / amp1, 1);
                color = `rgb(${Math.floor(200 - 180*intensity)}, ${Math.floor(200 - 180*intensity)}, 255)`;
            } else {
                color = '#aaa';
            }
            ctx.beginPath();
            ctx.arc(p.x, drawY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = color + '88';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // ---- 水印：提升透明度至 0.15，并增加发光 ----
        ctx.save();
        ctx.font = 'italic bold 48px "Brush Script MT", "Comic Sans MS", cursive';
        ctx.fillStyle = 'rgba(0, 255, 0, 0.15)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(0, 255, 0, 0.3)';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText('force99', width - 18, height - 12);
        ctx.restore();

        // ---- 状态 ----
        if (!isPlaying && time > 0) {
            ctx.fillStyle = '#ffd966'; ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'left'; ctx.textBaseline = 'top';
            ctx.fillText('⏸ 暂停', 14, 130);
        }
        if (time === 0) {
            ctx.fillStyle = '#888'; ctx.font = '18px sans-serif';
            ctx.fillText('点击「开始」或拖动时间滑块', 14, 130);
        }
    }

    // ---- 动画循环 ----
    function animate() {
        if (isPlaying) {
            const dt = 1 / 60;
            time += dt;
            const maxTime = parseFloat(timeSlider.max);
            if (time >= maxTime) {
                time = maxTime;
                isPlaying = false;
                playBtn.textContent = '▶ 开始';
                statusText.textContent = '● 停止';
                targetTime = null;
            }
            if (targetTime !== null && time >= targetTime) {
                time = targetTime;
                isPlaying = false;
                playBtn.textContent = '▶ 继续';
                statusText.textContent = '● 暂停';
                targetTime = null;
            }
            timeSlider.value = time.toFixed(2);
            timeValue.textContent = time.toFixed(2) + ' s';
            updatePhaseDisplay();
        }
        draw();
        animId = requestAnimationFrame(animate);
    }

    // ---- 事件绑定 ----
    freqSlider.addEventListener('input', function() { updateFrequency(this.value); });
    amp1Slider.addEventListener('input', function() { updateAmp1(this.value); });
    amp2Slider.addEventListener('input', function() { updateAmp2(this.value); });
    delaySlider.addEventListener('input', function() { updateDelay(this.value); });
    pulseSlider.addEventListener('input', function() { updatePulse(this.value); });
    pulseCheck.addEventListener('change', function() {
        pulseMode = this.checked;
        draw();
    });
    // 预设按钮
    presetBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const val = parseFloat(this.dataset.pulse);
            if (val === 0) {
                // 连续模式：取消脉冲模式，或者设置脉冲宽度很大？我们设置脉冲模式为OFF
                pulseCheck.checked = false;
                pulseMode = false;
                pulseSlider.value = 0.25; // 随便设，但不影响
                pulseWidth = 0.25;
            } else {
                pulseCheck.checked = true;
                pulseMode = true;
                pulseSlider.value = val;
                pulseWidth = val;
            }
            updatePulse(pulseWidth);
            // 高亮更新
            presetBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            draw();
        });
    });
    phaseBtn.addEventListener('click', togglePhase);

    timeSlider.addEventListener('input', function() {
        const val = parseFloat(this.value);
        time = val;
        targetTime = null;
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = '▶ 继续';
            statusText.textContent = '● 暂停';
        }
        timeValue.textContent = time.toFixed(2) + ' s';
        updatePhaseDisplay();
        draw();
    });

    playBtn.addEventListener('click', function() {
        const maxTime = parseFloat(timeSlider.max);
        if (time >= maxTime && !isPlaying) {
            resetSimulation();
            return;
        }
        if (time === 0 && !isPlaying) {
            isPlaying = true;
            playBtn.textContent = '⏸ 暂停';
            statusText.textContent = '▶ 振动中';
            targetTime = null;
            if (!animId) animate();
            return;
        }
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '⏸ 暂停' : '▶ 继续';
        statusText.textContent = isPlaying ? '▶ 振动中' : '● 暂停';
        if (isPlaying) targetTime = null;
        if (isPlaying && !animId) animate();
    });

    stepBtn.addEventListener('click', stepForward);
    resetBtn.addEventListener('click', resetSimulation);

    // ---- 启动 ----
    const T_init = 1 / freq;
    delaySlider.max = (2 * T_init).toFixed(2);
    delaySlider.step = (T_init / 20).toFixed(3);
    updateTimeSlider();
    resetSimulation();
    animate();
})();
</script>
</body>
</html>
