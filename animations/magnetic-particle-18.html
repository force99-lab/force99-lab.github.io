<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>带电粒子在磁场中的运动 · 20 模型精讲</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05080f;color:#cfe3ff;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden}
  #app{display:flex;height:100vh}
  #stage{position:relative;flex:1 1 auto;min-width:0;background:
    radial-gradient(1200px 700px at 38% 32%,#0d1830 0%,#070d1c 60%,#04070f 100%)}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #title{position:absolute;left:18px;top:12px;font-size:20px;font-weight:700;
    color:#eaf4ff;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #title small{display:block;font-size:12px;font-weight:400;color:#7fa6d8;margin-top:2px}
  #panel{flex:0 0 340px;background:linear-gradient(180deg,#0a1222,#070d18);
    border-left:1px solid #16345c;padding:14px 14px 16px;overflow-y:auto}
  #panel h2{font-size:13px;color:#7fd8ff;margin:14px 0 7px;letter-spacing:1px;
    border-left:3px solid #2fa7ff;padding-left:8px}
  #panel h2:first-child{margin-top:2px}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .nav button{font:inherit;font-size:11.5px;color:#bcd4f2;background:#10203a;
    border:1px solid #1d3a63;border-radius:7px;padding:7px 6px;text-align:left;
    cursor:pointer;transition:.15s;line-height:1.25}
  .nav button:hover{background:#163153;border-color:#2f6fb0}
  .nav button.on{background:#1356a8;border-color:#49b6ff;color:#fff;
    box-shadow:0 0 12px rgba(42,150,255,.45)}
  .nav button b{color:#ffd479;font-weight:700;margin-right:3px}
  #ctrls{display:flex;gap:8px;align-items:center;margin:12px 0 6px}
  #ctrls button{font:inherit;font-size:13px;color:#eaf4ff;background:#16345c;
    border:1px solid #2f6fb0;border-radius:8px;padding:8px 12px;cursor:pointer}
  #ctrls button:hover{background:#1d4a86}
  #spd{margin-left:auto;font-size:12px;color:#9fc2ea}
  #spd select{font:inherit;font-size:12px;background:#10203a;color:#cfe3ff;
    border:1px solid #1d3a63;border-radius:6px;padding:3px 6px}
  #prog{height:5px;background:#0c1a30;border-radius:4px;overflow:hidden;margin-top:8px}
  #progI{height:100%;width:0;background:linear-gradient(90deg,#2fa7ff,#7fffd0)}
  #note{margin-top:12px;font-size:12.5px;line-height:1.65;color:#aebfdc;
    background:#0c182c;border:1px solid #16314f;border-radius:9px;padding:11px 12px}
  #note b{color:#ffd479}
  #note .k{color:#7fffd0;font-weight:700}
  #note .h{color:#eaf4ff;font-weight:700;font-size:13.5px;display:block;margin-bottom:4px}
  .wm{font:700 13px/1 "Microsoft YaHei";fill:#bfe0ff;opacity:.0}
  #extraCtl{margin-top:10px;display:none;background:#0c182c;border:1px solid #16314f;
    border-radius:9px;padding:10px 12px}
  #extraCtl .ctl{margin:9px 0}
  #extraCtl label{font-size:12px;color:#9fc2ea;display:flex;justify-content:space-between;margin-bottom:2px}
  #extraCtl label span:last-child{color:#ffd479;font-weight:700}
  #extraCtl input[type=range]{width:100%;accent-color:#2fa7ff}
  #extraCtl .hint{font-size:11.5px;color:#7fa6d8;margin:2px 0 4px;line-height:1.5}
  /* 公式竖式分式（与三页式一致：横向 padding 移容器、line-height 不重叠） */
  #note .frac{display:inline-flex;flex-direction:column;vertical-align:middle;
    text-align:center;line-height:1.08;font-size:.92em;margin:0 1px;
    transform:translateY(-.04em)}
  #note .frac .num{border-bottom:1px solid currentColor;padding:0 4px}
  #note .frac .den{padding:0 4px}
  #note sub,#note sup{font-size:.78em}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="title">带电粒子在磁场中的运动</div>
  </div>
  <div id="panel">
    <h2>一、有界磁场与动态圆</h2>
    <div class="nav" id="navA"></div>
    <h2>二、仪器与复合场</h2>
    <div class="nav" id="navB"></div>
    <div id="ctrls">
      <button id="play">⏸ 暂停</button>
      <button id="reset">↺ 重置</button>
      <span id="spd">速度 <select id="speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="1.6">1.6×</option><option value="2.4">2.4×</option></select></span>
    </div>
    <div id="prog"><div id="progI"></div></div>
    <div id="note"></div>
    <div id="extraCtl"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function hidpi(){
  var r=cv.getBoundingClientRect();
  W=Math.max(640,r.width); H=Math.max(360,r.height);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
// ---- world -> screen projection (auto fit per model view rect) ----
var V={sc:1,ox:0,oy:0};
function setView(v){
  var m=0.13, vw=v[2]-v[0], vh=v[3]-v[1];
  var sc=Math.min(W*(1-2*m)/vw, H*(1-2*m)/vh);
  V.sc=sc;
  V.ox=(W - vw*sc)/2 - v[0]*sc;
  V.oy=(H - vh*sc)/2 + v[3]*sc; // world top v[3] maps to H*m
}
function P(x,y){ return [V.ox+x*V.sc, V.oy - y*V.sc]; }
function L(x,y){ return V.sc; } // scale factor

// ---- draw helpers ----
function line(a,b,c,d,col,w,dash){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w||1.4;
  if(dash)ctx.setLineDash(dash);ctx.beginPath();
  ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();ctx.restore();
}
function arrow(x1,y1,x2,y2,col,w,head){
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-y1,x2-x1),h=head||9;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-h*Math.cos(ang-0.42),y2-h*Math.sin(ang-0.42));
  ctx.lineTo(x2-h*Math.cos(ang+0.42),y2-h*Math.sin(ang+0.42));
  ctx.closePath();ctx.fill();ctx.restore();
}
function txt(s,x,y,col,sz,al,wt){
  ctx.save();ctx.fillStyle=col||'#cfe3ff';ctx.font=(wt||'400')+' '+(sz||13)+
    'px "Microsoft YaHei",sans-serif';ctx.textAlign=al||'left';ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
// ===== 公式渲染：上下分式 \frac{分子}{分母} + 真实下标 _{x} + 上标 ^{x} =====
function fmtFont(sz,wt){ return (wt||'400')+' '+sz+'px "Microsoft YaHei",sans-serif'; }
function fmtBrace(str,i){
  if(str[i]!=='{'){ return {s:str[i], end:i+1}; }
  var depth=0,j=i;
  for(;j<str.length;j++){ if(str[j]==='{')depth++; else if(str[j]==='}'){depth--; if(depth===0){j++;break;}} }
  return {s:str.substr(i+1,j-i-2), end:j};
}
function fmtParse(str){
  var toks=[], i=0, n=str.length;
  while(i<n){
    if(str.substr(i,5)==='\\frac'){
      i+=5; var g1=fmtBrace(str,i); i=g1.end; var g2=fmtBrace(str,i); i=g2.end;
      toks.push({ty:'frac',n:g1.s,d:g2.s});
    } else if(str[i]==='_'||str[i]==='^'){
      var op=str[i]; i++;
      var g=fmtBrace(str,i); i=g.end;
      toks.push({ty:(op==='_'?'sub':'sup'),s:g.s});
    } else {
      var j=i; while(j<n && str[j]!=='\\' && str[j]!=='_' && str[j]!=='^') j++;
      toks.push({ty:'txt',s:str.substr(i,j-i)}); i=j;
    }
  }
  return toks;
}
function fmtW(t,sz,wt){
  if(t.ty==='txt'){ ctx.font=fmtFont(sz,wt); return ctx.measureText(t.s).width; }
  if(t.ty==='sub'||t.ty==='sup'){ ctx.font=fmtFont(sz*0.7,wt); return ctx.measureText(t.s).width; }
  var ns=sz*0.9, ds=sz*0.9;
  ctx.font=fmtFont(ns,wt); var wn=ctx.measureText(t.n).width;
  ctx.font=fmtFont(ds,wt); var wd=ctx.measureText(t.d).width;
  return Math.max(wn,wd)+10;
}
function fmtD(t,x,y,sz,wt){
  if(t.ty==='txt'){ ctx.font=fmtFont(sz,wt); ctx.fillText(t.s,x,y); return ctx.measureText(t.s).width; }
  if(t.ty==='sub'){ var ss=sz*0.7; ctx.font=fmtFont(ss,wt); ctx.fillText(t.s,x,y+sz*0.52); return ctx.measureText(t.s).width; }
  if(t.ty==='sup'){ var ss=sz*0.7; ctx.font=fmtFont(ss,wt); ctx.fillText(t.s,x,y-sz*0.60); return ctx.measureText(t.s).width; }
  var ns=sz*0.9, ds=sz*0.9;
  ctx.font=fmtFont(ns,wt); var wn=ctx.measureText(t.n).width;
  ctx.font=fmtFont(ds,wt); var wd=ctx.measureText(t.d).width;
  var fw=Math.max(wn,wd)+10, barY=y-sz*0.46;
  ctx.font=fmtFont(ns,wt); ctx.textAlign='center'; ctx.fillText(t.n, x+fw/2, barY-sz*0.20);
  ctx.font=fmtFont(ds,wt); ctx.fillText(t.d, x+fw/2, barY+sz*0.80);
  ctx.textAlign='left';
  ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=Math.max(1,sz*0.06);
  ctx.beginPath(); ctx.moveTo(x+4,barY); ctx.lineTo(x+fw-4,barY); ctx.stroke();
  return fw;
}
function fmt(s,x,y,col,sz,al,wt){
  sz=sz||13; wt=wt||'400'; al=al||'left'; s=s==null?'':String(s);
  s=fmtPreprocess(s);
  var toks=fmtParse(s), total=0, k;
  for(k=0;k<toks.length;k++) total+=fmtW(toks[k],sz,wt);
  ctx.save(); ctx.fillStyle=col||'#cfe3ff'; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  var cx=x; if(al==='center')cx=x-total/2; else if(al==='right')cx=x-total;
  for(k=0;k<toks.length;k++){ cx+=fmtD(toks[k],cx,y,sz,wt); }
  ctx.restore();
  return total;
}
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 预处理：把源码里的 a/(b)、a/b、U_H 自动转成标记（frac / sub），无需逐条改写字符串
function fmtPreprocess(s){ return _fmtPP(String(s), true); }
// 预处理：源码 a/(b)、a/b、U_H 自动转标记；带 CJK 守卫、函数参数斜杠跳过、原子保护已标记 \frac
function _fmtPP(s, allowFrac){
  s = String(s);
  var SEP = ' \t=→⟹⇒+−-×÷<>∝,;:.（）():，。、：；≈≠≤≥\n\r';
  var out = '', i = 0, n = s.length;
  while (i < n){
    var c = s[i];
    if (c === '\\'){
      var j = i + 1; while (j < n && /[a-zA-Z]/.test(s[j])) j++;
      out += s.substr(i, j - i); i = j; continue;
    }
    if (c === '_' || c === '^'){
      out += c; i++;
      if (s[i] === '{'){ var d=0,k=i; for(;k<n;k++){ if(s[k]==='{')d++; else if(s[k]==='}'){d--; if(d===0){k++;break;}} } out += s.substr(i,k-i); i=k; }
      else { out += s[i]; i++; }
      continue;
    }
    if (c === '{'){
      var d2=0,k2=i; for(;k2<n;k2++){ if(s[k2]==='{')d2++; else if(s[k2]==='}'){d2--; if(d2===0){k2++;break;}} }
      out += s.substr(i,k2-i); i=k2; continue;
    }
    if (c === '√'){
      var q = i + 1; while (q < n && s[q] === ' ') q++;
      if (s[q] === '('){
        var dep=0, kk=q; for(;kk<n;kk++){ if(s[kk]==='(')dep++; else if(s[kk]===')'){dep--; if(dep===0){kk++;break;}} }
        out += '√(' + _fmtPP(s.substr(q+1, kk-q-2), false) + ')'; i = kk; continue;
      }
      out += '√'; i++; continue;
    }
    if (allowFrac && c === '/'){
      var depth = 0;
      for (var t=0; t<i; t++){ if(s[t]==='('||s[t]==='（')depth++; else if(s[t]===')'||s[t]==='）')depth--; }
      if (depth > 0){ out += c; i++; continue; }
      var pe = i-1; while (pe>=0 && s[pe]===' ') pe--;
      var ns='', nsStart;
      if (pe>=0 && s[pe]===')'){
        var dd=0, ps=pe, openP=-1; for(;ps>=0;ps--){ if(s[ps]===')')dd++; else if(s[ps]==='('){dd--; if(dd===0){openP=ps;break;}} }
        ns = s.substr(openP+1, pe-openP-1); nsStart = openP;
      } else {
        var p3=pe; while(p3>=0 && SEP.indexOf(s[p3])<0){ ns = s[p3]+ns; p3--; }
        nsStart = p3+1;
      }
      var qe=i+1; while(qe<n && s[qe]===' ') qe++;
      var ds='', dsEnd;
      if (qe<n && s[qe]==='('){
        var ee=0, qs=qe; for(;qs<n;qs++){ if(s[qs]==='(')ee++; else if(s[qs]===')'){ee--; if(ee===0){qs++;break;}} }
        ds = s.substr(qe+1, qs-qe-2); dsEnd = qs;
      } else {
        var q3=qe; while(q3<n && SEP.indexOf(s[q3])<0){ ds+=s[q3]; q3++; }
        dsEnd = q3;
      }
      if (ns!=='' && ds!=='' && !hasCJK2(ns) && !hasCJK2(ds)){
        out = out.slice(0, out.length - (i - nsStart));
        out += '\\frac{'+ns+'}{'+ds+'}'; i = dsEnd; continue;
      }
    }
    out += c; i++;
  }
  return out;
}
function hasCJK2(ch){ if(!ch)return false; var c=ch.charCodeAt(0); return (c>=0x3400&&c<=0x4DBF)||(c>=0x4E00&&c<=0x9FFF)||(c>=0xF900&&c<=0xFAFF); }
function fmtHTML(s){
  s=fmtPreprocess(s); var out='', i=0, n=s.length;
  while(i<n){
    if(s.substr(i,5)==='\\frac'){
      i+=5; var g1=fmtBrace(s,i); i=g1.end; var g2=fmtBrace(s,i); i=g2.end;
      out+='<span class="frac"><span class="num">'+escHTML(fmtHTML(g1.s))+'</span><span class="den">'+escHTML(fmtHTML(g2.s))+'</span></span>';
    } else if(s[i]==='_'||s[i]==='^'){
      var op=s[i]; i++; var g=fmtBrace(s,i); i=g.end;
      out+=(op==='_'?'<sub>':'<sup>')+escHTML(fmtHTML(g.s))+(op==='_'?'</sub>':'</sup>');
    } else {
      var j=i; while(j<n && s[j]!=='\\' && s[j]!=='_' && s[j]!=='^') j++;
      out+=escHTML(s.substr(i,j-i)); i=j;
    }
  }
  return out;
}
// B field symbols (into page × / out of page ·) filling a polygon interior
function bfieldMarks(pts,into,step){
  ctx.save();ctx.strokeStyle='rgba(120,170,230,.5)';ctx.fillStyle='rgba(120,170,230,.5)';
  ctx.lineWidth=1.1;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(var i=0;i<pts.length;i++){ x0=Math.min(x0,pts[i][0]);x1=Math.max(x1,pts[i][0]);
    y0=Math.min(y0,pts[i][1]);y1=Math.max(y1,pts[i][1]); }
  var inset=step*0.55;
  for(var x=x0+inset;x<=x1-inset;x+=step)for(var y=y0+inset;y<=y1-inset;y+=step){
    if(!inPoly(x,y,pts))continue;
    var s=P(x,y);
    if(into){ line(s[0]-3.4,s[1]-3.4,s[0]+3.4,s[1]+3.4,'rgba(120,170,230,.45)',1.1);
      line(s[0]-3.4,s[1]+3.4,s[0]+3.4,s[1]-3.4,'rgba(120,170,230,.45)',1.1);}
    else { ctx.beginPath();ctx.arc(s[0],s[1],2,0,7);ctx.fill(); }
  }
  ctx.restore();
}
function inPoly(x,y,p){
  var c=false,n=p.length;
  for(var i=0,j=n-1;i<n;j=i++){
    var xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;
  } return c;
}
function bfieldRect(x0,y0,x1,y1,into,step){
  ctx.save();ctx.strokeStyle='rgba(120,170,230,.55)';ctx.fillStyle='rgba(120,170,230,.55)';
  ctx.lineWidth=1.2;
  for(var x=x0;x<=x1;x+=step)for(var y=y0;y<=y1;y+=step){
    var s=P(x,y);
    if(into){ line(s[0]-3.5,s[1]-3.5,s[0]+3.5,s[1]+3.5,'rgba(120,170,230,.5)',1.1);
      line(s[0]-3.5,s[1]+3.5,s[0]+3.5,s[1]-3.5,'rgba(120,170,230,.5)',1.1);}
    else { ctx.beginPath();ctx.arc(s[0],s[1],2,0,7);ctx.fill(); }
  }
  ctx.restore();
}

// ---- physics: arc from entry, center, find exit by marching ----
function makeArc(E,vel,qB,R){
  if(!isFinite(R)||R<=0)R=3;
  var sp=Math.hypot(vel[0],vel[1]); if(sp<1e-9)sp=1;
  if(!isFinite(qB)||qB===0)qB=1;
  var sgn=Math.sign(qB)||1;
  var dir=[vel[1],-vel[0]];
  var Cx=E[0]+sgn*R*dir[0]/sp, Cy=E[1]+sgn*R*dir[1]/sp;
  var a0=Math.atan2(E[1]-Cy,E[0]-Cx);
  var asign=-sgn;
  return {Cx:Cx,Cy:Cy,R:R,a0:a0,asign:asign,sp:sp};
}
function posAt(a,s){ return [a.Cx+a.R*Math.cos(a.a0+a.asign*s),
                             a.Cy+a.R*Math.sin(a.a0+a.asign*s)]; }
function tanAt(a,s){ // unit velocity dir
  var ang=a.a0+a.asign*s;
  return [a.asign*-Math.sin(ang), a.asign*Math.cos(ang)];
}

// region inField functions
function inLine(p,P0,n){ return (p[0]-P0[0])*n[0]+(p[1]-P0[1])*n[1] >= -1e-6; }
function inBand(p,P0,n1,P1,n2){ return inLine(p,P0,n1)&&inLine(p,P1,n2); }
function inRect(p,x0,y0,x1,y1){ return p[0]>=x0-1e-6&&p[0]<=x1+1e-6&&p[1]>=y0-1e-6&&p[1]<=y1+1e-6; }
function inCircle(p,O,Rc){ return Math.hypot(p[0]-O[0],p[1]-O[1])<=Rc+1e-6; }

function findExit(a,E,inF){
  var ds=0.004, sMax=2*Math.PI+0.01, s=0, prev=true;
  while(s<sMax){
    s+=ds; var pos=posAt(a,s); var inn=inF(pos);
    if(prev&&!inn){ // refine
      var lo=s-ds, hi=s;
      for(var it=0;it<22;it++){ var mid=(lo+hi)/2; if(inF(posAt(a,mid)))lo=mid; else hi=mid; }
      return lo;
    }
    prev=inn;
  }
  return sMax;
}
function ease(x){ return x<0?0:x>1?1:x*x*(3-2*x); }

// ============================================================
// MODELS
// ============================================================
function regPoly(pts){ return pts; }
var M=[]; // models

// generic bounded-field renderer
function drawBound(m,p){
  var g=m._geo, E=g.E, a=g.arc, sw=g.sweep;
  // region
  if(g.kind==='line'){
    var A=g.lA,B=g.lB; var sa=P(A[0],A[1]),sb=P(B[0],B[1]);
    line(sa[0],sa[1],sb[0],sb[1],'#5fa8e6',2.2);
    // field shading (one side) using normal
    var nx=g.ln[0],ny=g.ln[1];
    ctx.save();ctx.fillStyle='rgba(40,90,160,.10)';ctx.beginPath();
    var ext=6;
    var p1=[A[0]+nx*ext,A[1]+ny*ext], p2=[B[0]+nx*ext,B[1]+ny*ext];
    var sA=P(A[0],A[1]),sB=P(B[0],B[1]),s1=P(p1[0],p1[1]),s2=P(p2[0],p2[1]);
    ctx.moveTo(sA[0],sA[1]);ctx.lineTo(sB[0],sB[1]);ctx.lineTo(s2[0],s2[1]);ctx.lineTo(s1[0],s1[1]);
    ctx.closePath();ctx.fill();ctx.restore();
    bfieldMarks([A,B,p2,p1], m.Binto, 0.95);
  } else if(g.kind==='parallel'){
    var A1=g.lA,B1=g.lB,A2=g.lA2,B2=g.lB2;

function bfieldMarksCircle(O,Rc,into,step){
  ctx.save();ctx.strokeStyle='rgba(120,170,230,.55)';ctx.fillStyle='rgba(120,170,230,.55)';ctx.lineWidth=1.2;
  for(var x=O[0]-Rc;x<=O[0]+Rc;x+=step)for(var y=O[1]-Rc;y<=O[1]+Rc;y+=step){
    if(Math.hypot(x-O[0],y-O[1])>Rc)continue;
    var s=P(x,y);
    if(into){ line(s[0]-3.5,s[1]-3.5,s[0]+3.5,s[1]+3.5,'rgba(120,170,230,.5)',1.1);
      line(s[0]-3.5,s[1]+3.5,s[0]+3.5,s[1]-3.5,'rgba(120,170,230,.5)',1.1);}
    else { ctx.beginPath();ctx.arc(s[0],s[1],2,0,7);ctx.fill(); }
  }
  ctx.restore();
}

function drawParticle(x,y){
  ctx.save();ctx.shadowColor='rgba(255,140,90,.6)';ctx.shadowBlur=10;
  ctx.fillStyle='#ff7a4d';ctx.beginPath();ctx.arc(x,y,5.5,0,7);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-1.6,y-1.6,1.8,0,7);ctx.fill();
  ctx.restore();
}

// ---------- build bounded model ----------
function boundedModel(cfg){
  // cfg: kind, region params, E, vel, qB, R, view, Binto, board, title
  var m={type:'bound',title:cfg.title,short:cfg.short,group:cfg.group,
    board:cfg.board,view:cfg.view,Binto:cfg.Binto,dur:cfg.dur||7.5};
  m.build=function(){
    var a=makeArc(cfg.E,cfg.vel,cfg.qB,cfg.R);
    var inF;
    if(cfg.kind==='line') inF=function(p){return inLine(p,cfg.lA,cfg.ln);};
    else if(cfg.kind==='parallel') inF=function(p){return inBand(p,cfg.lA,cfg.ln,cfg.lA2,cfg.ln2);};
    else if(cfg.kind==='rect') inF=function(p){return inRect(p,cfg.rect[0],cfg.rect[1],cfg.rect[2],cfg.rect[3]);};
    else if(cfg.kind==='circle') inF=function(p){return inCircle(p,cfg.O,cfg.Rc);};
    var sw=findExit(a,cfg.E,inF);
    m._geo={kind:cfg.kind,E:cfg.E,vel:cfg.vel,arc:a,sweep:sw,
      lA:cfg.lA,lB:cfg.lB,ln:cfg.ln,lA2:cfg.lA2,lB2:cfg.lB2,ln2:cfg.ln2,
      rect:cfg.rect,O:cfg.O,Rc:cfg.Rc};
  };
  m.render=function(p){ drawBound(m,p); };
  return m;
}

// 15 磁囚笼 · 环形磁场约束
(function(){
  var R1=1.5, R2=4.5;                       // 内 / 外边界半径
  var RC=(R2*R2-R1*R1)/(2*R2);              // 临界回旋半径 = 2.0
  var NP=36;                                // 粒子数：每 10° 一枚，共 36 种颜色
  var LOW=0.72, HIGH=1.28;                  // v / v_c
  var CAGE_L=null, CAGE_H=null;

  function angMod(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return a;}
  function rotv(v,a){var c=Math.cos(a),s=Math.sin(a);return [v[0]*c-v[1]*s,v[0]*s+v[1]*c];}
  // 从 phi0 起、绕 C 逆时针转，第一次碰到 |P|=R 的转角
  function hitAng(C,rL,R,phi0){
    var d=Math.hypot(C[0],C[1]);
    if(d<1e-9)return null;
    var c=(d*d+rL*rL-R*R)/(2*d*rL);
    if(c>1.000001||c<-1.000001)return null;
    c=Math.max(-1,Math.min(1,c));
    var A=Math.acos(c), thC=Math.atan2(-C[1],-C[0]);
    var c1=angMod(thC+A-phi0), c2=angMod(thC-A-phi0);
    if(c1<1e-4)c1+=Math.PI*2;
    if(c2<1e-4)c2+=Math.PI*2;

  var SPEC=[[0.00,255,42,42],[0.12,255,96,26],[0.24,255,158,26],[0.34,255,214,40],
            [0.44,196,255,52],[0.54,92,255,96],[0.64,56,255,196],[0.74,56,206,255],
            [0.84,60,132,255],[0.92,96,86,255],[1.00,168,64,255]];

      var th=k*Math.PI*2/NP + Math.PI/NP*0.22;

  var m={type:'instr',title:'⑮ 磁囚笼 · 环形磁场约束',short:'磁囚笼',group:'B',dur:12,

// 按到边界的远近先后进入磁场；各轨道圆(半径=R)均过会聚点 Q(0,R)，轨迹在此相交（几何会聚）。
// 到 Q 后速度反向——左手定则得新圆心 C′≠C，沿另一段圆弧抵达对径点 P′=-E 出射，
// 出磁场后再平行(+x)运动。进入/出射时刻由真实弧长(=v·t)决定：中心粒子先入先出，边缘后入后出。
(function(){
  var RF=4.0, N=9, AMAX=70*Math.PI/180, XS=-(RF+2.5); // 粒子源竖直线 x
  var m={type:'beam',title:'⑯ 圆形边界 · 平行束会聚（磁聚焦）',short:'平行束会聚',group:'B',dur:12,
    view:[-7.5,-5,17,10],Binto:true,capPos:'rightmid',
    board:[{t:'k',s:'r = R：同一竖直线出发的等速平行束，轨迹必过边界上同一点 Q'},
      {t:'x',s:'磁场外先平行(+x)运动；按到边界远近，各粒子先后进入磁场（先入先出）'},
      {t:'x',s:'过 Q 速度反向(左手定则)→另一段圆弧到对侧 P′；出磁场后再次平行(+x)'}],
    build:function(){
      var A=[]; var Smax=0;
      for(var i=0;i<N;i++){
        var al=-AMAX + (N===1?0:2*AMAX*i/(N-1));
        var Ex=-RF*Math.cos(al), Ey=RF*Math.sin(al);     // 入射点 E（左半圆）
        var Cx=Ex, Cy=Ey+RF;                              // 轨道1圆心 C(B 向里,+q 力向上)
        var a0=-Math.PI/2, aQ=-al;                        // 入射点(轨道底) → Q
        var Cpx=RF*Math.cos(al), Cpy=RF*(1-Math.sin(al)); // 轨道2圆心 C′（反向后）
        var t0=Math.PI-al, span=Math.PI/2+al;              // Q → 对侧点 P′
        var Ppx=RF*Math.cos(al), Ppy=-RF*Math.sin(al);     // 出射点 P′ = -E
        var sEnter=Ex - XS;                                // 磁场外平行段长（到边界的远近不同）
        var insideLen=Math.PI*RF;                           // 磁场内总弧长（恒定）
        var sExit=sEnter+insideLen;
        A.push({al:al,y0:Ey,E:[Ex,Ey],C:[Cx,Cy],a0:a0,aQ:aQ,
                Cp:[Cpx,Cpy],t0:t0,span:span,Pp:[Ppx,Ppy],
                x_src:XS,sEnter:sEnter,sExit:sExit});
        Smax=Math.max(Smax,sExit);
      }
      m._S=Smax+2.5;   // 出磁场后平行段长度
      m._Smax=Smax;    // 最后出射时刻
      m._A=A;
    },
    render:function(p){
      var A=m._A, S=m._S, O=[0,0];
      var PMOVE=0.80;                                    // 前 80% 播放粒子运动，后 20% 做几何分析
      var s=(p<PMOVE)? p/PMOVE*S : S;                    // 全局"路程"(=v·t)；粒子出磁场停止后冻结在末位
      var ana=(p<=PMOVE)? 0 : (p-PMOVE)/(1-PMOVE);       // 分析阶段进度(0→1)：粒子停止后才开始
      // ---- 圆形磁场区域 ----
      var sO=P(O[0],O[1]);
      ctx.save();ctx.fillStyle='rgba(40,90,160,.10)';ctx.strokeStyle='#5fa8e6';ctx.lineWidth=2.2;
      ctx.beginPath();ctx.arc(sO[0],sO[1],RF*V.sc,0,7);ctx.fill();ctx.stroke();ctx.restore();
      bfieldMarksCircle(O,RF,true,1.0);

      // ---- 路径采样（按弧长）：用于“随粒子运动长出的轨迹” ----
      function pathPt(Pp,d){
        var a_in=Pp.sEnter, len1=RF*(Math.PI/2-Pp.al), len2=RF*(Math.PI/2+Pp.al), a_out=S-Pp.sExit;
        if(d<=a_in){ var u=a_in>1e-6?d/a_in:0; return [Pp.x_src+u*(Pp.E[0]-Pp.x_src),Pp.y0]; }
        d-=a_in;
        if(d<=len1){ var f=len1>1e-9?d/len1:0, ang=Pp.a0+f*(Pp.aQ-Pp.a0); return [Pp.C[0]+RF*Math.cos(ang),Pp.C[1]+RF*Math.sin(ang)]; }
        d-=len1;
        if(d<=len2){ var g=len2>1e-9?d/len2:0, th=Pp.t0+g*Pp.span; return [Pp.Cp[0]+RF*Math.cos(th),Pp.Cp[1]+RF*Math.sin(th)]; }
        d-=len2; var u2=a_out>1e-6?Math.min(d/a_out,1):0; return [Pp.Pp[0]+u2*(S-Pp.sExit),Pp.Pp[1]];
      }
      function drawTrail(Pp,d,col,lw){
        ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
        var steps=Math.max(2,Math.ceil(d*6));
        for(var k=0;k<=steps;k++){ var dd=d*k/steps, pt=pathPt(Pp,dd), sp=P(pt[0],pt[1]); if(k===0)ctx.moveTo(sp[0],sp[1]); else ctx.lineTo(sp[0],sp[1]); }
        ctx.stroke();ctx.restore();
      }
      // ---- 各粒子轨迹：只画已走过的路径，随粒子运动“长出”（亮绿 #42f401）----
      for(var i=0;i<A.length;i++){ drawTrail(A[i], s, 'rgba(66,244,1,.95)', 2.0); }

      // ---- 粒子源竖直线（仅几何标记，不加文字）----
      var yMin=A[0].y0, yMax=A[A.length-1].y0;
      var sSA=P(XS,yMin-0.4), sSB=P(XS,yMax+0.4);
      ctx.save();ctx.strokeStyle='rgba(159,208,255,.40)';ctx.lineWidth=2;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(sSA[0],sSA[1]);ctx.lineTo(sSB[0],sSB[1]);ctx.stroke();ctx.restore();

      // ---- 会聚点 Q（仅实心点，无外圈；标注置于上方避免与轨迹重叠）----
      var sQ=P(0,RF);
      ctx.save();ctx.fillStyle='#ffd479';ctx.strokeStyle='#ffd479';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(sQ[0],sQ[1],5,0,7);ctx.fill();
      ctx.restore();
      txt('Q 会聚点',sQ[0],sQ[1]-16,'#ffd479',13,'center','700');

      // ---- 位置/速度（时间驱动） ----
      function stateAt(Pp,ss){
        if(ss < Pp.sEnter){ var u=Pp.sEnter>1e-6? ss/Pp.sEnter:0;          // 磁场外：平行 +x
          return {pos:[Pp.x_src+u*(Pp.E[0]-Pp.x_src), Pp.y0], vel:[1,0], ph:0}; }
        var sIn=ss-Pp.sEnter, len1=RF*(Math.PI/2-Pp.al), len2=RF*(Math.PI/2+Pp.al);
        if(sIn <= len1){ var f=len1>1e-9? sIn/len1:0; var ang=Pp.a0+f*(Pp.aQ-Pp.a0); // 弧1 E→Q
          return {pos:[Pp.C[0]+RF*Math.cos(ang),Pp.C[1]+RF*Math.sin(ang)], vel:[-Math.sin(ang),Math.cos(ang)], ph:1}; }
        var g=len2>1e-9? (sIn-len1)/len2:0; var th=Pp.t0+g*Pp.span;        // 弧2 Q→P′
        return {pos:[Pp.Cp[0]+RF*Math.cos(th),Pp.Cp[1]+RF*Math.sin(th)], vel:[-Math.sin(th),Math.cos(th)], ph:2};
      }
      var rep0=null; for(var i=0;i<A.length;i++){ if(Math.abs(A[i].al)<1e-3) rep0=A[i]; }

      // ---- 粒子 + 速度箭头（相位着色） ----
      for(var i=0;i<A.length;i++){ var Pp=A[i];
        var st=(s>Pp.sExit)? {pos:[Pp.Pp[0]+(s-Pp.sExit),Pp.Pp[1]], vel:[1,0], ph:3} : stateAt(Pp,s);
        var sp=P(st.pos[0],st.pos[1]);
        var col=(st.ph===1)?'#ff7a4d':(st.ph===2?'#7fffd0':'#9fd0ff');
        ctx.save();ctx.shadowColor=(st.ph===1?'rgba(255,140,90,.6)':(st.ph===2?'rgba(80,255,200,.6)':'rgba(120,180,255,.55)'));ctx.shadowBlur=9;
        ctx.fillStyle=col; ctx.beginPath();ctx.arc(sp[0],sp[1],5.2,0,7);ctx.fill();ctx.restore();
        var vl=0.9;
        if(st.ph===0||st.ph===3){ var va=P(st.pos[0]-vl,st.pos[1]), vb=P(st.pos[0]+vl,st.pos[1]);
          ctx.save();ctx.globalAlpha=0.85; arrow(va[0],va[1],vb[0],vb[1],col,1.5,7); ctx.restore(); }
        else if(Pp===rep0){ var vx=st.vel[0]*vl, vy=st.vel[1]*vl; var va=P(st.pos[0]-vx,st.pos[1]-vy), vb=P(st.pos[0]+vx,st.pos[1]+vy);
          ctx.save();ctx.globalAlpha=0.85; arrow(va[0],va[1],vb[0],vb[1],col,1.5,7); ctx.restore(); }
      }

      // ---- 几何分析：粒子出磁场停止后，取“上区”某粒子连线成菱形 O·E·C·Q ----
      // 菱形四顶点：O 磁场边界圆心(0,0)、E 粒子进磁场点、C 轨迹圆心、Q 汇聚点；四边均 = R(r=R)
      if(ana>0){
        var repU=null; for(var i=0;i<A.length;i++){ if(A[i].al>0.20){ repU=A[i]; break; } }
        if(repU){
          var E=repU.E, C=repU.C;
          var VV=[[0,0],[E[0],E[1]],[C[0],C[1]],[0,RF]];   // O → E → C → Q（闭合）
          // 逐边动画绘制（连线要求完成）
          var per=4*RF, len=ana*per;
          ctx.save();ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
          ctx.strokeStyle='#ffd479';ctx.shadowColor='rgba(255,212,121,.65)';ctx.shadowBlur=10;
          var acc=0;
          for(var k=0;k<4;k++){
            var a=VV[k], b=VV[(k+1)%4];
            var sa2=P(a[0],a[1]), sb2=P(b[0],b[1]);
            var seg=Math.hypot(b[0]-a[0],b[1]-a[1]);         // = R
            var draw=Math.min(seg,len-acc);
            if(draw>0){ var tt=draw/seg;
              ctx.beginPath();ctx.moveTo(sa2[0],sa2[1]);
              ctx.lineTo(sa2[0]+(sb2[0]-sa2[0])*tt, sa2[1]+(sb2[1]-sa2[1])*tt);ctx.stroke(); }
            acc+=seg;
          }
          ctx.restore();
          // 顶点标注（菱形接近完成时显示）
          if(ana>0.90){
            var pl=[['O 磁场圆心',[0,0],'#9fd0ff',6,14],
                    ['E 进磁场点',E,'#7fffd0',8,0],
                    ['C 轨迹圆心',C,'#ffd479',8,-2]];
            ctx.save();ctx.font='700 12px "Microsoft YaHei",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
            for(var q=0;q<pl.length;q++){ var sp2=P(pl[q][1][0],pl[q][1][1]);
              ctx.fillStyle=pl[q][2];ctx.beginPath();ctx.arc(sp2[0],sp2[1],3.6,0,7);ctx.fill();
              ctx.shadowColor=pl[q][2];ctx.shadowBlur=6;ctx.fillText(pl[q][0],sp2[0]+pl[q][3],sp2[1]+pl[q][4]);ctx.shadowBlur=0; }
            ctx.restore();
            // 结论由菱形顶点标注体现，不再叠加文字，避免与轨迹/菱形重叠
          }
        }
      }

      // ---- 阶段字幕已移至右侧面板 #note（避免与左上标题重叠）----
    }};
  M.push(m);
})();

// 17 螺旋运动（真 3D · 可调 θ 与视角）
(function(){
  var m={type:'instr',title:'⑰ 螺旋运动（3D · 可调 θ 与视角）',short:'螺旋运动',group:'B',dur:9,
    view:[-10,-5.5,10.5,5.5],
    theta:55, az:34, el:18,            // 可调参数（右侧滑块 / 拖动画面写入）
    ctl:[
      {key:'theta',label:'θ（速度与 X 轴夹角）',min:0,max:90,step:1,unit:'°'},
      {key:'az',label:'方位角（绕竖轴旋转）',min:-70,max:70,step:1,unit:'°'},
      {key:'el',label:'俯仰角（上下俯视）',min:-82,max:82,step:1,unit:'°'}],
    board:[
      {t:'k',s:'回旋半径 R = m·v⊥/(qB)'},
      {t:'x',s:'运动周期 T = 2πm/(qB)（与速率、半径无关）'},
      {t:'x',s:'螺距 h = v∥·T = 2πm·v∥/(qB)'},
      {t:'x',s:'速度分解：v⊥=v·sinθ，v∥=v·cosθ'}],
    render:function(p){
      var th=this.theta*Math.PI/180, az=this.az*Math.PI/180, el=this.el*Math.PI/180;
      var v=1, w=1;                         // 取 v=1，(qB/m)=1（仅用于几何比例）
      var R=2*v*Math.sin(th), vpar=v*Math.cos(th);   // 运动半径放大一倍（可视化放大；公式 R=mv⊥/qB 关系不变）
      var RC=2.1;                                    // 圆柱筒固定半径（不随 θ / 轨迹伸缩）
      var xL=-6.5, xR=6.5, x0=-5.0, T=2*Math.PI, tMax=2.2*T;
      var tNow=tMax*p;
      // ---- 真 3D 投影：先绕 Y 轴(az) 再绕 X 轴(el)，叠加弱透视（近大远小，强化立体）----
      var ca=Math.cos(az), sa=Math.sin(az), ce=Math.cos(el), se=Math.sin(el);
      var focal=30;   // 透视焦距（世界单位）：越大越接近正交，越小透视越强
      function proj(x,y,z){
        var x1=x*ca+z*sa, z1=-x*sa+z*ca, y1=y;
        var y2=y1*ce-z1*se, z2=y1*se+z1*ce, x2=x1;
        var persp=focal/(focal - z2);          // 近(z2大)→persp>1 放大；远→persp<1 缩小
        return [V.ox+V.sc*x2*persp, V.oy-V.sc*y2*persp, z2, persp];
      }
      function fz(z2){ return Math.max(0,Math.min(1,(z2/7+1)/2)); } // 前(亮)→后(暗)
      function depthShade(z2){ var f=fz(z2);
        var r=Math.round(70+165*f), g=Math.round(200+55*f), b=Math.round(120+125*f);
        return 'rgba('+r+','+g+','+b+','+(0.42+0.53*f).toFixed(2)+')'; }  // 远端淡、近端实

      // ---- 匀强磁场 B：沿 +X（自左向右）平行磁感线 ----
      var FY=[-3,0,3], FZ=[-3,0,3];
      ctx.save();ctx.strokeStyle='rgba(110,165,225,.28)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
      for(var a=0;a<FY.length;a++)for(var b=0;b<FZ.length;b++){
        var A0=proj(xL,FY[a],FZ[b]), B0=proj(xR,FY[a],FZ[b]);
        ctx.beginPath();ctx.moveTo(A0[0],A0[1]);ctx.lineTo(B0[0],B0[1]);ctx.stroke();
      }
      ctx.restore();
      // 磁感线箭头（沿 +X）
      ctx.save();ctx.strokeStyle='rgba(130,185,240,.6)';ctx.fillStyle='rgba(130,185,240,.6)';ctx.lineWidth=1.2;
      for(var a=0;a<FY.length;a++)for(var b=0;b<FZ.length;b++){
        if((a+b)%2)continue;
        var A0=proj(xR-3.4,FY[a],FZ[b]), B0=proj(xR-0.4,FY[a],FZ[b]);
        ctx.beginPath();ctx.moveTo(A0[0],A0[1]);ctx.lineTo(B0[0],B0[1]);ctx.stroke();
        var ang=Math.atan2(B0[1]-A0[1],B0[0]-A0[0]), h=7;
        ctx.beginPath();ctx.moveTo(B0[0],B0[1]);
        ctx.lineTo(B0[0]-h*Math.cos(ang-0.4),B0[1]-h*Math.sin(ang-0.4));
        ctx.lineTo(B0[0]-h*Math.cos(ang+0.4),B0[1]-h*Math.sin(ang+0.4));
        ctx.closePath();ctx.fill();
      }
      ctx.restore();
      txt('匀强磁场 B（沿 +X 轴 · 自左向右）', proj(xR-1,4.3,0)[0], proj(xR-1,4.3,0)[1], 'rgba(130,185,240,.95)',12,'right','700');

      // ---- 轴线（X 轴 = 螺旋中心轴 / B 方向）----
      var oL=proj(xL+0.5,0,0), oR=proj(xR-0.5,0,0);
      line(oL[0],oL[1],oR[0],oR[1],'rgba(160,190,235,.55)',1.5,[7,6]);
      txt('轴线 X', oR[0]+4, oR[1], 'rgba(160,190,235,.9)',12,'left');

      // ---- 透视圆柱（固定半径的管道，强化立体感；不随轨迹/θ 伸缩）----
      if(RC>0.05){
        var xA=xL+0.5, xB=xR-0.5, NX=46;   // 固定长度=磁场区域，不随 v∥/轨迹伸缩
        var topP=[], botP=[], capA=[], capB=[];
        for(var s2=0;s2<=NX;s2++){
          var xx=xA+(xB-xA)*s2/NX, minY=1e9, maxY=-1e9, topPt=null, botPt=null, ell=[];
          for(var k=0;k<=46;k++){var ph=k/46*2*Math.PI; var pp=proj(xx,RC*Math.cos(ph),RC*Math.sin(ph)); ell.push(pp);
            if(pp[1]<minY){minY=pp[1];topPt=pp;} if(pp[1]>maxY){maxY=pp[1];botPt=pp;}}
          topP.push(topPt); botP.push(botPt); if(s2===0)capA=ell; if(s2===NX)capB=ell;
        }
        ctx.save();
        // 圆柱面渐变：上下缘暗、中部亮 → 呈现圆管体积感
        var mI=Math.round(NX/2), gyT=topP[mI][1], gyB=botP[mI][1];
        var grad=ctx.createLinearGradient(0,gyT,0,gyB);
        grad.addColorStop(0,'rgba(55,100,160,.15)');
        grad.addColorStop(0.40,'rgba(135,185,240,.29)');
        grad.addColorStop(0.60,'rgba(135,185,240,.29)');
        grad.addColorStop(1,'rgba(42,78,132,.14)');
        ctx.fillStyle=grad;
        ctx.beginPath(); ctx.moveTo(topP[0][0],topP[0][1]);
        for(var s2=1;s2<=NX;s2++)ctx.lineTo(topP[s2][0],topP[s2][1]);
        for(var s2=NX;s2>=0;s2--)ctx.lineTo(botP[s2][0],botP[s2][1]);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(150,195,242,.40)'; ctx.lineWidth=1.1;
        ctx.beginPath(); ctx.moveTo(topP[0][0],topP[0][1]); for(var s2=1;s2<=NX;s2++)ctx.lineTo(topP[s2][0],topP[s2][1]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(botP[0][0],botP[0][1]); for(var s2=1;s2<=NX;s2++)ctx.lineTo(botP[s2][0],botP[s2][1]); ctx.stroke();
        ctx.strokeStyle='rgba(150,195,240,.35)';
        [capA,capB].forEach(function(cap){ ctx.beginPath(); for(var k=0;k<cap.length;k++){ if(k===0)ctx.moveTo(cap[k][0],cap[k][1]); else ctx.lineTo(cap[k][0],cap[k][1]); } ctx.closePath(); ctx.stroke(); });
        ctx.restore();
      }
      // ---- YZ 平面参考轴（展示三维取向）----
      var o0=proj(x0,0,0);
      var oyv=proj(x0,1.7,0), ozv=proj(x0,0,1.7);
      arrow(o0[0],o0[1],oyv[0],oyv[1],'rgba(120,235,150,.65)',1.3,6);
      arrow(o0[0],o0[1],ozv[0],ozv[1],'rgba(120,180,240,.65)',1.3,6);
      txt('Y',oyv[0]+2,oyv[1],'rgba(120,235,150,.9)',11,'left');
      txt('Z',ozv[0]+2,ozv[1],'rgba(120,180,240,.9)',11,'left');

      // ---- 运动学：沿 X 匀速 + YZ 平面匀速圆周 ----
      var xNow=x0+vpar*tNow, yNow=R*Math.cos(w*tNow), zNow=R*Math.sin(w*tNow);
      // ---- 螺旋轨迹（随 t 长出）----
      var steps=270;
      for(var i=1;i<=steps;i++){
        var tA=tNow*(i-1)/steps, tB=tNow*i/steps;
        var xA=x0+vpar*tA, xB=x0+vpar*tB;
        var yA=R*Math.cos(w*tA), zA=R*Math.sin(w*tA);
        var yB=R*Math.cos(w*tB), zB=R*Math.sin(w*tB);
        var A0=proj(xA,yA,zA), B0=proj(xB,yB,zB);
        var zc=(A0[2]+B0[2])/2;
        var perspAB=(A0[3]+B0[3])/2;
        ctx.strokeStyle=depthShade(zc);
        ctx.lineWidth=(1.1+2.0*fz(zc))*perspAB;
        ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(A0[0],A0[1]);ctx.lineTo(B0[0],B0[1]);ctx.stroke();
      }
      // ---- 当前截面圆（YZ 平面圆周，强调垂直分量）----
      if(R>0.03){

// ============================================================
// ENGINE / UI
// ============================================================
var S={idx:0,playing:true,t:0,speed:1};
function loadModel(i){
  S.idx=(i+M.length)%M.length; var m=M[S.idx];
  setView(m.view); if(m.build)m.build();
  S.t=0; updateNote(m); updateNav(); setupCtl(m);
}
// 模型专属滑块（如 ⑰ 的 θ / 视角）
function setupCtl(m){
  var box=document.getElementById('extraCtl');
  if(!m || !m.ctl){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block'; box.innerHTML='';
  var hint=document.createElement('div'); hint.className='hint';
  hint.textContent='下方滑块调参数（部分模型可在动画区拖动旋转视角）'; box.appendChild(hint);
  for(var i=0;i<m.ctl.length;i++){
    (function(c){
      var lab=document.createElement('label');
      var sp1=document.createElement('span'); sp1.textContent=c.label;
      var sp2=document.createElement('span'); sp2.textContent=(m[c.key]!==undefined?m[c.key]:c.min)+(c.unit||'');
      lab.appendChild(sp1); lab.appendChild(sp2);
      var inp=document.createElement('input'); inp.type='range';
      inp.min=c.min; inp.max=c.max; inp.step=c.step||1; inp.value=(m[c.key]!==undefined?m[c.key]:c.min);
      inp.oninput=function(){ var nv=parseFloat(inp.value); m[c.key]=nv; sp2.textContent=nv+(c.unit||''); };
      var wrap=document.createElement('div'); wrap.className='ctl';
      wrap.appendChild(lab); wrap.appendChild(inp); box.appendChild(wrap);
    })(m.ctl[i]);
  }
}
function updateNote(m){
  var el=document.getElementById('note');
  var h='<span class="h">'+m.title+'</span>';
  for(var i=0;i<m.board.length;i++){
    var b=m.board[i];
    h+='<div class="'+(b.t==='k'?'k':'')+'">• '+fmtHTML(b.s)+'</div>';
  }
  el.innerHTML=h;
}
function buildNav(){
  var na=document.getElementById('navA'), nb=document.getElementById('navB');
  for(var i=0;i<M.length;i++){ (function(i){
    var b=document.createElement('button'); b.innerHTML='<b>'+(i+1)+'</b>'+M[i].short;
    b.onclick=function(){ loadModel(i); S.playing=true; syncPlay(); };
    M[i]._btn=b; if(M[i].group==='A')na.appendChild(b); else nb.appendChild(b);
  })(i); }
}
function updateNav(){ for(var i=0;i<M.length;i++) M[i]._btn.className=(i===S.idx)?'on':''; }
function syncPlay(){ document.getElementById('play').textContent=S.playing?'⏸ 暂停':'▶ 播放'; }
// 控制按钮事件（此前缺失 → 点击播放/重置无效）
document.getElementById('play').onclick=function(){

};
document.getElementById('reset').onclick=function(){ S.t=0; S.playing=true; syncPlay(); };

// draw board captions on canvas (板书式 key line)
function drawBoardCaption(m){
  if(m.noCap)return;
  if(m.capPos==='rightmid'){
    // 右中 HUD 面板（仅模型⑯：其右侧为空白区，不与动画重叠；窄面板+贴右缘→与动画间距更大）
    var key='◆ '+m.board[0].s;
    ctx.save();
    ctx.font='700 15px "Microsoft YaHei",sans-serif';
    var maxW=210, chars=key.split(''), lines=[], cur='';
    for(var i=0;i<chars.length;i++){
      var t=cur+chars[i];
      if(cur && ctx.measureText(t).width>maxW){ lines.push(cur); cur=chars[i]; } else cur=t;
    }
    if(cur)lines.push(cur);
    var lh=21, padX=12, padY=9;
    var pw=0; for(var i=0;i<lines.length;i++) pw=Math.max(pw,ctx.measureText(lines[i]).width);
    pw+=padX*2; var ph=lines.length*lh+padY*2;
    var px=W-pw-6, py=Math.round(H/2-ph/2);
    ctx.fillStyle='rgba(8,16,32,.74)'; ctx.fillRect(px,py,pw,ph);
    ctx.fillStyle='#ffd479'; ctx.textAlign='left'; ctx.textBaseline='middle';
    for(var i=0;i<lines.length;i++) ctx.fillText(lines[i], px+padX, py+padY+lh/2+i*lh);
    ctx.restore();
  } else {
    // 默认：底部条（竖式分式需要更高条高）
    var key='◆ '+m.board[0].s;
    ctx.save();
    ctx.fillStyle='rgba(8,16,32,.72)';
    var bh=46; ctx.fillRect(0,H-bh,W,bh);
    ctx.fillStyle='#ffd479';ctx.textBaseline='alphabetic';ctx.textAlign='left';
    fmt(key, 18, H-bh/2+5, '#ffd479', 15, 'left', '700');
    ctx.restore();
  }
}
function drawWaterMark(){
  var txts='force99'; var t=Date.now()/900;
  ctx.save();ctx.font='700 13px "Microsoft YaHei"';ctx.textAlign='right';ctx.textBaseline='bottom';
  var baseCol='rgba(176,216,255,.30)';
  ctx.fillStyle=baseCol; ctx.fillText(txts,W-12,H-4);
  var idx=(t%(txts.length+3));
  for(var k=0;k<txts.length;k++){
    var ch=txts[k]; var x=W-12-(txts.length-k)*8;
    var d=Math.abs(idx-k);
    var b=Math.exp(-d*d*1.6);
    if(b>0.05){ var g=b; ctx.fillStyle='rgba(255,244,255,'+(g*0.9)+')';
      // light halo
      ctx.shadowColor='rgba(120,200,255,'+g+')';ctx.shadowBlur=8*g;
      ctx.fillText(ch,x,H-4); ctx.shadowBlur=0; }
  }
  ctx.restore();
}

function frame(ts){
  if(!frame._last)frame._last=ts; var dt=(ts-frame._last)/1000; frame._last=ts; if(dt>0.05)dt=0.05;
  var m=M[S.idx]; var dur=m.dur||8;
  if(S.playing){ S.t+=dt*S.speed; if(S.t>=dur){S.t=dur; S.playing=false; syncPlay();} }
  document.getElementById('progI').style.width=(S.t/dur*100)+'%';
  try{
    ctx.clearRect(0,0,W,H);
    m.render(S.t/dur);
    drawBoardCaption(m);
    drawWaterMark();
  }catch(e){ if(!window.__drawErr)window.__drawErr=String(e); }
  requestAnimationFrame(frame);
}

// init
window.addEventListener('resize',function(){ hidpi(); if(M[S.idx])setView(M[S.idx].view); });
buildNav(); hidpi(); loadModel(0); syncPlay(); requestAnimationFrame(frame);
// test hook (harmless)
window.__seek=function(i,p){ loadModel(i); S.playing=false; syncPlay();
  S.t=(p==null?0:p)*(M[i].dur||8);
  var mm=M[S.idx], dur=mm.dur||8;
  ctx.clearRect(0,0,W,H); mm.render(S.t/dur); drawBoardCaption(mm); drawWaterMark(); };
window.__MODELS=M; window.__S=S;
// ⑰ 等：在动画区拖动鼠标旋转 3D 视角（同步右侧滑块）
(function(){
  var dragging=false, lx=0, ly=0;
  cv.addEventListener('pointerdown',function(e){
    var m=M[S.idx];
    if(m && m.ctl && m.az!==undefined && m.el!==undefined){
      dragging=true; lx=e.clientX; ly=e.clientY;
      try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    }
  });
  cv.addEventListener('pointermove',function(e){
    if(!dragging)return; var m=M[S.idx];
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    m.az=Math.max(-70,Math.min(70,m.az+dx*0.35));
    m.el=Math.max(-82,Math.min(82,m.el-dy*0.35));
    var box=document.getElementById('extraCtl');
    var ins=box.querySelectorAll('input');
    if(ins[1])ins[1].value=Math.round(m.az);
    if(ins[2])ins[2].value=Math.round(m.el);
    var vs=box.querySelectorAll('label span:last-child');
    if(vs[1])vs[1].textContent=Math.round(m.az)+'°';
    if(vs[2])vs[2].textContent=Math.round(m.el)+'°';
  });
  window.addEventListener('pointerup',function(){ dragging=false; });
})();
})();
</script>
