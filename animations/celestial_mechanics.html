/* ============================================================
   模型 11：地月转移全程
   任务时间驱动 + 各阶段独立倍率（尺度差异达 60 倍，单一倍率不可用）
   ============================================================ */
const RP11  = R_E + 2.0e5;                 // 停泊轨道半径 6571 km
// 远地点略超出月球轨道 8000km：若正好等于地月距离，飞船会与月球"重合"
const RA11  = D_MOON + 8.0e6;
const A11   = (RP11 + RA11) / 2;
const E11   = (RA11 - RP11) / (RA11 + RP11);
const TT11  = Math.PI * Math.sqrt(A11**3 / GM_E);    // 转移时间（半个椭圆周期）
const N11   = TAU / period(A11, GM_E);               // 平均角速度
const T_PK  = period(RP11, GM_E);                    // 停泊轨道周期
const R_ORB = R_M + 1.0e5;                           // 环月轨道 1837 km
const T_ORB = period(R_ORB, GM_M);                   // 环月周期
const OM_M  = TAU / T_MOON;                          // 月球公转角速度
const TH_P  = Math.PI + 0.55;                        // 转移轨道近地点方向
const RR11  = RA11 - D_MOON;                         // 远地点处飞船与月球的距离

const PH11 = [
  { nm:'待发射 · 火箭竖立',    dur: 60,      rate: 30 },
  { nm:'发射上升 · 入轨',      dur: 600,     rate: 100 },
  { nm:'近地停泊轨道',         dur: T_PK,    rate: 2000 },
  { nm:'地月转移（霍曼轨道）', dur: TT11,    rate: 25000 },
  { nm:'制动捕获 · 进入环月',  dur: 900,     rate: 200 },
  { nm:'环月飞行',             dur: 2*T_ORB, rate: 2000 },
  { nm:'动力下降 · 着陆',      dur: 800,     rate: 100 },
  { nm:'着陆月面',             dur: 300,     rate: 30 }
];
const PB11 = (() => { let a = 0; return PH11.map(p => (a += p.dur)); })();
// 月球初始相位（这就是"发射窗口"）：使飞船抵达远地点时月球恰好在那里。
// 注意转移段从 PB11[2] 才开始，因此要把这之前月球已公转的角度一并扣除，
// 否则飞船飞到远地点时月球还差约 0.9°，与制动段起点衔接不上。
// 上升段结束时地球已自转过 W_E·PB11[1]，转移轨道的近地点方向须同步修正，
// 否则停泊段与转移段衔接处会跳变约 300 km
const TH_T  = TH_P + W_E * PB11[1];
const TH_M0 = TH_T + Math.PI - OM_M * (PB11[2] + TT11);
const TH_M4 = TH_M0 + OM_M * PB11[3];      // 制动段开始时月球的方向（应等于 TH_T + π）

const M11 = { t: 0, cam: { x:0, y:0, s:0 }, traj: [], done: false };

function m11Phase(t) {
  for (let i = 0; i < PB11.length; i++) if (t < PB11[i]) return i;
  return PH11.length - 1;
}
function m11Moon(t) {
  const a = TH_M0 + OM_M * t;
  return [D_MOON*Math.cos(a), D_MOON*Math.sin(a)];
}
function m11Pos(t) {
  const M  = m11Moon(t);
  const ph = m11Phase(t);
  const t0 = ph === 0 ? 0 : PB11[ph-1];
  const f  = (t - t0) / PH11[ph].dur;
  const W_PK = TAU / T_PK;
  if (ph === 0) {                                    // 待发射（随地球自转）
    const a = TH_P - 0.55 + W_E*t;
    return { x: R_E*Math.cos(a), y: R_E*Math.sin(a) };
  }
  if (ph === 1) {                                    // 上升入轨
    const r = R_E + (RP11 - R_E)*f;
    const a = TH_P - 0.55 + W_E*t + 0.55*f;
    return { x: r*Math.cos(a), y: r*Math.sin(a) };
  }
  if (ph === 2) {                                    // 停泊圆轨道
    const a = TH_T + W_PK*(t - t0);
    return { x: RP11*Math.cos(a), y: RP11*Math.sin(a) };
  }
  if (ph === 3) {                                    // 地月转移（开普勒椭圆）
    const kp = keplerPos(A11, E11, N11*(t - t0));
    const c = Math.cos(TH_T), s = Math.sin(TH_T);
    return { x: kp.x*c - kp.y*s, y: kp.x*s + kp.y*c };
  }
  // 以下各段以 TH_M4（制动开始时月球的方向）为角度基准，保证段间衔接连续
  if (ph === 4) {                                    // 制动：绕行并降轨
    const rr = RR11 + (R_ORB - RR11)*f;
    const a  = TH_M4 + 1.25*Math.PI*f;
    return { x: M[0] + rr*Math.cos(a), y: M[1] + rr*Math.sin(a) };
  }
  if (ph === 5) {                                    // 环月圆轨道
    const a = TH_M4 + 1.25*Math.PI + (TAU/T_ORB)*(t - t0);
    return { x: M[0] + R_ORB*Math.cos(a), y: M[1] + R_ORB*Math.sin(a) };
  }
  if (ph === 6) {                                    // 动力下降
    const rr = R_ORB + (R_M - R_ORB)*f;
    const a  = TH_M4 + 1.25*Math.PI + 0.75*Math.PI*f;
    return { x: M[0] + rr*Math.cos(a), y: M[1] + rr*Math.sin(a) };
  }
  const a = TH_M4 + 2*Math.PI;                       // 已着陆月面
  return { x: M[0] + R_M*Math.cos(a), y: M[1] + R_M*Math.sin(a) };
}

function drawMoon(cx, cy, R) {
  if (R < 1.5) { circle(cx, cy, Math.max(1, R), '#8a8f9a', '#c9ced8', 1); return; }
  const halo = ctx.createRadialGradient(cx, cy, R*0.9, cx, cy, R*1.5);
  halo.addColorStop(0, 'rgba(200,205,215,0.22)');
  halo.addColorStop(1, 'rgba(200,205,215,0)');
  circle(cx, cy, R*1.5, halo);
  const g = ctx.createRadialGradient(cx - R*0.35, cy - R*0.35, R*0.15, cx, cy, R);
  g.addColorStop(0, '#dcdee4'); g.addColorStop(0.65, '#9aa0ab'); g.addColorStop(1, '#5c626d');
  circle(cx, cy, R, g, '#c9ced8', 1);
  ctx.fillStyle = 'rgba(90,96,106,.42)';             // 环形山
  [[-0.35,-0.20,0.20],[0.28,-0.32,0.14],[0.10,0.38,0.17],
   [-0.42,0.30,0.12],[0.45,0.12,0.10],[-0.05,-0.48,0.09]].forEach(c => {
    ctx.beginPath(); ctx.arc(cx + c[0]*R, cy + c[1]*R, c[2]*R, 0, TAU); ctx.fill();
  });
}

MODELS.push({
  id: 11, name: '地月转移全程', tag: '综合 · 发射 → 转移 → 环月 → 着陆',
  ctrl: [
    { type:'btn',   label:'↻ 重新发射',
      fn:()=>{ M11.t=0; M11.done=false; M11.traj=[]; M11.cam={x:0,y:0,s:2.6*R_E}; } },
    { type:'btn',   label:'跳到转移', fn:()=>{ M11.t=PB11[2]+1; M11.traj=[]; M11.done=false; } },
    { type:'btn',   label:'跳到着陆', fn:()=>{ M11.t=PB11[5]+1; M11.traj=[]; M11.done=false; } },
    { type:'check', key:'trj',  label:'飞行轨迹', val:true },
    { type:'check', key:'orb',  label:'转移轨道', val:true },
    { type:'check', key:'morb', label:'月球轨道', val:true }
  ],
  init() {
    S.params = {}; M11.t = 0; M11.done = false; M11.traj = [];
    M11.cam = { x:0, y:0, s: 2.6*R_E };
  },
  step(dt, realDt) {
    if (M11.done) { S.t += dt; return; }
    const rd = (realDt || 0) * S.speed;
    const ph = m11Phase(M11.t);
    M11.t += rd * PH11[ph].rate;                     // 各阶段用各自的倍率推进
    if (M11.t >= PB11[PB11.length-1]) { M11.t = PB11[PB11.length-1]; M11.done = true; }
    S.t = M11.t;
    const p  = m11Pos(M11.t);
    const ls = M11.traj[M11.traj.length-1];
    if (!ls || Math.hypot(p.x-ls[0], p.y-ls[1]) > 1.2e5) M11.traj.push([p.x, p.y]);
    if (M11.traj.length > 2600) M11.traj.shift();
  },
  draw() {
    const ph = m11Phase(M11.t);
    const Mn = m11Moon(M11.t);

    // 相机：随阶段切换视场中心与尺度（指数平滑，避免跳变）
    let tx = 0, ty = 0, ts;
    if      (ph <= 2) { ts = 2.6*R_E; }
    else if (ph === 3){ ts = 1.25*D_MOON; }
    else              { tx = Mn[0]; ty = Mn[1]; ts = 6.5*R_M; }
    M11.cam.x += (tx - M11.cam.x)*0.06;
    M11.cam.y += (ty - M11.cam.y)*0.06;
    M11.cam.s += (ts - M11.cam.s)*0.06;

    const kx = Math.min(CW*0.46, CH*0.44) / M11.cam.s;
    const SX = wx => CW/2 + (wx - M11.cam.x)*kx;
    const SY = wy => CH/2 - (wy - M11.cam.y)*kx;

    if (S.params.morb !== false)                     // 月球轨道
      dashCircle(SX(0), SY(0), D_MOON*kx, 'rgba(127,216,232,.18)', 1, [4,6]);

    if (S.params.orb !== false) {                    // 转移椭圆（完整形状）
      ctx.beginPath();
      const c = Math.cos(TH_T), s = Math.sin(TH_T);
      for (let i = 0; i <= 220; i++) {
        const q = keplerPos(A11, E11, i/220*TAU);
        const X = q.x*c - q.y*s, Y = q.x*s + q.y*c;
        const ax = SX(X), ay = SY(Y);
        if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
      }
      ctx.strokeStyle = 'rgba(255,216,102,.32)'; ctx.lineWidth = 1.3;
      ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
    }

    if (S.params.trj !== false && M11.traj.length > 1) {
      ctx.beginPath();
      M11.traj.forEach((q, i) => {
        const ax = SX(q[0]), ay = SY(q[1]);
        if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
      });
      ctx.strokeStyle = '#ffd866'; ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.75; ctx.stroke(); ctx.globalAlpha = 1;
    }

    const er = R_E*kx;                               // 地球
    if (er > 1.2) drawEarth(SX(0), SY(0), er, (S.t/DAY)*360, 1);

    if (ph >= 4)                                     // 环月轨道
      dashCircle(SX(Mn[0]), SY(Mn[1]), R_ORB*kx, 'rgba(255,181,103,.35)', 1, [3,4]);

    drawMoon(SX(Mn[0]), SY(Mn[1]), R_M*kx);          // 月球

    const p = m11Pos(M11.t), px = SX(p.x), py = SY(p.y);
    const gl = ctx.createRadialGradient(px, py, 0, px, py, 11);
    gl.addColorStop(0, 'rgba(255,216,102,.75)'); gl.addColorStop(1, 'rgba(255,216,102,0)');
    circle(px, py, 11, gl);
    circle(px, py, 4, '#ffd866', '#fff', 1.2);

    // 顶部：当前阶段与任务时间
    const dd = Math.floor(M11.t/86400), hh = Math.floor(M11.t%86400/3600);
    const tm = dd > 0 ? dd + ' 天 ' + hh + ' 小时' : Math.floor(M11.t/60) + ' 分';
    text(PH11[ph].nm + '　·　任务时间 ' + tm, 14, 22, '#ffd866', '13px sans-serif');

    // 底部：阶段进度条
    const bw = CW - 28, bh = 8, bx = 14, by = CH - 34;
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(bx, by, bw, bh);
    PH11.forEach((s, i) => {
      const x0 = bx + bw*(i === 0 ? 0 : PB11[i-1])/PB11[PB11.length-1];
      const x1 = bx + bw*PB11[i]/PB11[PB11.length-1];
      ctx.fillStyle = i < ph ? '#ffd866' : (i === ph ? '#7ee787' : 'rgba(255,255,255,.10)');
      ctx.fillRect(x0, by, Math.max(1, x1-x0-1), bh);
    });
    const cx0 = bx + bw*Math.min(1, M11.t/PB11[PB11.length-1]);
    line(cx0, by-3, cx0, by+bh+3, '#fff', 1.6);
    text(PH11[ph].nm, bx, by - 6, '#8fa4c0', '11px sans-serif');
    if (M11.done) text('已着陆月面 · 按「重新发射」重播', bx, CH-14, '#7ee787', '11.5px sans-serif');
  },
  readout() {
    const ph = m11Phase(M11.t);
    const p  = m11Pos(M11.t), M = m11Moon(M11.t);
    const dE = Math.hypot(p.x, p.y), dM = Math.hypot(p.x-M[0], p.y-M[1]);
    const q1 = m11Pos(Math.max(0, M11.t-1)), q2 = m11Pos(M11.t+1);
    const v  = Math.hypot(q2.x-q1.x, q2.y-q1.y) / 2;      // 数值差分求速率
    const alt = ph >= 4 ? dM - R_M : dE - R_E;            // 高度（相对所绕天体）
    const dv = Math.max(0, Math.sqrt(Math.max(0, (0.84e3)**2
                 + 2*GM_M/R_ORB)) - Math.sqrt(GM_M/R_ORB));
    return '<table class="rd"><tr><th>量</th><th>数值</th></tr>' +
      '<tr><td>当前阶段</td><td class="hl">' + PH11[ph].nm + '</td></tr>' +
      '<tr><td>任务时间</td><td class="hl">' + (M11.t/86400).toFixed(2) + ' 天</td></tr>' +
      '<tr><td>距地球</td><td class="hl">' + (dE/1000).toFixed(0) + ' km</td></tr>' +
      '<tr><td>距月球</td><td class="hl">' + (dM/1000).toFixed(0) + ' km</td></tr>' +
      '<tr><td>轨道高度</td><td class="hl">' + (alt/1000).toFixed(0) + ' km</td></tr>' +
      '<tr><td>当前速率</td><td class="hl">' + (v/1000).toFixed(3) + ' km/s</td></tr>' +
      '<tr><td>转移总时长</td><td class="hl">' + (TT11/86400).toFixed(2) + ' 天</td></tr>' +
      '<tr><td>制动 Δv（估）</td><td class="hl">' + (dv/1000).toFixed(2) + ' km/s</td></tr>' +
      '</table>';
  }
});

/* ============================================================
   引导与动画主循环
   ============================================================ */
// 各模型的物理时间加速倍率（真实秒 / 动画秒）
// 索引即模型 id。模型11 自管各阶段倍率，故置 1（其 step 用 realDt 自行推进）
const TIMESCALE = [0, 3.0e6, 800, 3.0e6, 900, 900, 900, 1500, 1, 3.0e6, 900, 1];

function buildSidebar() {
  const box = document.getElementById('sidebar');
  box.innerHTML = '<div class="grp">天体运动模型</div>';
  MODELS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'mbtn' + (m.id === S.model ? ' on' : '');
    b.innerHTML = '<span class="num">' + m.id + '</span><span class="nm">' + m.name + '</span>';
    b.addEventListener('click', () => switchModel(m.id));
    box.appendChild(b);
  });
}

function renderTeach(m) {
  const T = TEACH[m.id];
  let h = '<h2>' + T.title + '</h2><div class="tag">' + T.tag + '</div>';
  T.sec.forEach(s => {
    h += '<div class="sec ' + (s.t || '') + '"><h3>' + s.h + '</h3>' + s.c + '</div>';
  });
  h += '<div class="sec"><h3>实时数据</h3><div id="liveData"></div></div>';
  document.getElementById('teach').innerHTML = h;
  document.getElementById('teach').scrollTop = 0;
}

function switchModel(id) {
  S.model = id;
  const m = MODELS.find(x => x.id === id);
  S.t = 0;
  S.params = {};
  if (m.init) m.init();
  buildSidebar();
  buildCtrl(m);
  renderTeach(m);
  document.getElementById('curNo').textContent = id;
  document.getElementById('curName').textContent = m.name;
  document.getElementById('badge').innerHTML = '模型 ' + id + ' · <b>' + m.name + '</b>';
  if (m.draw) { clear(); drawStars(); m.draw(); }
}

/* ---- 控件事件 ---- */
document.getElementById('btnPlay').addEventListener('click', () => {
  S.playing = !S.playing;
  document.getElementById('btnPlay').textContent = S.playing ? '⏸ 暂停' : '▶ 播放';
});
document.getElementById('btnReset').addEventListener('click', () => {
  const m = MODELS.find(x => x.id === S.model);
  S.t = 0;
  if (m.init) m.init();
  buildCtrl(m);
});
document.getElementById('spd').addEventListener('input', e => {
  S.speed = parseFloat(e.target.value);
  document.getElementById('spdV').textContent = S.speed.toFixed(1) + '×';
});
document.getElementById('cbTrail').addEventListener('change', e => {
  S.trail = e.target.checked;
});

/* ---- 主循环 ---- */
let lastT = performance.now(), liveAcc = 0;
function loop(now) {
  const realDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const m = MODELS.find(x => x.id === S.model);
  if (m) {
    if (S.playing && m.step) {
      // 第 2 个参数传实时秒，供 UI 过渡动画使用（物理时间已被放大，不适合做 UI 计时）
      m.step(realDt * S.speed * (TIMESCALE[S.model] || 1), realDt * S.speed);
    }
    clear(); drawStars();
    if (m.draw) m.draw();
    // 实时数据（限频刷新，避免频繁重排）
    liveAcc += realDt;
    if (liveAcc > 0.25) {
      liveAcc = 0;
      const ld = document.getElementById('liveData');
      if (ld && m.readout) {
        const html = m.readout();
        if (html) ld.innerHTML = html;
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
resize();
switchModel(1);
requestAnimationFrame(loop);

// 键盘：空格暂停，左右方向键切换模型
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPlay').click(); }
  else if (e.code === 'ArrowRight') switchModel(Math.min(9, S.model + 1));
  else if (e.code === 'ArrowLeft')  switchModel(Math.max(1, S.model - 1));
});
</script>
